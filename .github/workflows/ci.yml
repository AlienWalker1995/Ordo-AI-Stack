name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Secret scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@b06f6d72a3791308bb7ba59c2b8cb7a083bd17e4 # v3.88.26
        with:
          # Lob detector excluded: it false-positives on `test_` + 35-word-char strings (its
          # verifier returns a bogus "verified" result), and this stack has no Lob integration —
          # so a long test function name in git history was failing the gate. Every other detector
          # stays on; digest pins are NOT the FP source and remain. See tests/test_gpu_gate.py:373.
          extra_args: --results=verified,unknown --exclude-detectors=lob

  pytest:
    name: Pytest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install dependencies
        run: pip install -r tests/requirements.txt

      - name: Ruff lint
        run: python -m ruff check .

      # tests/substrate/ is the render-engine suite — it runs in the path-gated `substrate`
      # job below (with its own pinned deps), so exclude it here to avoid double-running.
      # `docker` tests run in the `docker` job, against real containers.
      - name: Run tests
        run: python -m pytest tests/ -v --ignore=tests/substrate -m "not docker"

  frontend:
    name: Dashboard frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/dashboard/dashboard/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'services/dashboard/dashboard/frontend/**'
              - '.github/workflows/ci.yml'

      - name: Set up Node
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: services/dashboard/dashboard/frontend/package-lock.json

      - name: Install pinned deps
        if: steps.filter.outputs.frontend == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.filter.outputs.frontend == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.filter.outputs.frontend == 'true'
        run: npm run lint

      - name: Build
        if: steps.filter.outputs.frontend == 'true'
        run: npm run build

      # Component tests against test/fixtures; the pytest job checks those fixtures still match
      # the backend's responses (tests/test_dashboard_frontend_fixtures.py).
      - name: Component tests (vitest)
        if: steps.filter.outputs.frontend == 'true'
        run: npm test

      - name: Install Playwright's Chromium
        if: steps.filter.outputs.frontend == 'true'
        run: npx playwright install --with-deps chromium

      # The built SPA with the API mocked from the same fixtures: every page at 414 and 1280 px.
      - name: Smoke (Playwright)
        if: steps.filter.outputs.frontend == 'true'
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure() && steps.filter.outputs.frontend == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: services/dashboard/dashboard/frontend/playwright-report/
          retention-days: 7

      - name: Skip (no frontend changes)
        if: steps.filter.outputs.frontend != 'true'
        run: echo "Skipping the dashboard frontend - no changes under its paths."

  substrate:
    name: substrate (mocked-profile)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            substrate:
              - 'ordo/**'
              - 'catalog/**'
              - 'services/**'
              - 'assets/**'
              - 'tests/substrate/**'
              - 'ordo.example.yaml'
              - 'requirements-dev.txt'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'

      - name: Set up Python
        if: steps.filter.outputs.substrate == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 3.11: the version the ops-controller image runs ordo/ on.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned deps
        if: steps.filter.outputs.substrate == 'true'
        run: pip install -r requirements-dev.txt

      # No GPU on CI runners — every test uses a MOCKED hardware profile (the merge-gate
      # "mocked-profile CI" requirement). Also proves the config renders from a clean checkout.
      - name: Pytest (mocked profiles)
        if: steps.filter.outputs.substrate == 'true'
        run: PYTHONPATH=. python -m pytest tests/substrate -q -m "not docker"

      - name: Fresh-install render smoke
        if: steps.filter.outputs.substrate == 'true'
        run: |
          PYTHONPATH=. python -m ordo --source ordo.example.yaml render --out /tmp/ordo-out
          test -f /tmp/ordo-out/.env && test -f /tmp/ordo-out/docker-compose.yml

      # Prove the rendered compose is loadable by the REAL docker engine (not just a well-shaped
      # dict). `config` parses + validates; it does not create or start anything.
      # BASE_PATH and DATA_PATH back every host bind via ${VAR:?...} fail-loud guards (the deny-all
      # empty-mount outage class). The generic example leaves them unset, so add CI-only
      # placeholders (never used at runtime). The edge stays off: the example sets no CADDY_* keys.
      - name: Rendered compose validates (docker engine)
        if: steps.filter.outputs.substrate == 'true'
        run: |
          echo "BASE_PATH=." >> /tmp/ordo-out/.env
          echo "DATA_PATH=./data" >> /tmp/ordo-out/.env
          docker compose -f /tmp/ordo-out/docker-compose.yml --env-file /tmp/ordo-out/.env config >/dev/null
          echo "rendered compose accepted by docker compose config"

      # The operator's first run, end to end: the headless wizard, a render, and the engine check
      # with ONLY the generated env files. Any site key a default plugin cannot run without must
      # be recorded by the wizard or gate the plugin off; a hand-added variable here would hide that.
      - name: Fresh install renders and validates
        if: steps.filter.outputs.substrate == 'true'
        run: |
          pip install -e .
          ordo init --yes --out /tmp/fresh/out
          ordo render --source /tmp/fresh/out/ordo.yaml --out /tmp/fresh/out
          docker compose -f /tmp/fresh/out/docker-compose.yml --env-file /tmp/fresh/out/.env \
            --env-file /tmp/fresh/out/secrets.env config -q

      - name: Skip (no substrate changes)
        if: steps.filter.outputs.substrate != 'true'
        run: echo "Skipping substrate — no changes under the render-engine paths."

  # Every test marked `docker` (pyproject.toml): they skip wherever no daemon or no live container
  # answers, so the jobs above never run them. Here docker is real and ORDO_REQUIRE_DOCKER=1 turns
  # any such skip into a failure (tests/conftest.py).
  docker:
    name: docker (real containers)
    runs-on: ubuntu-24.04
    env:
      ORDO_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            docker:
              - 'ordo/**'
              - 'catalog/**'
              - 'services/**'
              - 'auth/**'
              - 'scripts/ci/**'
              - 'tests/conftest.py'
              - 'tests/substrate/test_backend_contract.py'
              - 'tests/test_secrets_isolation.py'
              - 'tests/test_hermes_docker_access.py'
              - 'ordo.example.yaml'
              - 'requirements-dev.txt'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'

      - name: Set up Python
        if: steps.filter.outputs.docker == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            tests/requirements.txt

      # Both sets: the live checks are collected from tests/, whose modules import the dashboard.
      - name: Install pinned deps
        if: steps.filter.outputs.docker == 'true'
        run: |
          pip install -r requirements-dev.txt -r tests/requirements.txt
          pip install -e .

      # MockBackend and DockerBackend held to one behavioural contract, the real half on throwaway
      # compose projects of digest-pinned busybox (tests/substrate/test_backend_contract.py).
      - name: Backend contract (real docker)
        if: steps.filter.outputs.docker == 'true'
        run: PYTHONPATH=. python -m pytest tests/substrate -m docker -q -rs

      # The smallest real stack the live checks need (agent, ops-controller, caddy, hermes-dashboard),
      # brought up by the operator's own commands. Builds the Hermes and ops-controller images.
      - name: Bring up the live stack
        if: steps.filter.outputs.docker == 'true'
        run: bash scripts/ci/live-stack-up.sh

      - name: Live docker checks (secrets isolation, Hermes docker access)
        if: steps.filter.outputs.docker == 'true'
        run: python -m pytest tests -m docker --ignore=tests/substrate -q -rs

      - name: Skip (no docker-relevant changes)
        if: steps.filter.outputs.docker != 'true'
        run: echo "Skipping the docker job - no changes under its paths."
