name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@v3.88.26
        with:
          extra_args: --results=verified,unknown

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install dependencies
        run: pip install -r tests/requirements.txt

      - name: Ruff lint
        run: python -m ruff check ordo dashboard tests services/rag scripts services/comfyui-mcp services/orchestration worker docker hermes services/qdrant-rag

      - name: Create minimal .env for compose tests
        run: |
          echo "BASE_PATH=." > .env
          echo "OPS_CONTROLLER_TOKEN=placeholder-for-ci" >> .env

      # tests/substrate/ is the render-engine suite — it runs in the path-gated `substrate`
      # job below (with its own pinned deps), so exclude it here to avoid double-running.
      - name: Run tests
        run: python -m pytest tests/ -v --ignore=tests/substrate

  substrate:
    name: substrate (mocked-profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            substrate:
              - 'ordo/**'
              - 'catalog/**'
              - 'plugins/**'
              - 'agents/**'
              - 'dashboards/**'
              - 'docker/**'
              - 'assets/**'
              - 'tests/substrate/**'
              - 'ordo.example.yaml'
              - 'requirements-dev.txt'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'

      - name: Set up Python
        if: steps.filter.outputs.substrate == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned deps
        if: steps.filter.outputs.substrate == 'true'
        run: pip install -r requirements-dev.txt

      # ops-api's substrate tests (test_ops_api_stats — the /stats/services concurrency
      # regression guard) importorskip fastapi; without these deps they skipped on every
      # CI run since the guard was written (audit P1-9/P1-10).
      - name: Install ops-api deps (so its substrate tests actually run)
        if: steps.filter.outputs.substrate == 'true'
        run: pip install -r services/ops-api/requirements.txt

      # No GPU on CI runners — every test uses a MOCKED hardware profile (the merge-gate
      # "mocked-profile CI" requirement). Also proves the config renders from a clean checkout.
      - name: Pytest (mocked profiles)
        if: steps.filter.outputs.substrate == 'true'
        run: PYTHONPATH=. python -m pytest tests/substrate -q

      - name: Fresh-install render smoke
        if: steps.filter.outputs.substrate == 'true'
        run: |
          PYTHONPATH=. python -m ordo --source ordo.example.yaml render --out /tmp/ordo-out
          test -f /tmp/ordo-out/.env && test -f /tmp/ordo-out/docker-compose.yml

      # Prove the rendered compose is loadable by the REAL docker engine (not just a well-shaped
      # dict). `config` parses + validates; it does not create or start anything.
      # The rendered edge (caddy) requires CADDY_BIND (host tailnet IP) AND BASE_PATH (repo root)
      # via ${VAR:?...} fail-loud guards — operator-supplied `site:` values the generic example
      # intentionally leaves unset. Load the rendered .env and add CI-only placeholders (never used
      # at runtime) so config can interpolate. BASE_PATH backs the oauth2-proxy allowlist + Caddyfile
      # mounts, which fail loud on an empty value (guards the deny-all empty-mount outage class).
      - name: Rendered compose validates (docker engine)
        if: steps.filter.outputs.substrate == 'true'
        run: |
          echo "CADDY_BIND=127.0.0.1" >> /tmp/ordo-out/.env
          echo "BASE_PATH=." >> /tmp/ordo-out/.env
          docker compose -f /tmp/ordo-out/docker-compose.yml --env-file /tmp/ordo-out/.env config >/dev/null
          echo "rendered compose accepted by docker compose config"

      - name: Skip (no substrate changes)
        if: steps.filter.outputs.substrate != 'true'
        run: echo "Skipping substrate — no changes under the render-engine paths."
