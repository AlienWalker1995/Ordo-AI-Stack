# Prometheus scrape config for the Ordo stack (monitoring profile).
# Scrapes llama.cpp's native /metrics (enabled by --metrics in
# scripts/llamacpp/run-llama-server.sh), LiteLLM's /metrics (model-gateway),
# the nvidia GPU exporter, ops-controller (GPU lease, containers, disks, the edge certificate) and
# Alertmanager. All targets are on the internal `ordo-net` network, no host exposure.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

# Alert rules (tracked, mounted read-only from monitoring/prometheus/rules/), delivered by the
# monitoring plugin's Alertmanager (monitoring/alertmanager/alertmanager.yml).
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # llama.cpp server exposes Prometheus metrics on its own port when started
  # with --metrics (prompt/generation token rates, KV-cache usage, queue depth).
  - job_name: llamacpp
    metrics_path: /metrics
    static_configs:
      - targets: ['llamacpp:8080']
        labels:
          service: llamacpp

  # The CPU fallback llama.cpp server (same --metrics, same metric names). It answers chat while a
  # render has the GPU, so without it the performance view is blind exactly when it matters.
  # Queries must filter by job: both servers export identical llamacpp:* names.
  - job_name: llamacpp-cpu
    metrics_path: /metrics
    static_configs:
      - targets: ['llamacpp-cpu:8080']
        labels:
          service: llamacpp-cpu

  # nvidia_gpu_exporter wraps nvidia-smi (works on consumer GPUs + WSL2, unlike
  # DCGM). Reports utilization, VRAM, temperature, power per GPU.
  - job_name: gpu
    metrics_path: /metrics
    static_configs:
      - targets: ['gpu-exporter:9835']
        labels:
          service: gpu

  # LiteLLM (model-gateway): request/latency/fallback + litellm_mcp_tool_calls_total per server/tool.
  # /metrics runs unauthenticated (require_auth_for_metrics_endpoint: false). It stays internal
  # ONLY because the edge's SSO-bypassing /llm/* route answers 404 for /metrics and /metrics/*
  # (auth/caddy/Caddyfile); the labels carry key aliases, user emails and client IPs.
  - job_name: model-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['model-gateway:11435']
        labels:
          service: model-gateway

  # ops-controller's GET /metrics (ordo/control/metrics.py): GPU lease and eviction state, container
  # running/unhealthy/restart counts, the Docker VM and host disks, the edge TLS certificate. No
  # token: the route is unauthenticated and holds no secret. Every 60s with a 30s timeout: a scrape
  # runs `docker ps` + `docker inspect`, and `docker ps` hit its 30s timeout during the 2026-09-27 crash recovery.
  - job_name: ops-controller
    metrics_path: /metrics
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets: ['ops-controller:9000']
        labels:
          service: ops-controller

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          service: alertmanager
