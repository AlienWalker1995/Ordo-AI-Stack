# Ordo curated model catalog (LLM tier — the only thing the right-sizer auto-scales).
#
# Each entry declares its RESOURCE REQUIREMENTS so the sizer can best-fit to hardware,
# and a SHA256 so downloads are verified before use (corrupt weights already burned us
# once — mandatory checksum is a hard rule, not a nicety).
#
# `sha256: null` means "not yet pinned" — the download step MUST refuse to use a null-sha
# entry unless the operator explicitly opts into unverified. Populate from Hugging Face.
#
# requires.vram_gb = weights only; the renderer adds a KV/compute headroom reserve on top,
# so a 28GB-weights model does NOT get picked for a 32GB card (that mistake caused the
# saturation → RAM-spill → 2.4 tok/s incident).
#
# backend_image pins a special llama.cpp build instead of the per-host upstream one
# (ordo/render/llamacpp_backend.py). Such an entry MUST declare requires.min_compute_cap, the lowest
# NVIDIA compute capability that build has kernels for, so the sizer never hands it to a GPU it
# cannot run on. The patched build is compiled for sm_120 only (services/llamacpp-patched).
# A special build is a first-party image, named UNTAGGED (`ordo/llamacpp-patched`): `ordo build`
# builds it from its context and records the tag, and render pins the compose to that record.
#
# size_bytes is the file's byte count, pinned next to its sha256: the preflight disk check sums
# the files still to fetch from it.
#
# mmproj (vision projector) takes one of two forms. A mapping (file, source, sha256, size_bytes)
# pins a downloadable projector: `ordo fetch` / `ordo up` provision it like the weights, into the
# models volume under `file`, and the render points LLAMACPP_MMPROJ at /models/<file>. A bare path
# (/models/<file>) names a projector with no pinned source, which has to be copied in by hand.
#
# shards: a model split into several GGUF files. `file` is shard 1 (what llama.cpp is pointed at);
# each further shard pins file, source, sha256 and size_bytes like the weights. `ordo fetch`, `ordo up`
# and a model switch provision and require every shard (the render lists them in LLAMACPP_MODEL_SHARDS).
#
# A model's own placement, for a MoE model larger than the card:
#   n_cpu_moe       the expert tensors of the first N layers stay in system RAM (--n-cpu-moe N --fit off)
#   cpu_threads     the threads those experts compute on (--threads); required with n_cpu_moe
#   load_mode       none (default: read into memory) or mmap-lazy (memory-map, and read a huge lookup
#                   table such as a per-layer n-gram embedding row by row from disk)
#   n_predict       the server's generation cap for requests that send no max_tokens (default 65536)
#   vram_reserve_gb the VRAM the sizer keeps free beside it (default 4.0); only for a model whose
#                   vram_gb is its measured footprint including compute buffers
#   auto: false     pinnable only: `model: auto` never picks it
# Each is also an `overrides.llamacpp` key (n_cpu_moe, threads, load_mode, n_predict).
#
# gateway: how model-gateway (LiteLLM) adapts client requests to this model's server. Unknown keys are
# a load error.
#   drop_tool_strict: true   remove `strict` from every tool definition (tools[].function.strict)
#                            before the request reaches a server that refuses strict tools
# backend: the engine the single GPU chat service (`llamacpp`) runs. `llama.cpp` (the default) serves
# GGUF files through scripts/llamacpp/run-llama-server.sh. `ninfer` serves one .ninfer artifact through
# scripts/llamacpp/run-ninfer-serve.sh and must name its engine image (backend_image: ordo/ninfer).
# Same service name, alias, port and models volume either way; rolling back is a `model:` change.
#   vision: { enabled, max_context }  ninfer only: load the artifact's vision encoder, which caps the
#                                     window at max_context. Also `overrides.llamacpp.vision`.
# build: in place of `source`, a file built locally by the tracked recipe of that name in
# services/ninfer/convert/inputs/ (every input pinned by revision and sha256). It must pin sha256 and
# size_bytes. Nothing downloads it: `ordo fetch`, `ordo up` and `ordo apply` verify the file in the
# models volume and refuse with the rebuild commands when it is missing or different;
# `ordo fetch <id> --from <file>` installs a built file through the same check.

version: 1

