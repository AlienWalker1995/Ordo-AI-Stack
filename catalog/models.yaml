    sha256: 2e8a9bdb478cad4ad53a3b02568ed6f5a6c7f8f569e8c030e4806438ca49828e
    requires: { vram_gb: 23, ram_gb: 16, cpu_ok: false }
    ctx_default: 131072
    # Same Qwen3.6-27B hybrid attention/SSM as the huihui sibling: KV ~34.8 KB/token (q8_0).
    kv_kb_per_token: 34.8
    # Shared Qwen3.6-27B vision projector — loads cleanly across these 27B finetunes.
    mmproj: /models/mmproj-Huihui-Q6_K.gguf
    # This IS the MTP GGUF variant, but it loads fine as a plain model on the patched build:
