  - id: qwen3.8-27b-turbo-fable-q6
    name: Qwen3.8 27B TURBO Fable Cold-Fusion Heretic Uncensored (Q6_K, NEO MAX)
    backend: llama.cpp
    file: Qwen3.8-27B-TurboFCFusion-735-882-Here-Uncen-NEO-CODER-MAX-Q6_K.gguf
    # DavidAU merge of the same Qwen3.8-27B base: Cold-Fusion/GAIN fine tune, Heretic ARA
    # de-censoring, NEO imatrix quant with 16-bit output tensors ("MAX"), and a TURBO pass the
    # card claims cuts thinking tokens by 2x to 10x. THE DEFAULT PICK since 2026-09-20: it is the
    # catalog's top-ranked ultra model, so this is what every `model: auto` deployment renders.
    # qwen3.8-27b-uncensored-q6 stays in the catalog below as a pinnable fallback.
    source: https://huggingface.co/DavidAU/Qwen3.8-27B-TURBO-Fable-Cold-Fusion-735-882-Heretic-Uncensored-NEO-CODER-MAX-MTP-GGUF/resolve/main/Qwen3.8-27B-TurboFCFusion-735-882-Here-Uncen-NEO-CODER-MAX-Q6_K.gguf
    # sha256 of the 23,582,382,688-byte Q6_K file, read from the repo's own LFS oid before download.
    sha256: f814af8d2ce6e636962aec38a30c11a84568d208de4d60f4fc45ed8a77ad0160
    size_bytes: 23582382688
    # 23.6GiB weights, 1.2GiB more than qwen3.8-27b-uncensored-q6, so the same ultra tier with no
    # headroom to spare.
    requires: { vram_gb: 24, ram_gb: 16, cpu_ok: false, min_compute_cap: "12.0" }
    # Card claims 256k native; 131072 is the stack-wide CAP. The renderer sizes the actual window
    # down from it to whatever KV fits after these weights (114688 on a 32GB card) and emits the
    # CPU failover's window from that same value, so the failover can never accept less.
    ctx_default: 131072
    # Same `qwen35` hybrid arch as the rest of the Qwen3.8-27B family.
    kv_kb_per_token: 34.8
    # The repo's own F16 projector, stored under a model-specific name (every upstream projector is
    # called mmproj-F16.gguf). sha256 = its HF LFS oid, matched against the copy in the live volume.
    mmproj:
      file: Qwen3.8-27B-TurboFable-vision-f16.gguf
      source: https://huggingface.co/DavidAU/Qwen3.8-27B-TURBO-Fable-Cold-Fusion-735-882-Heretic-Uncensored-NEO-CODER-MAX-MTP-GGUF/resolve/main/mmproj-F16.gguf
      sha256: 82e620db8cb83267e9775e5aad3e8d8aa5af7ace825e94c52d3d730eb35af88a
      size_bytes: 927606976
    # SAMPLER DEFAULTS ARE PART OF THE CONFIG, not left to whatever a client happens to send.
    # Serving this model on llama.cpp's defaults makes it run away: "Say the single word: ready"
    # generated 32,735 reasoning tokens straight into the 32768 reasoning cap, about 11 minutes a
    # request, which is what stalled the first eval attempt. With these values the same prompt
    # answers in 7.4s using 22 tokens. top_k is the knob that actually stops the loop; the card
    # recommends 20 for both its thinking and instruct profiles. Temperature is the operator's
    # choice of 0.5, below the card's 0.7, for more determinism in agent work. A client that sends
    # its own values still overrides these; they are the floor, not a cage.
    # presence_penalty is deliberately NOT set: the card asks for 1.5 in instruct mode but also
    # says to turn repetition penalties OFF for tool calling, and this model serves a tool-heavy
    # agent. Revisit only with a measured tool-calling comparison.
    extra_args: "--reasoning-format deepseek --temp 0.5 --top-k 20 --top-p 0.8 --min-p 0.0"
    # The DELIBERATE choice of the non-MTP build. The MTP file exists and is 0.4GiB larger, but
    # draft-mtp speculative decoding already collapsed to ~7 tok/s on this box at 65-85% acceptance
    # under VRAM pressure (2026-08-19), and this card itself says to drop to the plain quant below
    # 50% acceptance. Nothing here would use the MTP tensors, so they would only cost VRAM.
    # `qwen35` arch needs the SWA/hybrid-cache patched build, same image as the other Qwen3.8s.
    backend_image: ordo/llamacpp-patched
    tier: ultra

  - id: swift-1.5-qwen3.8-flash-next-iq2xs
    name: Swift 1.5 Qwen3.8-Flash-Next GSQ-RCO (IQ2_XS)
    backend: llama.cpp
    # UkisAI's reasoning-efficient fine-tune of Qwen3.8-Flash-Next (125B MoE, 6B active, 512 experts,
    # plus a 51B per-layer n-gram embedding table), quantized with ISTA's GSQ-RCO allocations.
    # LICENSE: Swift Open License v1.0 over the Qwen Community License. It limits commercial use
    # (a revenue threshold); read it before deploying this anywhere but a personal box. For that
    # reason, and its 68GB download and 12-thread CPU load, `model: auto` never picks it: pin it.
    auto: false
    # Two shards: `file` is shard 1 (the transformer weights), llama.cpp opens shard 2 (the n-gram
    # table) from the same directory.
    file: Swift-Qwen3.8-Flash-Next-GSQ-RCO-IQ2_XS-00001-of-00002.gguf
    source: https://huggingface.co/ukisai/Swift-1.5-Qwen3.8-Flash-Next-GSQ-RCO-GGUF/resolve/main/Swift-Qwen3.8-Flash-Next-GSQ-RCO-IQ2_XS-00001-of-00002.gguf
    # sha256 = the repo's LFS oid, matched on the downloaded copy (2026-09-30).
    sha256: ca3b302d3d1eb6eddce3ea4acc79854e6cc5fdc0583e374a6a8b6bb67327743b
    size_bytes: 39788473344
    shards:
      - file: Swift-Qwen3.8-Flash-Next-GSQ-RCO-IQ2_XS-00002-of-00002.gguf
        source: https://huggingface.co/ukisai/Swift-1.5-Qwen3.8-Flash-Next-GSQ-RCO-GGUF/resolve/main/Swift-Qwen3.8-Flash-Next-GSQ-RCO-IQ2_XS-00002-of-00002.gguf
        sha256: e4996a6de18fd49c58d9a0040fcfd73787db6407c51973f29884bee7b14c9dbb
        size_bytes: 28363693824
    # The placement measured on the 5090 (2026-09-30 eval, llama.cpp v0.5.0): every layer on the GPU
    # except the expert tensors of the first 15 layers, which stay in system RAM (--n-cpu-moe 15, the
    # split llama.cpp's own --fit chose at this context). The n-gram table is memory-mapped and read
    # row by row from disk (27.5GB that never occupies RAM or VRAM).
    n_cpu_moe: 15
    load_mode: mmap-lazy
    # The offloaded experts compute on these threads. 12 is the ceiling the host's UPS budget allows
    # beside the 5090 at its 400W cap; measured at ~12 cores, 180W GPU peak.
    cpu_threads: 12
    # vram_gb is the MEASURED footprint at that placement minus the KV cache: 30.2GiB on the card at
    # 106496 tokens, less 1.57GiB of KV. It already includes compute buffers and CUDA overhead, so
    # the reserve beside it is only the other declared resident on this card (llamacpp-embed, 1.0GB).
    # ram_gb is the expert weights held in RAM (10.2GiB) plus headroom.
    requires: { vram_gb: 28.6, ram_gb: 12, cpu_ok: false, min_compute_cap: "12.0" }
    vram_reserve_gb: 1.0
    # The window the placement was sized and measured at. The card claims 262144 native; a larger
    # window would need another layer of experts moved to RAM.
    ctx_default: 106496
    # Hybrid attention: 1604MiB of KV + recurrent state at 106496 tokens with q8_0.
    kv_kb_per_token: 15.4
    # The server's default generation cap. In the eval an unbounded generation ran past a client
    # timeout and was retried forever; at 12288 no item repeated. A request that sends its own
    # max_tokens overrides this (llama-server takes the request's value), so a client's own cap,
    # e.g. HERMES_MAX_TOKENS, is what bounds that client.
    n_predict: 12288
    # Sampling from the model card's thinking mode (thinking is on by default in its template).
    extra_args: "--reasoning-format deepseek --temp 1.0 --top-k 20 --top-p 0.95 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0"
    # No mmproj: the BF16 projector (0.91GB) does not fit beside this placement, and vision was not
    # validated for qwen4exp. Text only.
    # qwen4exp needs llama.cpp v0.5.0 (ggml-org#27742, #28770): the patched build.
    backend_image: ordo/llamacpp-patched
    tier: ultra

  - id: qwen3.8-27b-nvfp4-ninfer
    name: Qwen3.8 27B NVFP4 on NInfer (official artifact, MTP3)
    # The official NInfer engine (services/ninfer, image ordo/ninfer) serving the official artifact.
    # Same GPU chat service as the llama.cpp models; the render picks run-ninfer-serve.sh for it.
    backend: ninfer
    backend_image: ordo/ninfer
    # Revision a107ba1b is the v3 packaging of the official weights. The engine pinned in
    # services/ninfer requires v3 artifacts and refuses the v2 file (revision 3b84117e, sha256
    # bb336052..., the one the YaRN fork loads): "NInfer v2 artifact is not supported".
    file: qwen3_8_27b_nvfp4.ninfer
    source: https://huggingface.co/neroued/Qwen3.8-27B-nvfp4-NInfer/resolve/a107ba1b5b0609d9ca90d5ed61439f5f5cc7d64d/qwen3_8_27b_nvfp4.ninfer
    # sha256 = the repo's LFS oid at that revision, matched on the downloaded copy (2026-09-30).
    sha256: 74d2c57145e6ff11d1d2faa79594477f9bc903a611af1fb20218189fbbb77d82
    size_bytes: 23719715844
    # Measured on the 5090 (2026-09-30 eval, engine d44ab584): 29.3GiB on the card at 262,144 tokens
    # with fp8 KV and MTP3, of which the KV pool is 16.6KiB per token (9.19GiB runtime at 262,144 vs
    # 8.84GiB at 240,000). vram_gb is the rest: weights 19.7GiB plus the engine's fixed buffers. The
    # reserve beside it is the other declared resident on this card, llamacpp-embed's 1.0GB.
    # ram_gb: the engine pins 8GiB of host KV plus checkpoint state by default.
    requires: { vram_gb: 25.2, ram_gb: 12, cpu_ok: false, min_compute_cap: "12.0" }
    vram_reserve_gb: 1.0
    kv_kb_per_token: 16.6
    # The model's native window: 257,653-token prompt, 5/5 needle retrieval, 155 tok/s decode.
    ctx_default: 262144
    # One request at a time (upstream issue #339: concurrency 2 can wedge the server), fp8 KV, MTP
    # with three draft tokens and the optimized proposal head (126 tok/s decode, about 44% acceptance),
    # and assistant reasoning kept across turns. Sampling comes from the engine's Qwen3.8 thinking
    # preset (1.0 / 0.95 / 20 / 0 / 0), which is the model card's.
    # A request that arrives while one is running waits for the GPU (up to 8 queued, 10 minutes) instead of
    # failing over to the CPU fallback, which reads a long prompt at ~23 tok/s on 12 cores.
    extra_args: "--max-concurrency 1 --max-pending-requests 8 --pending-timeout-ms 600000 --kv-dtype fp8 --spec mtp --draft-tokens 3 --lm-head-draft --preserve-thinking"
    # Text only by default. With the vision encoder loaded, 262,144 no longer fits (the engine needs
    # 10.48GB + 1GB headroom after weights, 10.86GB is left); 200,000 measured (image QA correct).
    vision: { enabled: false, max_context: 200000 }
    # NInfer answers a `strict: true` tool with 400 strict_tools_not_supported; Hermes sends them.
    gateway: { drop_tool_strict: true }
    # A new engine, opted into by the operator: `model: auto` keeps picking a llama.cpp model.
    auto: false
    tier: ultra

  - id: qwen3.8-27b-heretic-ara-ninfer
    name: Qwen3.8 27B Heretic ARA on NInfer (groupwise-int, MTP3)
    # heretic-org/Qwen3.8-27B-heretic-ara (the canonical Heretic ARA abliteration of Qwen3.8-27B,
    # Apache-2.0) converted by upstream's own converter at the engine commit services/ninfer serves,
    # with the official groupwise-int recipe and the official Qwen3.8 frontend. Inputs, arguments and
    # the reproducible run: services/ninfer/convert/inputs/qwen3.8-27b-heretic-ara.* and
    # services/ninfer/README.md "Converting weights". The published Heretic .ninfer files do not load
    # on this engine (both v2, and the official v2-to-v3 upgrade refuses both).
    backend: ninfer
    backend_image: ordo/ninfer
    file: qwen3_8_27b_heretic_ara.ninfer
    # Built locally, never downloaded (no source): `ordo fetch`/`up`/`apply` verify the file in the
    # models volume against sha256 and size, and refuse with the rebuild commands when it is missing
    # or different. The pin is the converted file itself: the converter writes a random artifact id,
    # so a re-run gives the same weights under another sha256, to validate and pin again.
    build: qwen3.8-27b-heretic-ara
    sha256: 6c5862c690c2d60e4c4fd1ac86ab30e10bb20c8b10bca2c5e518502a4d9bb904
    size_bytes: 18210704128
    # Measured on the 5090 (2026-10-01, engine d44ab584): 26.8GiB on the card at 262,144 tokens with
    # fp8 KV and MTP3 (weights 16.7GiB, runtime 9.19GiB, 4.08GiB free), 27.6GiB with the vision
    # encoder loaded. The KV pool is the same 16.6KiB per token as the official artifact; vram_gb is
    # the rest, vision encoder included (+0.8GiB).
    requires: { vram_gb: 22.8, ram_gb: 12, cpu_ok: false, min_compute_cap: "12.0" }
    vram_reserve_gb: 1.0
    kv_kb_per_token: 16.6
    # The model's native window: 256,644-token prompt, 5/5 needle retrieval.
    ctx_default: 262144
    # The same serving flags as the official entry (one request at a time, upstream issue #339).
    # A request that arrives while one is running waits for the GPU (up to 8 queued, 10 minutes) instead of
    # failing over to the CPU fallback, which reads a long prompt at ~23 tok/s on 12 cores.
    extra_args: "--max-concurrency 1 --max-pending-requests 8 --pending-timeout-ms 600000 --kv-dtype fp8 --spec mtp --draft-tokens 3 --lm-head-draft --preserve-thinking"
    # Vision on: the smaller weights leave room for the vision encoder at the full window
    # (27.6GiB on the card with --vision at 262,144, image QA correct), so images cost no context.
    vision: { enabled: true, max_context: 262144 }
    # NInfer answers a `strict: true` tool with 400 strict_tools_not_supported; Hermes sends them.
    gateway: { drop_tool_strict: true }
    auto: false
    tier: ultra

  - id: qwen3.8-27b-heretic-ara-nvfp4-ninfer
    name: Qwen3.8 27B Heretic ARA on NInfer (NVFP4, MTP3)
    # A Heretic ARA abliteration of Qwen3.8-27B in the official NVFP4 layout
    # (catplusplus/Qwen3.8-27B-heretic-ara-NVFP4-MTP, quantized like unsloth/Qwen3.8-27B-NVFP4),
    # converted by upstream's own converter at the serving engine commit with the official NVFP4
    # recipe and the official Qwen3.8 frontend. The MTP head is the one catplusplus copied from
    # unsloth/Qwen3.8-27B-NVFP4; its bytes equal heretic-org/Qwen3.8-27B-heretic-ara's MTP file.
    # Inputs and arguments: services/ninfer/convert/inputs/qwen3.8-27b-heretic-ara-nvfp4.*.
    # The groupwise entry above stays as its rollback.
    backend: ninfer
    backend_image: ordo/ninfer
    file: qwen3_8_27b_heretic_ara_nvfp4.ninfer
    # Built locally, never downloaded: the pin is the converted file itself (see the groupwise entry).
    build: qwen3.8-27b-heretic-ara-nvfp4
    sha256: 9cb0d03d9ffe89d16ba9e7aec90a2c6cde1f4e51e243433ff2dad234632ebcc4
    size_bytes: 21492902404
    # The official NVFP4 layout without DFlash2, so the official entry's measured footprint: weights
    # 19.7GiB plus 16.6KiB of fp8 KV per token at 262,144.
    requires: { vram_gb: 25.2, ram_gb: 12, cpu_ok: false, min_compute_cap: "12.0" }
    vram_reserve_gb: 1.0
    kv_kb_per_token: 16.6
    ctx_default: 262144
    # A request that arrives while one is running waits for the GPU (up to 8 queued, 10 minutes) instead of
    # failing over to the CPU fallback, which reads a long prompt at ~23 tok/s on 12 cores.
    extra_args: "--max-concurrency 1 --max-pending-requests 8 --pending-timeout-ms 600000 --kv-dtype fp8 --spec mtp --draft-tokens 3 --lm-head-draft --preserve-thinking"
    # As the official NVFP4 artifact: with the vision encoder loaded, 200,000 fits and 262,144 does not.
    vision: { enabled: false, max_context: 200000 }
    # NInfer answers a `strict: true` tool with 400 strict_tools_not_supported; Hermes sends them.
    gateway: { drop_tool_strict: true }
    auto: false
    tier: ultra

  - id: qwen3.8-27b-huihui-abliterated-nvfp4-ninfer
    name: Qwen3.8 27B Huihui Abliterated on NInfer (FP8 + NVFP4, MTP3)
    # huihui-ai/Huihui-Qwen3.8-27B-abliterated (revision d42ca897) in NInfer's official FP8 + NVFP4
    # Qwen3.8 allocation, published by lyf as a complete artifact with the same model's vision tower and
    # MTP tensors. It is a v2 file (NInfer a99407c6) this engine refuses, so the recipe upgrades it
    # offline with upstream's v2-to-v3 tool, weight bytes unchanged: services/ninfer/convert/inputs/
    # qwen3.8-27b-huihui-abliterated-nvfp4.{sources,upgrade}. NVFP4 runs the prompt on the 5090's
    # native 4-bit units: about 3x the groupwise-int prefill of the Heretic entries.
    backend: ninfer
    backend_image: ordo/ninfer
    file: qwen3_8_27b_huihui_abliterated_nvfp4.ninfer
    # Built locally, never downloaded: the pin is the upgraded file itself (see the groupwise entry).
    build: qwen3.8-27b-huihui-abliterated-nvfp4
    sha256: d4a315892a4dac322b011e10d71dfbee66f15e6412cdc31e992cb72e9ddfd5a2
    size_bytes: 21492938224
    # The official NVFP4 layout, so the official entry's measured footprint: weights 19.7GiB plus 16.6KiB
    # of fp8 KV per token.
    requires: { vram_gb: 25.2, ram_gb: 12, cpu_ok: false, min_compute_cap: "12.0" }
    vram_reserve_gb: 1.0
    kv_kb_per_token: 16.6
    ctx_default: 262144
    # The same serving flags as the other NInfer entries (one request at a time, upstream issue #339;
    # waiting requests queue on the GPU instead of failing over to the CPU fallback).
    extra_args: "--max-concurrency 1 --max-pending-requests 8 --pending-timeout-ms 600000 --kv-dtype fp8 --spec mtp --draft-tokens 3 --lm-head-draft --preserve-thinking"
    # Vision on. With the encoder loaded the NVFP4 weights leave room for 200,000 tokens, not 262,144
    # (measured 2026-10-08: 262,144 with vision starts only on an otherwise empty card, 31.4GiB of
    # 31.8, with no room for the embedder this card also serves; 200,000 runs at 29.3GiB, image QA correct).
    vision: { enabled: true, max_context: 200000 }
    # NInfer answers a `strict: true` tool with 400 strict_tools_not_supported; Hermes sends them.
    gateway: { drop_tool_strict: true }
    auto: false
    tier: ultra

  - id: qwen3.8-27b-uncensored-q6
    name: Qwen3.8 27B Uncensored (Q6_K)
    backend: llama.cpp
    file: Qwen3.8-27B-Uncensored-Q6_K.gguf
    # orcarouter original is gated; this is the byte-verified community mirror (JonathanColetti).
    source: https://huggingface.co/JonathanColetti/Qwen3.8-27B-Uncensored-GGUF/resolve/main/Qwen3.8-27B-Uncensored-Q6_K.gguf
    # sha256 of the 22,430,999,968-byte Q6_K file, computed on the downloaded copy.
    sha256: a50aa1478295b58ee3d93eabe02c17f6d5fcf6cb787fd8a0ab07ac629a46cae6
    size_bytes: 22430999968
    requires: { vram_gb: 23, ram_gb: 16, cpu_ok: false, min_compute_cap: "12.0" }
    # Same 131072 stack-wide window as the base Qwen3.8-27B.
    ctx_default: 131072
    # Same `qwen35` hybrid arch as the base Qwen3.8-27B (abliteration is LLM-only).
    kv_kb_per_token: 34.8
    # The uncensored repo's own vision projector (CLIP, qwen3vl_merger), stored under this name.
    # sha256 = its HF LFS oid.
    mmproj:
      file: Qwen3.8-27B-Uncensored-vision-f16.gguf
      source: https://huggingface.co/JonathanColetti/Qwen3.8-27B-Uncensored-GGUF/resolve/main/mmproj-Qwen3.8-27B-Uncensored-F16.gguf
      sha256: 5ac423f8a29059dc24e51bc6a43e9380dcd57a9347f28b62591e0b3f60b7081c
      size_bytes: 927606912
    # NO MTP flags: this is a Q6_K abliterated model, where draft-mtp speculative
    # decoding collapses to ~7 tok/s (65-85% acceptance, VRAM pressure). See
    # llm-model-management -> references/mtp-performance.md.
    extra_args: "--reasoning-format deepseek"
    # `qwen35` arch needs the SWA/hybrid-cache patched build (same image as the 3.6s/3.8).
    backend_image: ordo/llamacpp-patched
    tier: ultra

  - id: qwen3.8-27b-q6
    name: Qwen3.8 27B (Q6_K)
    backend: llama.cpp
    file: Qwen3.8-27B-Q6_K.gguf
    source: https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-Q6_K.gguf
    # sha256 = HF LFS oid of the 22,884,407,264-byte Q6_K file (unsloth/Qwen3.8-27B-GGUF).
    sha256: ade6d6615688aafa1dcfc9f5b4e1a66447bc02f8e099a006a10f9263f22f8ccc
    size_bytes: 22884407264
    requires: { vram_gb: 23, ram_gb: 16, cpu_ok: false, min_compute_cap: "12.0" }
    # Native context is 262144, but we deploy at the stack-wide 131072 window
    # (CPU-fallback parity + KV VRAM budget).
    ctx_default: 131072
    # GGUF arch `qwen35` — same hybrid attention/SSM family as the Qwen3.6 27Bs:
    # 65 layers, full-attn every 4th, 4 KV heads x 256 -> KV ~34.8 KB/token (q8_0).
    kv_kb_per_token: 34.8
    # Qwen3.8's own vision projector (unsloth mmproj-F16.gguf, renamed on copy-in).
    # The Qwen3.6 projectors are NOT compatible with this model.
    mmproj: /models/mmproj-Qwen3.8-27B-F16.gguf
    # GGUF carries an MTP head (nextn_predict_layers=1) but no --spec/--draft flags
    # are passed, so it is inert.
    extra_args: "--reasoning-format deepseek"
    # `qwen35` arch needs the SWA/hybrid-cache patched build — verified present at
    # v0.5.0 / 7fe450e (LLM_ARCH_QWEN35 in src/llama-arch.cpp); same image as the 3.6s.
    backend_image: ordo/llamacpp-patched
    tier: ultra

# Support models: weights the rendered stack reads from the same models-gguf volume that are NOT
# chat-model candidates (the sizer never picks them). Pinned here so `ordo fetch` / `ordo up` can
# provision them. The file names match the defaults the plugin manifests load
# (`${LLAMACPP_CPU_MODEL:-...}` in services/llamacpp-cpu, `${LLAMACPP_EMBED_MODEL:-...}` in
# services/rag). sha256 = the Hugging Face LFS oid of each file.
support_models:
  - id: qwen3.6-35b-a3b-cpu-q4
    name: Qwen3.6 35B A3B (UD-Q4_K_M), CPU fallback
    backend: llama.cpp
    file: Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
    source: https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF/resolve/main/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
    # 22,134,528,992 bytes.
    sha256: ac0e2c1189e055faa36eff361580e79c5bd6f8e76bffb4ce547f167d53e31a61
    size_bytes: 22134528992
    # Qwen3.6-35B-A3B's own F16 vision projector, so images keep working while the fallback serves.
    # Stored under a model-specific name (upstream calls it mmproj-F16.gguf); sha256 = its HF LFS oid.
    # services/llamacpp-cpu passes it as --mmproj (tests/substrate/test_cpu_fallback_vision.py).
    mmproj:
      file: Qwen3.6-35B-A3B-mmproj-F16.gguf
      source: https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF/resolve/main/mmproj-F16.gguf
      sha256: 8971ee4f331ff0a4c609374f32984b3d4e6dc086c0aa35f1d637fad1829e887f
      size_bytes: 899283680
    requires: { vram_gb: 0, ram_gb: 25, cpu_ok: true }
    # The fallback serves the chat model's whole window (LLAMACPP_CPU_CTX = LLAMACPP_CTX_SIZE), so the
    # render checks that window against these two and refuses one the fallback cannot hold.
    # ctx_default: the window it was trained for (qwen35moe.context_length in the GGUF header).
    ctx_default: 262144
    # Hybrid attention (qwen35moe): only every 4th of the 40 blocks is full attention, with 2 KV heads of
    # 256 for K and V. At q8_0 (34 bytes per 32 values): 10 * 2 * 512 * 34 / 32 = 10,880 bytes per token,
    # 1.08GiB at 106,496 tokens and 2.66GiB at 262,144. The 30 linear-attention blocks add ~63MiB of
    # recurrent state that does not grow with the window. Measured beside it: 24.5GiB resident at 106,496.
    kv_kb_per_token: 10.625

