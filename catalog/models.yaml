  - id: huihui-qwen3.6-27b-q6
    name: Huihui Qwen3.6 27B Abliterated (Q6_K)
    backend: llama.cpp
    file: Huihui-Qwen3.6-27B-abliterated-ggml-model-Q6_K.gguf
    source: https://huggingface.co/huihui-ai
    # sha256 of the 22,430,998,848-byte Q6_K weights, computed from the on-disk file.
    sha256: c03727f9fdfb7c8c02a8d7a0662563a0b0d7a6e192a03834a45f58300408b4ea
    size_bytes: 22430998848
    requires: { vram_gb: 21, ram_gb: 16, cpu_ok: false, min_compute_cap: "12.0" }
    ctx_default: 131072
    # hybrid attention/SSM: KV is ~34.8 KB/token over 16 full-attn layers (q8_0).
    kv_kb_per_token: 34.8
    mmproj: /models/mmproj-Huihui-Q6_K.gguf
    # NB: no speculative/MTP flags — this is deliberately the NON-MTP GGUF sibling (llama.cpp
    # cannot load the Qwen3.6 MTP variants), so --spec-type draft-mtp parsed but was inert:
    # zero MTP/speculative init lines in the live server log (audit P2-15, verified 2026-07-24).
    extra_args: "--reasoning-format deepseek"
    # Qwen3.6 needs the SWA/hybrid-cache patched llama.cpp build — the stock
    # ghcr.io/ggml-org/llama.cpp:server can't load this model. First-party image
    # built by `ordo build` from services/llamacpp-patched (not pullable from a registry).
    backend_image: ordo/llamacpp-patched
    tier: ultra


  - id: qwen3.8-27b-turbo-fable-q6
    name: Qwen3.8 27B TURBO Fable Cold-Fusion Heretic Uncensored (Q6_K, NEO MAX)
    backend: llama.cpp
    file: Qwen3.8-27B-TurboFCFusion-735-882-Here-Uncen-NEO-CODER-MAX-Q6_K.gguf
    # DavidAU merge of the same Qwen3.8-27B base: Cold-Fusion/GAIN fine tune, Heretic ARA
    # de-censoring, NEO imatrix quant with 16-bit output tensors ("MAX"), and a TURBO pass the
    # card claims cuts thinking tokens by 2x to 10x. THE DEFAULT PICK since 2026-09-20: it is the
    # catalog's top-ranked ultra model, so this is what every `model: auto` deployment renders.
    # qwen3.8-27b-uncensored-q6 stays in the catalog below as a pinnable fallback.
    source: https://huggingface.co/DavidAU/Qwen3.8-27B-TURBO-Fable-Cold-Fusion-735-882-Heretic-Uncensored-NEO-CODER-MAX-MTP-GGUF/resolve/main/Qwen3.8-27B-TurboFCFusion-735-882-Here-Uncen-NEO-CODER-MAX-Q6_K.gguf
    # sha256 of the 23,582,382,688-byte Q6_K file, read from the repo's own LFS oid before download.
    sha256: f814af8d2ce6e636962aec38a30c11a84568d208de4d60f4fc45ed8a77ad0160
    size_bytes: 23582382688
    # 23.6GiB weights, 1.2GiB more than qwen3.8-27b-uncensored-q6, so the same ultra tier with no
    # headroom to spare.
    requires: { vram_gb: 24, ram_gb: 16, cpu_ok: false, min_compute_cap: "12.0" }
    # Card claims 256k native; 131072 is the stack-wide CAP. The renderer sizes the actual window
    # down from it to whatever KV fits after these weights (114688 on a 32GB card) and emits the
    # CPU failover's window from that same value, so the failover can never accept less.
    ctx_default: 131072
    # Same `qwen35` hybrid arch as the rest of the Qwen3.8-27B family.
    kv_kb_per_token: 34.8
    # The repo's own F16 projector, stored under a model-specific name (every upstream projector is
    # called mmproj-F16.gguf). sha256 = its HF LFS oid, matched against the copy in the live volume.
    mmproj:
      file: Qwen3.8-27B-TurboFable-vision-f16.gguf
      source: https://huggingface.co/DavidAU/Qwen3.8-27B-TURBO-Fable-Cold-Fusion-735-882-Heretic-Uncensored-NEO-CODER-MAX-MTP-GGUF/resolve/main/mmproj-F16.gguf
      sha256: 82e620db8cb83267e9775e5aad3e8d8aa5af7ace825e94c52d3d730eb35af88a
      size_bytes: 927606976
    # SAMPLER DEFAULTS ARE PART OF THE CONFIG, not left to whatever a client happens to send.
    # Serving this model on llama.cpp's defaults makes it run away: "Say the single word: ready"
    # generated 32,735 reasoning tokens straight into the 32768 reasoning cap, about 11 minutes a
    # request, which is what stalled the first eval attempt. With these values the same prompt
    # answers in 7.4s using 22 tokens. top_k is the knob that actually stops the loop; the card
    # recommends 20 for both its thinking and instruct profiles. Temperature is the operator's
    # choice of 0.5, below the card's 0.7, for more determinism in agent work. A client that sends
    # its own values still overrides these; they are the floor, not a cage.
    # presence_penalty is deliberately NOT set: the card asks for 1.5 in instruct mode but also
    # says to turn repetition penalties OFF for tool calling, and this model serves a tool-heavy
    # agent. Revisit only with a measured tool-calling comparison.
    extra_args: "--reasoning-format deepseek --temp 0.5 --top-k 20 --top-p 0.8 --min-p 0.0"
    # The DELIBERATE choice of the non-MTP build. The MTP file exists and is 0.4GiB larger, but
    # draft-mtp speculative decoding already collapsed to ~7 tok/s on this box at 65-85% acceptance
    # under VRAM pressure (2026-08-19), and this card itself says to drop to the plain quant below
    # 50% acceptance. Nothing here would use the MTP tensors, so they would only cost VRAM.
    # `qwen35` arch needs the SWA/hybrid-cache patched build, same image as the other Qwen3.8s.
    backend_image: ordo/llamacpp-patched
    tier: ultra

  - id: qwen3.8-27b-uncensored-q6
