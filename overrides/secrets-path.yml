# Override to fix Docker Desktop WSL2 path translation for secrets
# Docker Desktop cannot see WSL2 paths like /home/hermes/...
# Redirect secrets to /c/dev/ which is a Windows-shared path
secrets:
  hf_token:
    file: /c/dev/ordo-ai-stack/secrets/hf_token
  discord_token:
    file: /c/dev/ordo-ai-stack/secrets/discord_token
  github_pat:
    file: /c/dev/ordo-ai-stack/secrets/github_pat
  civitai_token:
    file: /c/dev/ordo-ai-stack/secrets/civitai_token
