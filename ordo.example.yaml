# ordo.yaml — THE single source of truth. Human-editable. Everything else is regenerated
# from this. Editing a *rendered* output (out/.env, Hermes context, ...) does nothing —
# the next render overwrites it. To make something stick, set it in `overrides:` below.

# Hardware: "auto" detects the machine. For CI / reproducibility, pin an explicit profile.
hardware: auto
# hardware:
#   gpus: [{ name: "RTX 5090", vram_gb: 32 }]
#   ram_gb: 128
#   cpu_cores: 32
#   platform: Linux

# Tier: "auto" lets the sizer pick from hardware (game auto-detect). Or force a named tier
# (cpu | low | medium | high | ultra) — the sizer still refuses to pick a model that won't fit
# unless you also set model: below.
tier: auto

# Model: "auto" = best-fit from the catalog for the detected hardware+tier. Or pin a catalog id
# to override (warn-but-allow: if it won't fit you'll get a warning, not a silent OOM).
model: auto

# Agent that manages the stack. Hermes is the default.
agent: hermes

# Control-plane UI (pluggable, like the agent — any services/<id>/dashboard.yaml).
#   dashboard = the shipped one: Overview, Services, Models, Media and Performance pages,
#               a Settings drawer and a Ctrl/Cmd K palette. It calls `ops-controller`
#               (the `ordo serve` control plane) for everything.
dashboard: dashboard

# Optional plugins (media/song/voice). "auto" = enable what the hardware can run;
# a list forces specific ones. Media plugins are NVIDIA-only and self-declare that.
#
# OPT-IN plugins (`default: false` in their manifest) are the exception: "auto" NEVER enables
# them, because the hardware gate says nothing useful about whether you want them. Today that is
# `langfuse`: self-hosted agent tracing (see services/langfuse/README.md), six containers behind
# the `langfuse` compose profile. To run it, replace `auto` with an explicit list that includes it.
plugins: auto

# Cloud tier-fallback: off by default (fully local, offline-capable). Opt-in only.
cloud_fallback:
  enabled: false

# Host/site config — NOT derived from the model and NOT secret. Flows VERBATIM into the rendered
# .env so the plugin manifests' ${VAR} bind-mount + edge refs resolve deterministically instead of
# defaulting to `./data` relative to out/. This is the single source of truth for the operator's
# filesystem roots + edge identity (kept here, so there is no hand-edit of a derived output).
# A site key can NEVER shadow a derived one (a site LLAMACPP_CTX_SIZE is ignored) — the drift gate
# always wins. BASE_PATH and DATA_PATH are required absolute host paths (`ordo init` records them):
# every host bind is ${VAR:?}, because a relative path resolves to a host path that does not exist
# when ops-controller recreates a service.
site:
  # Host path of the shared markdown vault the memory-vault MCP mounts read-write (required:
  # its compose volume fails loud rather than mounting an empty dir over the vault).
  MEMORY_VAULT_PATH: /srv/ordo/data/memory-vault
  # DATA_PATH: /srv/ordo/data           # where mutable data (agent brain, qdrant, …) is bind-mounted
  # BASE_PATH: /srv/ordo                 # the repo checkout: tracked config, scripts, rendered out/
  # CODE_ROOT: /home/me/dev              # what the codebase-memory UI indexes + the agent /c/dev mirror
  # OPERATOR_SECRETS_DIR: /home/me/.ordo/secrets  # file-based secrets the agent binds into /run/secrets/*
  #                                                # (e.g. discord_token, github_backup_pat)
  # CADDY_TAILNET_HOSTNAME: host.tailnet.ts.net   # edge front door (profile edge)
  # CADDY_TAILNET_DOMAIN: tailnet.ts.net
  # CADDY_BIND: 100.x.y.z                # host tailnet IP Caddy binds :443 to (restricts to the
  #                                       # tailnet interface). CADDY_BIND=0.0.0.0 is also a
  #                                       # supported, deliberate option (binds every interface,
  #                                       # including LAN; the network's NAT/router remains the
  #                                       # internet boundary) — this is how the live stack is
  #                                       # currently configured (operator-approved 2026-07-17).

# Electricity-derived per-token cost for the local models (local-chat, the GPU/CPU pins,
# local-embed), so LiteLLM's spend-per-key and the x-litellm-response-cost header mean
# something. Formula: usd_per_second = inference_watts / 1000 * usd_per_kwh / 3600, then
# input/output cost per token = usd_per_second / (prompt|output)_tokens_per_second. Leave
# unset for $0/token (the historical default). Example below: FPL residential Miami-Dade rate,
# the 5090's 400 W power cap plus host draw, and 7-day Prometheus averages of
# llamacpp:prompt_tokens_seconds / llamacpp:predicted_tokens_seconds.
# cost:
#   usd_per_kwh: 0.145
#   inference_watts: 450
#   prompt_tokens_per_second: 1200
#   output_tokens_per_second: 43

# Escape hatch: values here SURVIVE regeneration and override derived config. Use sparingly —
# this is the one place a human/agent pins something the sizer would otherwise compute.
overrides: {}
  # llamacpp:
  #   ctx_size: 131072
