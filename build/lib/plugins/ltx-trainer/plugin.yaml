# Plugin manifest — the official Lightricks LTX-2/2.3 trainer (packages/ltx-trainer) as a
# stack service. This is the stack's SOLE LoRA trainer (the ai-toolkit plugin was evaluated
# alongside it and retired 2026-07-24 — LTX-trainer won on LTX LoRA quality).
#
# GPU arbitration: the container idles (no UI, CLI-only) and every GPU run is launched as
# `.venv/bin/python /ordo/lease-exec.py <script> <args>`, which acquires
# an exclusive ops-controller lease before the child ever initializes CUDA, heartbeats while it
# runs, stall-guards it, and releases on exit. Nothing service-specific lives in the scheduler.
id: ltx-trainer
name: LTX-2 official trainer
description: Lightricks LTX-2/2.3 LoRA trainer (CLI). GPU runs lease the primary GPU via ops-controller.
requires:
  nvidia: true
  vram_gb: 24          # low-VRAM config floor (int8-quanto + rank 16)
  ram_gb: 32
provides: [training]
compose_profile: ""    # always-on with the core stack (idle container, no VRAM held)
secrets:
  - HF_TOKEN
services:
  - name: ltx-trainer
    # Locally built from docker/ltx-trainer.Dockerfile — tag pins the upstream repo SHA.
    image: ${LTX_TRAINER_IMAGE:-ordo/ltx-trainer:9377758131b1}
    gpu_pin: primary   # cu128 torch (Blackwell); training on the 1070 is a non-starter
    # Torch shares offloaded/pinned tensors via /dev/shm; Docker's 64MB default dies as soon
    # as dataloader workers engage (hit live 2026-07-16).
    shm_size: 8g
    wants_secrets: true
    # HF_TOKEN deliberately does NOT appear in env: secrets flow via secrets.env (wants_secrets).
    # Re-declaring it as ${VAR:-} would substitute EMPTY from the rendered .env and override the
    # real env_file value (live incident 2026-07-15).
    command: ["sleep", "infinity"]
    env:
      TZ: UTC
      OPS_CONTROLLER_URL: http://ops-controller:9000
      # Same allocator config comfyui runs with: at near-full-card occupancy,
      # fragmentation is what OOMs, not real usage.
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True,pinned_use_cuda_host_register:True}
      # ~full card: forces resident eviction and blocks co-runs = the exclusive-lease policy.
      ORDO_LEASE_VRAM_GB: ${LTX_TRAINER_LEASE_VRAM_GB:-30}
      ORDO_LEASE_KIND: training
    volumes:
      # Mutable working tree: configs/, outputs/, precomputed latents.
      - ${DATA_PATH:-./data}/ltx-trainer:/workspace
      # Training datasets (read-only: this service must not mutate them). Owned by this plugin
      # since it became the sole trainer (reparented from data/ai-toolkit/datasets 2026-07-24).
      - ${DATA_PATH:-./data}/ltx-trainer/datasets:/datasets:ro
      # Base weights (bf16 dev checkpoint + Gemma text-encoder dir) in a NAMED VOLUME (ext4
      # inside the VM), NOT a host bind: model loads mmap the weights, and mmap over the
      # 9p/NTFS bind mount hard-hangs (a sharded load once sat 9h frozen — 2026-07-17).
      - ltx-models:/models
      # HF hub cache (same mmap rationale) for anything resolved via hf_hub. The trainer's real
      # weights all live in ltx-models; this is just a small incidental cache, own named volume.
      - hf-hub-cache:/root/.cache/huggingface/hub
      # The lease seam (see header comment). RO: the container must not mutate the wrapper.
      - ${BASE_PATH:-.}/assets/lease-exec.py:/ordo/lease-exec.py:ro
    healthcheck:
      # Cheap invariants: the synced venv exists and the lease seam is mounted — the two things
      # a run depends on. (An `import torch` probe would burn ~10s of CPU every interval.)
      test: ["CMD", "sh", "-c", "test -x /app/LTX-2/.venv/bin/python && test -e /ordo/lease-exec.py"]
      start_period: 30s
      interval: 60s
      timeout: 10s
      retries: 3
