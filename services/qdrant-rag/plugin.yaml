# Plugin manifest - data-only. Declares the qdrant-rag MCP server: a compose service `mcp-qdrant-rag`
# on the internal MCP network, registered with LiteLLM's MCP gateway (its tools reach Hermes as
# `gateway__qdrant_rag-<tool>`).
id: qdrant-rag
name: Qdrant RAG (MCP tools)
description: Semantic RAG search over the stack's Qdrant `documents` collection, via MCP.
kind: mcp                 # an MCP server service (agent tools), not a plain stack service
requires:
  nvidia: false           # light / CPU
  ram_gb: 1
provides: [tools]
depends_on: [rag]         # needs the qdrant + embed services (rag plugin) to answer queries
mcp:
  # Project buildable image (build context services/qdrant-rag): pinned by its build context like
  # llamacpp-patched, so preflight reports 'build first', not a digest warning. It embeds queries
  # via llamacpp-embed to match rag-ingestion's 768-dim nomic vectors.
  image: ordo/qdrant-rag-mcp
  transport: http
  port: 9000
  network: stack          # qdrant:6333 + llamacpp-embed:8080
  env:
    QDRANT_URL: http://qdrant:6333
    EMBED_URL: http://llamacpp-embed:8080
    RAG_COLLECTION: documents
  tools: [qdrant_search, qdrant_status]
