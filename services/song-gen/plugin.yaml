id: song-gen
name: Song generation (MiniMax Music3 / ACE-Step 1.5 XL SFT)
description: Text-to-song with sung vocals. Needs the ComfyUI backend + a large GPU.
requires:
  nvidia: true
  # MiniMax Music3 is the larger of the two backends and therefore sets the floor:
  # DiT fp16 (4.6 GiB) + pruned bf16 text encoder (15.6 GiB) + DAV VAE (0.2 GiB) resident,
  # plus latents/activations. ACE-Step 1.5 XL SFT fits comfortably under the same ceiling.
  vram_gb: 24
  ram_gb: 16
depends_on: [comfyui]   # won't enable unless comfyui is also enabled
provides: [song]
compose_profile: media
# song-gen runs as a workflow + models INSIDE the ComfyUI service (no separate container);
# it contributes only the enable flag and rides comfyui's `media` profile. Hence no `services:`.
env:
  SONG_GEN_ENABLED: "1"

# --- backends -----------------------------------------------------------------------------
# Data-only declaration of which song models this plugin can drive: the weight files each one
# needs and the seeded workflow that drives it. Add a missing weight with the comfyui MCP tool
# download_comfyui_model (url + category), using the pinned URL below.
backends:
  - id: minimax-music3
    name: MiniMax Music3
    default: true
    # Requires ComfyUI >= v0.33.1 — the Music3 nodes (MiniMaxMusic3TextEncode,
    # EmptyMiniMaxMusic3LatentAudio) landed upstream in efd4e951a0. services/comfyui pins
    # COMFYUI_APP_REF to v0.37.0 (73c9bad4), which satisfies this minimum; do not roll that
    # pin back below v0.33.1 without dropping this backend.
    min_comfyui_version: "0.33.1"
    # Pinned to the Comfy-Org repack revision: /resolve/main/ is a moving ref.
    weights:
      - {category: diffusion_models, url: "https://huggingface.co/Comfy-Org/MiniMax-Music-3/resolve/6444666eb6edfb2c7fcab5f8b81da8b84b4b17b6/diffusion_models/minimax_music3_dit_fp16.safetensors"}
      - {category: text_encoders, url: "https://huggingface.co/Comfy-Org/MiniMax-Music-3/resolve/6444666eb6edfb2c7fcab5f8b81da8b84b4b17b6/text_encoders/minimax_music3_text_encoder_pruned_bf16.safetensors"}
      - {category: vae, url: "https://huggingface.co/Comfy-Org/MiniMax-Music-3/resolve/6444666eb6edfb2c7fcab5f8b81da8b84b4b17b6/vae/minimax_music3_dav.safetensors"}
    workflow: scripts/comfyui/workflows/minimax-music3.json
    license: Apache-2.0
    notes: >-
      Caption + lyrics conditioning, up to ~4 min per generation. cfg_scale and top_k are
      baked into the conditioning by MiniMaxMusic3TextEncode, so the sampler runs at cfg 1.0.
  - id: ace-step-1.5-xl-sft
    name: ACE-Step 1.5 XL SFT
    default: false
    min_comfyui_version: "0.30.0"
    weights: null         # operator-supplied weights
    workflow: null        # driven from the operator's own user/default/workflows/audio graphs
    license: Apache-2.0
