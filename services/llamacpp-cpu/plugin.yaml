# Plugin manifest (data-only) — CPU LLM fallback for local-chat.
#
# A second llama.cpp chat server pinned to CPU/RAM (never the GPU), always up. When the
# `ordo serve` scheduler evicts the GPU llamacpp to hand the 5090 to a media render, LiteLLM
# fails `local-chat` over to THIS instance so chat/agent requests keep working (degraded)
# instead of erroring — then routes back to the GPU model when it returns. Routing lives in
# the model-gateway (LiteLLM); this plugin only provides the CPU deployment.
#
# Model: Qwen3.8-35B-A3B Distill (empero-ai, IQ4_XS): Qwen3.8 reasoning distilled into the
# Qwen3.6-35B-A3B MoE (~3B active params, same qwen35moe architecture and window), so it stays
# responsive on CPU while keeping near-27B quality. ~18GB weights in RAM. Chosen over the
# Qwen3.6 UD-Q4_K_M it replaces on this host's tool-call and vision eval (2026-10-16, 12
# threads): 21/24 tool cases against 19/24, and an 8k-token prompt's first token in 99 s against
# 110 s.
#
# Enabled in the `auto` parity set on any host with >=24GB RAM, but its service is DORMANT behind
# the `cpu-fallback` compose profile — the container only starts when COMPOSE_PROFILES includes
# `cpu-fallback` (same pattern as obsidian-livesync-funnel). Safe to merge without touching the
# running stack: no profile active => nothing runs, and LiteLLM's fallback target just sits
# unreachable (harmless) until the profile is turned on.
id: llamacpp-cpu
name: CPU LLM Fallback (Qwen3.8-35B-A3B Distill)
description: Always-on CPU llama.cpp chat server that LiteLLM fails local-chat over to while the GPU is busy.
requires:
  nvidia: false           # deliberately CPU-only — never contends for the 5090
  ram_gb: 25              # ~18GB A3B weights (IQ4_XS) + 0.9GB vision projector + KV cache
provides: [llm-cpu-fallback]
compose_profile: cpu-fallback
services:
  - name: llamacpp-cpu
    # Same upstream llama.cpp server image as the GPU chat backend + llamacpp-embed (Docker pulls it).
    image: ghcr.io/ggml-org/llama.cpp:server-b11552@sha256:fc9b506e89c1a1cfdd7bc056480f54dc657c1c04d76839a08642dc280b8ed2f6
    # Force CPU: CUDA_VISIBLE_DEVICES="" hides every GPU from this container so it can NEVER grab
    # VRAM the render/GPU-llamacpp own, even though the image is a CUDA build. --n-gpu-layers 0 too.
    environment:
      CUDA_VISIBLE_DEVICES: ""
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --model
      - /models/${LLAMACPP_CPU_MODEL:-Qwen3.8-35B-A3B-Distill-IQ4_XS.gguf}
      # The model's own vision projector (its catalog `mmproj:`, provisioned by `ordo fetch`), so an
      # image still works while the fallback serves. Measured: correct image QA, about 9s on 12 cores.
      - --mmproj
      - /models/Qwen3.8-35B-A3B-Distill-mmproj-F16.gguf
      - --n-gpu-layers
      - "0"
      # Ctx MUST match the GPU backend's window. This is the failover target for `local-chat`:
      # a failover must accept anything the primary would, or it rejects requests exactly when
      # the GPU is evicted — which is when it's needed. LLAMACPP_CPU_CTX is DERIVED: the renderer
      # emits it from the same resolved window as LLAMACPP_CTX_SIZE, so the two agree by
      # construction even when a heavier model sizes the GPU window below the model's ctx_default.
      # No fallback: a missing key fails the compose call instead of serving a disagreeing window.
      # This value is NOT how much a client fills (Hermes compacts far earlier); it's the model
      # window. Undersizing it bites live: a 38k-token turn 503'd against a 32k ctx ("exceeds
      # available context size"). ctx-size sets the KV *allocation* (1.08GiB at 106,496 tokens,
      # 2.66GiB at 262,144, q8_0), NOT per-request work: llama.cpp prefills only the tokens sent.
      # The render refuses a window larger than this model's trained window (262,144) and shows
      # the KV cost in `ordo doctor`; see docs/configuration.md "CPU fallback context window".
      - --ctx-size
      - "${LLAMACPP_CPU_CTX?LLAMACPP_CPU_CTX is missing from the rendered .env}"
      - --parallel
      - "1"
      # A declared CPU budget (overrides.llamacpp-cpu.threads; default min(12, half the detected
      # logical CPUs)). This service runs while a render holds the GPU, and unbounded llama.cpp took
      # ~24 of 48 threads, enough on top of the render to trip the host UPS's overload alarm. The
      # same derived value is the compose `cpus` ceiling below, so the argv and the limit agree.
      - --threads
      - "${LLAMACPP_CPU_THREADS?LLAMACPP_CPU_THREADS is missing from the rendered .env}"
      - --threads-batch
      - "${LLAMACPP_CPU_THREADS?LLAMACPP_CPU_THREADS is missing from the rendered .env}"
      # Prompt processing in 2048-token micro-batches, not 512: +17% prefill at the same 12
      # threads on this host (124 -> 145 tok/s on a 2,048-token prompt), so more speed without
      # more cores, which the UPS note above rules out. Costs a larger compute buffer in RAM.
      - --batch-size
      - "2048"
      - --ubatch-size
      - "2048"
      - --jinja                     # use the GGUF's chat template
      - --reasoning-format
      - deepseek                    # match the GPU backend's reasoning handling
      # Sampler parity with the GPU backend, for the same reason the ctx above must match: a
      # failover has to BEHAVE like the primary, not merely accept its requests. Served on
      # llama.cpp's defaults, a reasoning model runs away: on the GPU backend "Say the single word:
      # ready" generated 32,735 reasoning tokens straight into the reasoning cap before this was
      # pinned there (2026-09-21). This deployment had no sampler flags at all, so the failover
      # target was the one that loops, and it only shows up when the GPU is leased, which is
      # exactly when nobody is watching. top-k is the knob that stops it.
      #
      # These mirror the GPU model's catalog extra_args. If those change, change these: the two
      # are a pair, and the drift is silent because the CPU path is rarely exercised by hand.
      - --temp
      - "0.5"
      - --top-k
      - "20"
      - --top-p
      - "0.8"
      - --min-p
      - "0.0"
      # A hard ceiling on thinking, matching the GPU backend. Without it a loop has no bound at
      # all: at ~11 tok/s on CPU, an unbounded reasoning run ties up the failover for many minutes.
      - --reasoning-budget
      - "32768"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      # MUST NOT mmap: the models/gguf Docker Desktop bind mount is 9p, which can't mmap a 20GB
      # file (it hangs at "loading model" with ~0 RAM used). Read it fully into RAM instead, as the
      # GPU llamacpp does. 117GB RAM easily holds the ~20GB A3B. `--load-mode none` is this build's
      # spelling: it removed --no-mmap and exits "invalid argument" on it.
      - --load-mode
      - none
      - --metrics
    resources:
      cpus: "${LLAMACPP_CPU_THREADS?LLAMACPP_CPU_THREADS is missing from the rendered .env}"
    volumes:
      # models-gguf named volume — the 9p bind wedged GGUF reads (2026-08-07); see ordo/render/compose.py.
      - models-gguf:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      start_period: 240s            # loading ~20GB into RAM on CPU is slow; give it room
      interval: 20s
      timeout: 10s
      retries: 12
