# Plugin manifest - data-only. Declares the file-based memory-vault MCP server: a compose service
# `mcp-memory-vault` on the internal MCP network, registered with LiteLLM's MCP gateway (its tools
# reach Hermes as `gateway__memory_vault-<tool>`). Gives Hermes/agents read+write access to the shared
# markdown memory vault (the SAME host dir native Obsidian browses) via mcpvault:
# read_note/write_note/patch_note/search_notes/frontmatter/tags/... - the durable memory substrate
# lives as plain markdown, not a hidden store.
id: memory-vault
name: Memory Vault (MCP tools)
description: Read/write the shared markdown memory vault (Obsidian) via MCP, for durable agent memory.
kind: mcp                  # an MCP server service (agent tools), not a plain stack service
requires:
  nvidia: false            # pure filesystem — no GPU, no network
  ram_gb: 1
  site: [MEMORY_VAULT_PATH]  # the vault bind fails loud without it
provides: [tools]
mcp:
  # Project buildable image (build context services/memory-vault): wraps @bitbonsai/mcpvault pinned
  # to an exact npm version and bridges its stdio server to streamable HTTP with a pinned mcp-proxy.
  # Like the other ordo/* MCP images it's pinned by build context (preflight shows 'build first'),
  # not a registry digest.
  image: ordo/mcpvault-mcp:latest
  transport: http
  port: 9000
  network: internal        # pure filesystem tool: only LiteLLM can reach it, it reaches nothing
  volumes:
    # The shared Obsidian vault (host path from site.MEMORY_VAULT_PATH), READ-WRITE so
    # write_note/patch_note/delete_note persist. Target matches the image CMD `mcpvault /vault`.
    - ${MEMORY_VAULT_PATH:?MEMORY_VAULT_PATH must be set in ordo.yaml site}:/vault
  tools: [read_note, write_note, patch_note, list_directory, delete_note, search_notes, move_note, move_file, read_multiple_notes, update_frontmatter, get_notes_info, get_frontmatter, manage_tags, get_vault_stats, list_all_tags]
