# Plugin manifest (data-only) — the remote-access EDGE / front door: Caddy (TLS + reverse proxy)
# + oauth2-proxy (Google SSO forward-auth). OPTIONAL, profile 'edge'. This is the ONE place the
# stack publishes a host port (Caddy :443): every other service is reached THROUGH the edge. A local
# floor install skips this and is localhost-only.
id: edge
name: Edge (Caddy + oauth2-proxy, remote access)
description: TLS front door + Google SSO forward-auth for remote (Tailscale) access. Opt-in.
requires:
  nvidia: false
  ram_gb: 1
  # Off until the operator sets them. SSO_ALLOWED_EMAILS (comma-separated) is the Google-account
  # allowlist: the render writes it to out/oauth2-proxy/emails.txt, and without it oauth2-proxy
  # would deny everyone.
  site: [CADDY_BIND, CADDY_TAILNET_HOSTNAME, CADDY_TAILNET_DOMAIN, SSO_ALLOWED_EMAILS]
provides: [edge]
compose_profile: edge
env:
  EDGE_ENABLED: "1"
secrets:
  # Google OAuth client + cookie secret.
  - OAUTH2_PROXY_CLIENT_ID
  - OAUTH2_PROXY_CLIENT_SECRET
  - OAUTH2_PROXY_COOKIE_SECRET
# The LiteLLM virtual key the operator hands to EXTERNAL clients (Claude Code, Cline, scripts)
# for the SSO-bypassing /llm/* and /mcp routes. Caddy does not inject it; clients present it.
litellm_key:
  models: [local-chat, local-embed]
  mcp_servers: all
services:
  - name: oauth2-proxy
    # alpine variant ships wget for the healthcheck (the distroless :latest has no shell).
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5-alpine@sha256:8e4bec4f9fe4de10de63070209204075e4407503170aa19893d6e8d99f083d1b
    # oauth2-proxy maps every flag to OAUTH2_PROXY_<FLAG>. The client secret and the cookie secret are
    # read from files (--client-secret-file / --cookie-secret-file, v7.15.4 legacy_options.go and
    # cookie.go); oauth2-proxy uses the file bytes untrimmed, and materialize writes no trailing
    # newline. The client id has no file flag, and is not a secret (it is in every login redirect).
    secrets: [OAUTH2_PROXY_CLIENT_ID]
    secret_files: [OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET]
    command:
      - --provider=google
      - --http-address=0.0.0.0:4180
      - --reverse-proxy=true
      - --set-xauthrequest=true
      - --upstream=static://202
      - --redirect-url=https://${CADDY_TAILNET_HOSTNAME}/oauth2/callback
      # One wildcard covers every rd= target. The Caddy SSO gate builds rd=
      # with {host} (portless), so rd= is always https://<name>.<domain>/… —
      # both the sidecar clean names (chat/dash/…) and the direct :844x ports
      # collapse to a portless host here, all matched by this one entry. (The
      # OAuth callback itself stays on :443 — one Google redirect URI.)
      - --whitelist-domain=.${CADDY_TAILNET_DOMAIN}
      - --cookie-domain=.${CADDY_TAILNET_DOMAIN}
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --cookie-expire=24h
      # Per-request CSRF cookies: open tabs poll their APIs while signed out, and each poll
      # starts a login. With one shared CSRF cookie the newest start overwrites it and the
      # Google callback fails "CSRF token mismatch" (tests/substrate/test_edge_oauth2_proxy.py).
      - --cookie-csrf-per-request=true
      - --cookie-csrf-per-request-limit=10
      - --cookie-csrf-expire=5m
      - --authenticated-emails-file=/etc/oauth2-proxy/emails.txt
      - --skip-provider-button=true
    volumes:
      # The allowlist the render writes from `site: SSO_ALLOWED_EMAILS`. The DIRECTORY is
      # mounted, not the file: a render that replaces the file would leave a single-file bind
      # pointing at the old inode. ${VAR:?} (not :-.): fail-loud like CADDY_BIND below. An
      # EMPTY/unset BASE_PATH would make Docker fabricate an empty dir at the mount → zero-email
      # allowlist → deny-all outage (this happened). Reject an empty value instead.
      - ${BASE_PATH:?BASE_PATH must be set (non-empty)}/out/oauth2-proxy:/etc/oauth2-proxy:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4180/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
  - name: caddy
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    # no secrets: the /mcp and /llm routes delegate auth to LiteLLM
    # No --watch. The Caddyfile is a bind of the TRACKED checkout file, and a change reaches this
    # container only through `ordo apply`: its content digest is a label (config_mounts below,
    # ordo/render/bind_configs.py), so an edit recreates caddy on the next apply, together with
    # the services it routes to. --watch (added 2026-08-10, before those labels existed) applied
    # every working-tree edit or branch checkout to production the moment it was saved: on
    # 2026-10-14 an uncommitted edit repointed :8447 at a listener that was not deployed yet and
    # the Hermes site returned 502 until the file was restored.
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    # CADDY_BIND failsafe: the ${VAR:?} form only rejects an EMPTY/unset value — it makes
    # `docker compose config` exit non-zero if CADDY_BIND is unset, catching the V1 lesson where
    # an empty bind silently degraded to 0.0.0.0:443 with no operator intent behind it. It does
    # NOT reject 0.0.0.0 as a value. CADDY_BIND=0.0.0.0 is the current operator-approved posture
    # (2026-07-17, LAN-reachable, internet-dark verified) — a deliberate choice, not drift.
    # Port-per-service model (2026-07-24): every UI service gets its own SSO-gated
    # Caddy listener — each prebuilt SPA is served at the root it was compiled for,
    # ending the subpath-rewrite bandaid class (webui root-catchall, hermes header
    # base, cbm nginx rewrites). :443 = front door (landing, OAuth callback,
    # /llm + /mcp APIs, legacy-path 302s).
    # Only :443 is listed here. Each UI declares its own port once, as `edge_site:` in its
    # manifest (model-gateway's in ordo/render/engine.py); the render publishes the port of
    # every ENABLED UI on this bind, and tests/substrate/test_edge_sites.py holds the Caddyfile
    # sites and the tailnet sidecars to the same declarations.
    edge_listener:
      bind: "${CADDY_BIND:?CADDY_BIND must be set (non-empty)}"
      ports: [443]
    env:
      CADDY_TAILNET_HOSTNAME: ${CADDY_TAILNET_HOSTNAME}
      CADDY_TAILNET_DOMAIN: ${CADDY_TAILNET_DOMAIN}
    # Read at start: an edit recreates caddy (and its netns members) on the next `ordo apply`
    # (ordo/render/bind_configs.py). The certs directory counts too: a TLS certificate renewal
    # recreates caddy once.
    config_mounts: [/etc/caddy/Caddyfile, /etc/caddy/certs]
    volumes:
      # ${BASE_PATH} (not ./): the Caddyfile is a TRACKED repo file (guarded by
      # tests/test_caddyfile_invariants.py); the ./-relative mount served a stale cutover-era
      # copy from out/auth/ — the drift that shipped an old Caddyfile on 2026-07-15.
      # ${VAR:?} (not :-.): fail-loud like CADDY_BIND above. An empty BASE_PATH would fabricate an
      # empty dir at the Caddyfile mount → the edge comes up with no routes/SSO. Reject it instead.
      - ${BASE_PATH:?BASE_PATH must be set (non-empty)}/auth/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${BASE_PATH:?BASE_PATH must be set (non-empty)}/auth/caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [oauth2-proxy]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

# How `ordo backup` saves this manifest's named volumes (ordo/render/backup_policy.py).
backup:
  caddy_data: live             # TLS certificates and keys; written atomically
  caddy_config: live           # Caddy's autosaved config
