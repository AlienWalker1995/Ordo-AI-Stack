# Plugin manifest (data-only) — the remote-access EDGE / front door: Caddy (TLS + reverse proxy)
# + oauth2-proxy (Google SSO forward-auth). OPTIONAL, profile 'edge'. This is the ONE place V2
# publishes a host port (Caddy :443) — every other service is reached THROUGH the edge. Because
# it's opt-in behind its profile, it stays dormant during a beside-run and only comes up post-flip
# (see CUTOVER.md), so it can't fight the live stack's edge. A local floor install skips this and
# is localhost-only.
id: edge
name: Edge (Caddy + oauth2-proxy, remote access)
description: TLS front door + Google SSO forward-auth for remote (Tailscale) access. Opt-in.
requires:
  nvidia: false
  ram_gb: 1
provides: [edge]
compose_profile: edge
env:
  EDGE_ENABLED: "1"
secrets:
  # Google OAuth client + cookie secret, and the bearer gating the /mcp/* remote route.
  - OAUTH2_PROXY_CLIENT_ID
  - OAUTH2_PROXY_CLIENT_SECRET
  - OAUTH2_PROXY_COOKIE_SECRET
  - MCP_GATEWAY_TOKEN
services:
  - name: oauth2-proxy
    # alpine variant ships wget for the healthcheck (the distroless :latest has no shell).
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3-alpine
    wants_secrets: true       # OAUTH2_PROXY_* resolve from secrets.env
    command:
      - --provider=google
      - --http-address=0.0.0.0:4180
      - --reverse-proxy=true
      - --set-xauthrequest=true
      - --upstream=static://202
      - --redirect-url=https://${CADDY_TAILNET_HOSTNAME}/oauth2/callback
      # One wildcard covers every rd= target. The Caddy SSO gate builds rd=
      # with {host} (portless), so rd= is always https://<name>.<domain>/… —
      # both the sidecar clean names (chat/dash/…) and the direct :844x ports
      # collapse to a portless host here, all matched by this one entry. (The
      # OAuth callback itself stays on :443 — one Google redirect URI.)
      - --whitelist-domain=.${CADDY_TAILNET_DOMAIN}
      - --cookie-domain=.${CADDY_TAILNET_DOMAIN}
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --cookie-expire=24h
      - --authenticated-emails-file=/etc/oauth2-proxy/emails.txt
      - --skip-provider-button=true
    volumes:
      # ${BASE_PATH} (not ./): the allowlist is a TRACKED repo file; a ./-relative mount
      # resolves against the compose project dir (out) and serves a stale copy.
      # ${VAR:?} (not :-.): fail-loud like CADDY_BIND below. An EMPTY/unset BASE_PATH makes
      # Docker fabricate an empty dir at the emails.txt mount → zero-email allowlist → deny-all
      # outage (this happened). Reject an empty value rather than silently mount a directory.
      - ${BASE_PATH:?BASE_PATH must be set (non-empty)}/auth/oauth2-proxy/emails.txt:/etc/oauth2-proxy/emails.txt:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4180/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
  - name: caddy
    image: caddy:2.11.4-alpine
    wants_secrets: true       # MCP_GATEWAY_TOKEN resolves from secrets.env
    # --watch: reload the Caddyfile in-process whenever its content changes. The Caddyfile is a
    # bind-mounted file (line 90), and `docker compose up` CANNOT detect a bind-mount's content
    # changing — only its own service-definition changing. So a commit that edits the Caddyfile
    # (e.g. #169, which repointed :8446 at the ComfyUI admission gate) leaves this container running
    # its STARTUP-time config indefinitely: the render was applied to every service whose compose
    # block changed, but caddy's block was unchanged, so it kept routing the ComfyUI canvas straight
    # to comfyui:8188 — bypassing the GPU lease and OOM-crashing renders beside the resident LLM
    # (2026-08-10). --watch closes that gap at the source: any Caddyfile change auto-applies here,
    # regardless of how it arrived (git pull / edit / render). Caddy's "dev only" caveat is about
    # (a) partial writes and (b) admin-API config being clobbered by the file — neither applies: the
    # file is written atomically (git/editor) and this stack only ever `reload`s from it, never
    # mutates config via the admin API. On an invalid Caddyfile, --watch logs the error and KEEPS
    # the last-good running config, so a bad edit degrades to "not applied", never "edge down".
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]
    # CADDY_BIND failsafe: the ${VAR:?} form only rejects an EMPTY/unset value — it makes
    # `docker compose config` exit non-zero if CADDY_BIND is unset, catching the V1 lesson where
    # an empty bind silently degraded to 0.0.0.0:443 with no operator intent behind it. It does
    # NOT reject 0.0.0.0 as a value. CADDY_BIND=0.0.0.0 is the current operator-approved posture
    # (2026-07-17, LAN-reachable, internet-dark verified) — a deliberate choice, not drift.
    # Port-per-service model (2026-07-24): every UI service gets its own SSO-gated
    # Caddy listener — each prebuilt SPA is served at the root it was compiled for,
    # ending the subpath-rewrite bandaid class (webui root-catchall, hermes header
    # base, n8n strip_prefix, cbm nginx rewrites). :443 = front door (landing, OAuth
    # callback, /llm + /mcp APIs, n8n webhook passthroughs, legacy-path 302s).
    ports:
      - "${CADDY_BIND:?CADDY_BIND must be set (non-empty)}:443:443"
      - "${CADDY_BIND:?CADDY_BIND must be set (non-empty)}:8443:8443"   # chat (Open WebUI)
      - "${CADDY_BIND:?CADDY_BIND must be set (non-empty)}:8444:8444"   # dashboard (+ /grafana/)
      - "${CADDY_BIND:?CADDY_BIND must be set (non-empty)}:8445:8445"   # n8n UI
      - "${CADDY_BIND:?CADDY_BIND must be set (non-empty)}:8446:8446"   # ComfyUI
      - "${CADDY_BIND:?CADDY_BIND must be set (non-empty)}:8447:8447"   # Hermes
      - "${CADDY_BIND:?CADDY_BIND must be set (non-empty)}:8448:8448"   # codebase-memory
      - "${CADDY_BIND:?CADDY_BIND must be set (non-empty)}:8449:8449"   # LiteLLM swagger (model-gateway)
    env:
      CADDY_TAILNET_HOSTNAME: ${CADDY_TAILNET_HOSTNAME}
      CADDY_TAILNET_DOMAIN: ${CADDY_TAILNET_DOMAIN}
    volumes:
      # ${BASE_PATH} (not ./): the Caddyfile is a TRACKED repo file (guarded by
      # tests/test_caddyfile_invariants.py); the ./-relative mount served a stale cutover-era
      # copy from out/auth/ — the drift that shipped an old Caddyfile on 2026-07-15.
      # ${VAR:?} (not :-.): fail-loud like CADDY_BIND above. An empty BASE_PATH would fabricate an
      # empty dir at the Caddyfile mount → the edge comes up with no routes/SSO. Reject it instead.
      - ${BASE_PATH:?BASE_PATH must be set (non-empty)}/auth/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${TAILSCALE_CERT_DIR:-./auth/caddy/certs}:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [oauth2-proxy]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
