# Plugin manifest — declares hardware needs + the compose service(s) it contributes (data-only).
# The renderer reads this (it does NOT execute plugin code): registry-driven, data-driven.
id: comfyui
name: ComfyUI media backend
description: Image/audio/video generation backend. NVIDIA-only.
requires:
  nvidia: true          # media plugins self-declare NVIDIA-only
  vram_gb: 6            # minimum to run a basic workflow
  ram_gb: 8
provides: [media]
compose_profile: media
# env this plugin contributes to the rendered .env when enabled
env:
  COMFYUI_ENABLED: "1"
# HF/GitHub tokens for ComfyUI-Manager node/model installs come from secrets.env.
secrets:
  - HF_TOKEN
  - GITHUB_PERSONAL_ACCESS_TOKEN
# compose service(s) — compose.py renders these from data (no hardcoded if-blocks)
services:
  - name: comfyui
    # Parity with V1: the operator's ComfyUI runtime image. V1 sets this via overrides/compute.yml
    # to a digest-pinned yanwk/comfyui-boot (public, pullable; cu128-slim line — bump deliberately). The ComfyUI application code + custom
    # nodes live in the bind-mounted data/comfyui-storage checkout, and the models in models/comfyui
    # — NOT baked into the image — so pointing at the same image + the same binds gives full parity.
    # Bumped 2026-09-20 from cu128-slim (sha256:4172d960, built 2026-05-16, torch 2.11.0+cu128,
    # python 3.12). That tag line is RETIRED upstream: the maintainer now ships cu126 and cu130
    # only, so there is no same-CUDA successor and staying put means an unmaintained runtime.
    # This is cu130-slim-20260914: torch 2.14.0+cu130, python 3.13, arch list includes sm_120
    # (the 5090). CUDA 13 drops Pascal (sm_61), which is fine ONLY because this container is
    # pinned to the 5090 by uuid; the 1070 is driven by the voice services' own images.
    # NOT cu130-slim-v2: that variant ships no torch at all and would install it at first boot.
    # Rollback: sha256:4172d960fe57c630d33f6bd8891aa7ecf55e7768559565c6b74e8d57e44512a9
    image: ${COMFYUI_IMAGE:-yanwk/comfyui-boot@sha256:b0243e214a740527ff4e481070a34f83a448298757ec2da3295bbfbd79cb3901}
    # Pin to the PRIMARY (compute) card by uuid — V1 pins comfyui to the 5090 in gpu-assignments.yml.
    # `gpu: true` alone renders `count: all`, which on a dual-GPU WSL2 box lets ComfyUI also see the
    # 1070; the uuid pin (CUDA_VISIBLE_DEVICES + device_ids) is the only thing WSL2 actually honors.
    gpu_pin: primary      # rides the primary (compute) GPU — the same card llama.cpp lives on
    # --- GPU arbitration (ordo/gpu.py) ------------------------------------------------------
    # ComfyUI is the canonical `burst` consumer: idle most of the time, and GPU-hungry the
    # instant something is queued — by Hermes, by the MCP, or by a human pressing Queue Prompt
    # in the node-graph web UI. It cannot take residency at start (it would hold the card
    # forever) and it cannot be trusted to take it per job (the web UI has never heard of the
    # scheduler). So its enforcement is a GATE: a companion proxy, rendered automatically from
    # this block, that acquires residency BEFORE a submission is forwarded to the server. That
    # ordering is the point — ComfyUI begins executing the moment /prompt lands, so anything
    # that reacts afterwards has already allowed the dual-tenant window that bugchecked the
    # host on 2026-08-08 (0x113, ~4h at ~98% VRAM beside the resident llama.cpp).
    #
    # `vram_gb: exclusive` = the whole card. A render must NOT share the 5090: the arbiter
    # reclaims llama.cpp (which migrates to llamacpp-cpu, see its yield contract) and admits no
    # co-runner. The sentinel resolves against real hardware, so this stays correct on a card
    # that isn't 32GB instead of encoding one box's number.
    gpu_arbitration:
      mode: burst
      enforcement: gate
      device: primary
      vram_gb: exclusive
      est_seconds: 300      # reporting hint for the busy-ETA; the gate heartbeats for the truth
      kind: media
      gate:
        upstream_port: 8188
        # Every path that starts GPU work. `/api/prompt` is the same handler under the
        # frontend's /api prefix — gating only `/prompt` would leave a live bypass.
        # `/dialogue_reel/render` is the custom node (custom_nodes/dialogue_reel_endpoint) that
        # launches the Rick and Morty reel render as a subprocess; that subprocess queues its
        # VibeVoice-Large prompts on ComfyUI's own loopback /prompt, which never passes the gate,
        # so residency has to be taken when the render is launched.
        submit_paths: [/prompt, /api/prompt, /dialogue_reel/render]
        submit_methods: [POST]
        # A submit returns as soon as the prompt is accepted; the render runs afterwards. The
        # queue is therefore the only honest signal for when the work has actually drained.
        queue_path: /queue
        queue_style: comfyui
        drain_seconds: 60
        # A human is watching a browser spinner. Wait this long for the card, then refuse
        # honestly rather than hanging the UI — see services/gpu-gate.
        acquire_timeout_seconds: 120
    # Docker defaults /dev/shm to 64MB, which starves torch DataLoader workers and the VAE
    # decode path on large frames. The DEPLOYED out/docker-compose.yml already carried
    # `shm_size: 8g`, but it was hand-added to the generated file, which this source did not
    # reproduce — so any re-render silently reverted ComfyUI to 64MB. Declaring it here
    # reconciles source with what is actually running; do not remove without checking renders.
    shm_size: 8g
    env:
      CLI_ARGS: ${COMFYUI_CLI_ARGS:---cpu --enable-manager}
      # --- ComfyUI application version — PINNED -------------------------------------------
      # The image digest above pins the RUNTIME (torch/CUDA/entrypoint). The ComfyUI
      # application itself lives on the comfyui-app volume, so the image says nothing about
      # which ComfyUI is running — before this pin existed the answer was "whatever was last
      # checked out by hand", which is unpinned, undeclared and unreproducible.
      #
      # scripts/comfyui/boot.sh reconciles the checkout to this ref on every start (and
      # refuses to boot a version that isn't this one), so declared == running is enforced.
      # Bumping it here is the ONLY supported way to change ComfyUI versions; the ref's own
      # requirements.txt then carries the matching Comfy-Org runtime pins.
      #
      # 73c9bad4 = tag v0.37.0 (2026-09-20), the FIRST release carrying Qwen-Image 2.1
      # support (upstream 6bfaacc6, CORE-423). The previous pin 72865f4f = v0.33.1 could not
      # load the 2.1 VAE at all: it builds a 12-channel decoder head against the release's
      # 4-channel checkpoint and dies on a shape mismatch. v0.33.1 remains the rollback, and
      # it still carries the MiniMax Music3 nodes (upstream efd4e951a0) that services/song-gen
      # declares, as does this one. Pin a full commit SHA, never a tag or branch — tags are
      # movable refs, and "float" is how you get a different app on the next recreate.
      # KNOWN REGRESSION at this pin: ComfyUI-LTXVideo fails to import against 0.37.0
      # (comfy.ldm.lightricks.model no longer exports interleaved_freqs_cis). The LTX nodes
      # are unavailable until that custom node is updated to a 0.37-compatible revision.
      COMFYUI_APP_REF: ${COMFYUI_APP_REF:-73c9bad4d21e7addbe1d13bc92eee0f1431b017d}
      # V1's proven allocator config (overrides/compute.yml). An EMPTY string here is worse than
      # omitting it: torch's allocator parser rejects "" with `ValueError: Unrecognized key ','` at
      # `torch._C._cuda_init()`, crash-looping ComfyUI on boot. Default to V1's value; operator-
      # overridable via ${PYTORCH_CUDA_ALLOC_CONF}.
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True,pinned_use_cuda_host_register:True}
      OPS_CONTROLLER_URL: http://ops-controller:9000
      OPS_CONTROLLER_TOKEN: ${OPS_CONTROLLER_TOKEN:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      HF_TOKEN: ${HF_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
    volumes:
      # ComfyUI app code + custom nodes: a NAMED VOLUME (ext4 in the WSL2 VM), not the old
      # data/comfyui-storage Windows bind. ComfyUI v0.30's startup I/O deterministically
      # wedged the 9p mount (main.py D-state in p9_client_rpc before binding HTTP, 3/3
      # boots, 2026-08-06) — the same 9p pathology class that hit the Hermes brain (#143)
      # and llamacpp (--no-mmap). Volume seeded from a fresh v0.30.2 clone + the operator's
      # custom_nodes/user/input; the old bind is retained as rollback then retired.
      - comfyui-app:/root
      # Model weights (~390GB) — NAMED VOLUME (ext4), not the old models/comfyui 9p bind.
      # The 9p bridge wedges on metadata walks (p9_client_rpc D-state) — this tree is why
      # --enable-assets had to be disabled, and it was the largest remaining exposure of
      # the seam that took out the Hermes brain (#143), the app tree (#156) and the gguf
      # models (#158). Seeded from the host tree 2026-08-07; the dashboard model-pack
      # pull UI writes into the same volume (its RW /models mount), so downloads land
      # where ComfyUI reads. (The old COMFYUI_MODELS_PATH override relocated the host
      # bind — moot for a named volume, removed.)
      - comfyui-models:/root/ComfyUI/models:ro
      # Render outputs — staged under the V2 data root.
      - ${DATA_PATH:?DATA_PATH must be set (non-empty)}/comfyui-output:/root/ComfyUI/output
      # Boot reconciler + the repo-owned workflow templates it seeds. Read-only, and tiny —
      # the 9p pathology that drove the app tree and the weights onto named volumes is an
      # I/O-volume problem, not a "no binds ever" rule; llamacpp mounts its run script the
      # same way. Keeping the logic in a tracked, reviewable script (rather than a 20-line
      # YAML string) is what makes the version reconcile testable instead of folklore.
      - ${BASE_PATH:?BASE_PATH must be set (non-empty)}/scripts/comfyui:/comfyui-scripts:ro
    command:
      # Reconcile the app checkout to COMFYUI_APP_REF, install the Comfy-Org runtime pins
      # that ref declares, seed repo-owned workflows, install custom-node deps, then exec the
      # image entrypoint. See scripts/comfyui/boot.sh for the full rationale.
      # HF_TOKEN / GITHUB_TOKEN come from the env above (secrets.env).
      - bash
      - /comfyui-scripts/boot.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/"]
      start_period: 420s
      interval: 20s
      timeout: 15s
      retries: 12
