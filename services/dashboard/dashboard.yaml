id: dashboard
name: Ordo control-plane dashboard
description: >
  The operator's control-plane UI: five pages (Overview, Services, Models, Media, Performance)
  plus a Settings drawer (MCP servers, ComfyUI custom-node requirements) and a Ctrl/Cmd K command
  palette. Models switches the GPU model through ops-controller; Performance embeds the Grafana
  "Ordo performance" dashboard (/grafana/). Token auth and Caddy SSO trust.

  The frontend is same-origin (it calls /api/* only, with no baked backend hostname) and the
  FastAPI backend reads OPS_CONTROLLER_URL at runtime, so it points straight at `ops-controller`,
  which serves every route it calls.
default: true
image: ordo/dashboard
# Build context is NESTED (the Dockerfile lives in the dashboard/ subdir, not this manifest's own
# services/dashboard/ folder), so it's declared explicitly — the resolver/substrate test otherwise
# defaults to services/<id>. METADATA only; never rendered into compose.
build:
  context: services/dashboard/dashboard
# Local access while the edge is off: http://127.0.0.1:8444 (the port Caddy serves the dashboard on).
# The renderer binds it to loopback only and drops it when the edge is enabled.
local_port: {host: 8444, container: 8080}
# Without the edge there is no SSO identity, so the local operator signs in with this secret
# (dashboard/auth.py exchanges it for a session cookie). The renderer passes it to the dashboard,
# and requires it in secrets.env, only while local_port is published; `ordo up` prints the link.
local_login_secret: DASHBOARD_LOCAL_LOGIN_TOKEN
# Read-only GPU visibility for the dashboard SERVICE ITSELF. Its `hardware_stats()` (the
# hw-stat bar's GPU widgets) shells to nvidia-smi (_probe_gpu) and enumerates cards
# (gpu_stats.list_gpus), which the NVIDIA runtime only injects when the service reserves a GPU
# with the `utility` cap. Without it `hardware_stats()` returns gpu:null + gpus:[] and the GPU
# widgets go blank. `count: all` so it reads BOTH cards. Compute is NOT reserved.
# Rendered on NVIDIA hosts only: a CPU-only host has no NVIDIA runtime to satisfy it.
gpu: utility
depends_on:
  ops-controller: service_started
# The /api/health probe keeps the agent's `dashboard: service_healthy` gate satisfiable. The
# image ships python3 and not curl, so the probe is a python3 urllib call.
healthcheck:
  test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s
# Env secrets it reads: the control-plane token (sent to ops-controller, and accepted from internal
# callers on the dashboard's protected routes), and the throughput token it checks on
# /api/throughput/record (must match model-gateway's). LITELLM_MASTER_KEY is mapped in environment.
secrets: [OPS_CONTROLLER_TOKEN, THROUGHPUT_RECORD_TOKEN]

environment:
  # The control plane. Every route this dashboard calls is served by ops-controller.
  OPS_CONTROLLER_URL: http://ops-controller:9000
  # Backend service URLs the dashboard reads at runtime (all V2 service names).
  LLAMACPP_URL: http://llamacpp:8080
  MODEL_GATEWAY_URL: http://model-gateway:11435
  MODEL_GATEWAY_API_KEY: ${LITELLM_MASTER_KEY}
  # LiteLLM's MCP gateway is the model-gateway itself (MODEL_GATEWAY_URL above). The enabled server
  # set is the render-emitted out/mcp/servers.json (mounted read-only at /mcp-config); health comes
  # from LiteLLM (/v1/mcp/server/health + tools/list outcomes), so a crashed server shows red. A UI
  # MCP toggle maps server_id -> plugin_id (inside servers.json) and asks ops-controller to
  # enable/disable that plugin: ops-controller is the only writer of the operator source.
  MCP_SERVERS_PATH: /mcp-config/servers.json
  # The ComfyUI GPU admission gate, rendered only while comfyui is enabled (render.GATED_SERVICE_URL_ENV).
  # Empty otherwise, which the dashboard reports as ComfyUI unavailable. Never a direct fallback:
  # comfyui sits on a network only its gate joins.
  COMFYUI_URL: ${COMFYUI_URL:-}
  QDRANT_URL: http://qdrant:6333
  # On-disk model dirs (bind-mounted below): /api/llm/* scans GGUF_MODELS_DIR; MODELS_DIR is comfyui.
  GGUF_MODELS_DIR: /gguf-models
  MODELS_DIR: /models
  LLAMACPP_CTX_SIZE: ${LLAMACPP_CTX_SIZE:-262144}
  # Dashboard state (orchestration jobs, throughput samples, MCP registry) — staged V2 data tree.
  # V1 defaults DASHBOARD_DATA_PATH to ./data/dashboard under /app (not writable by appuser); pin it
  # to the mounted /data/dashboard so startup mkdir succeeds.
  DASHBOARD_DATA_PATH: /data/dashboard
  # No dashboard-specific auth config: its protected routes (dashboard/auth.py) trust the SSO
  # identity only from the `caddy` peer, resolved by name (no subnet to drift), or the
  # OPS_CONTROLLER_TOKEN bearer declared in `secrets:` above.
  # `hardware_stats()` calls psutil.disk_usage(BASE_PATH) for the hw-stat bar's DISK widget. The render
  # emits BASE_PATH=<Windows host path> into the shared .env (compose NEEDS it there to interpolate
  # ${BASE_PATH} volume mounts on the host) — but env_file injects that Windows path into THIS Linux
  # container too, where psutil.disk_usage("C:/dev/...") raises FileNotFoundError -> disk_*:null.
  # A per-service `environment:` value BEATS env_file, so pin the IN-CONTAINER disk-probe target to
  # the always-mounted /data/dashboard (same host C: drive -> correct host-disk stats). This mirrors
  # Only the dashboard reads BASE_PATH for an in-container fs call. Everywhere else it stays the
  # HOST path, because that is what compose interpolates ${BASE_PATH} with for bind mounts.
  BASE_PATH: /data/dashboard
  # The rendered manifest (out/manifest.json) — the machine-readable enabled-plugin set.
  # The service grid gates its cards on manifest.plugins_enabled (services_catalog.visible_services)
  # so it reflects what THIS render actually enabled and can't silently omit an enabled service.
  # Mounted read-only; the dashboard only reads it. Fails open (full catalog) if ever absent.
  MANIFEST_PATH: /ordo-manifest.json
  # The rendered service-card catalog (out/services-catalog.json) — `ordo render` aggregates it
  # from the per-service services/<id>/catalog.json fragments (each service declares its own
  # dashboard card next to its other manifests). services_catalog.py loads it from this path;
  # the React grid renders it. Missing/unreadable -> the loader falls back to reading the repo
  # fragments directly (dev checkouts) and logs loudly if neither source exists.
  SERVICES_CATALOG_PATH: /ordo-services-catalog.json
# The dashboard reads on-disk GGUFs from GGUF_MODELS_DIR (the models-gguf volume) and lists
# comfyui models via MODELS_DIR; its own state lives in the staged V2 data tree.
volumes:
  # RW view of the SAME models-gguf volume the llama.cpp services read, so the Models page's
  # delete removes the file the backends load; 9p bind retired 2026-08-07 (see ordo/compose.py).
  - models-gguf:/gguf-models
  # RW view of the SAME comfyui-models volume ComfyUI reads, so the Media page's model
  # delete removes the file ComfyUI loads; 9p bind retired 2026-08-07 (Stage 2, see
  # services/comfyui/plugin.yaml for the seam rationale).
  - comfyui-models:/models
  - ${DATA_PATH:?DATA_PATH must be set (non-empty)}/dashboard:/data/dashboard
  # ${BASE_PATH}/out/ (not ./) on the three binds below: ops-controller recreates the dashboard
  # with the project dir at its own /config mount, where ./x resolves to a host path that
  # does not exist (tests/substrate/test_compose.py pins this).
  # The rendered out/mcp dir (servers.json). READ-ONLY: nothing live is written here any more.
  - ${BASE_PATH:?BASE_PATH must be set (non-empty)}/out/mcp:/mcp-config:ro
  # The rendered manifest (out/manifest.json). Read-only: the grid's
  # enabled-gate only reads plugins_enabled. See MANIFEST_PATH above.
  - ${BASE_PATH:?BASE_PATH must be set (non-empty)}/out/manifest.json:/ordo-manifest.json:ro
  # The rendered service-card catalog (out/services-catalog.json). Read-only: the grid's
  # card list — see SERVICES_CATALOG_PATH above.
  - ${BASE_PATH:?BASE_PATH must be set (non-empty)}/out/services-catalog.json:/ordo-services-catalog.json:ro
