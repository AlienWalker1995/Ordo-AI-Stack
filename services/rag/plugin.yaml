# Plugin manifest (data-only) — the RAG stack: vector DB + embedding server + folder-watch ingester.
# Groups the three V1 services that form retrieval: qdrant (store), inference-engine-embed (768-dim
# EmbeddingGemma 2 embeddings), rag-ingestion (watches a folder → chunks → embeds → upserts). The qdrant-rag MCP
# plugin depends on this so the agent's qdrant_search only registers when the store is running.
id: rag
name: RAG (Qdrant + embeddings + ingestion)
description: Vector store, local embedding server, and folder-watch ingester for retrieval.
requires:
  nvidia: false           # CPU-ok: qdrant + a CPU embed server run without a GPU
  ram_gb: 4
provides: [rag]
compose_profile: rag
env:
  RAG_ENABLED: "1"
services:
  - name: qdrant
    # Vector DB — pinned to the exact version V1 runs. No host port in V2 (reached at qdrant:6333
    # on the project network; V1's 127.0.0.1 publish was host-debug only).
    image: qdrant/qdrant:v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    volumes:
      # NAMED VOLUME, not a ${DATA_PATH} 9p bind: qdrant mmaps its segments, and on
      # Docker Desktop every 9p metadata op (stat during path walk) can wedge in
      # p9_client_rpc D-state — the 2026-08-07 architect review flagged the DB
      # binds as the next casualties of the seam that took out the Hermes brain
      # (#143), ComfyUI (#156) and the gguf models (#158). State never rides 9p.
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 30s
      timeout: 10s
      retries: 3
  - name: inference-engine-embed
    serves:
      model: local-embed
      kind: embedding
      metrics: none
    # Embedding server — same upstream llama.cpp build as the chat backend, run in --embeddings mode
    # on EmbeddingGemma 2 (text). rag-ingestion + the qdrant-rag MCP both embed against THIS so ingest and
    # query share the same 768-dim space. Stock upstream server image (Docker pulls it).
    # The CPU build every llama.cpp backend pins (ordo/render/llamacpp_backend.py), by tag + digest.
    image: ghcr.io/ggml-org/llama.cpp:server-b11552@sha256:fc9b506e89c1a1cfdd7bc056480f54dc657c1c04d76839a08642dc280b8ed2f6
    # CPU only, deliberately: this image is the CPU build, so the weights (~0.3GB) and KV cache live
    # in RAM. It reserves no GPU and is no GPU resident, so a render never stops it and retrieval
    # stays up while one runs. A full re-embed of the index takes ~6 minutes on CPU.
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --model
      - /models/${LLAMACPP_EMBED_MODEL:-embeddinggemma-2-Q8_0.gguf}
      - --ctx-size
      - "8192"
      # For embeddings each input must fit inside ONE physical batch — the upstream default
      # (n_ubatch=512) 500s on any chunk over 512 tokens ("input is too large to process"), which a
      # 400-word markdown chunk routinely is. 2048 covers the worst tokens-per-word case of the
      # ingester's 400-word chunks with headroom, well inside the 8192 ctx.
      - --batch-size
      - "2048"
      - --ubatch-size
      - "2048"
      - --embeddings
    volumes:
      # models-gguf named volume — the 9p bind wedged GGUF reads (2026-08-07); see ordo/render/compose.py.
      - models-gguf:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      start_period: 60s
      interval: 15s
      timeout: 10s
      retries: 5
  - name: rag-ingestion
    # Folder-watch ingester — LOCALLY-BUILT in V1 (./rag-ingestion). V2 pins it as a project
    # buildable image (build context services/rag). Embeds directly against
    # inference-engine-embed (litellm's /v1/embeddings 500s for the local embed model).
    image: ordo/rag-ingestion
    env:
      MODEL_GATEWAY_URL: http://inference-engine-embed:8080
      EMBED_MODEL: ${EMBED_MODEL:-${LLAMACPP_EMBED_MODEL:-embeddinggemma-2-Q8_0.gguf}}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${RAG_COLLECTION:-documents}
      # EmbeddingGemma 2's document prompt; the qdrant-rag MCP sends the matching query prompt.
      # `title: none` measured at least as well as the file name as title (2026-10-11 A/B).
      EMBED_DOCUMENT_PREFIX: "title: none | text: "
      WATCH_DIR: /watch
      CHUNK_SIZE: ${RAG_CHUNK_SIZE:-400}
      CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-50}
      SCAN_INTERVAL_SEC: ${RAG_SCAN_INTERVAL_SEC:-15}
    volumes:
      - ${DATA_PATH:?DATA_PATH must be set (non-empty)}/rag-input:/watch
      # Obsidian memory vault as a second (read-only) input root, nested inside the watch tree so
      # the recursive watcher/scanner picks it up with zero ingester config. Vault internals
      # (.obsidian/, .trash/) are excluded by the ingester's hidden-path rule. Same var the
      # memory-vault MCP mounts, so both views are the one vault.
      - ${MEMORY_VAULT_PATH:-${DATA_PATH:?DATA_PATH must be set (non-empty)}/memory-vault}:/watch/memory-vault:ro
      # Stack documentation (operator guide, runbooks, PRDs, agent docs) as a THIRD read-only input
      # root, nested in the watch tree like the vault so the recursive scanner auto-indexes it with
      # zero ingester config — making the stack's own docs semantically searchable by Hermes and any
      # other qdrant_search client. ${BASE_PATH} is the host repo root (must be a host path).
      - ${BASE_PATH:?BASE_PATH must be set (non-empty)}/docs:/watch/stack-docs:ro
    depends_on: [inference-engine-embed, qdrant]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/rag-ingestion.heartbeat"]
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 3

# How `ordo backup` saves this manifest's named volumes (ordo/render/backup_policy.py).
backup:
  qdrant-data: stopped         # Qdrant segments: snapshot with Qdrant stopped
