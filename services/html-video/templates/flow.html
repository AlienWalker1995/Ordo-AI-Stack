{% extends "base.html" %}
{% block body_class %}flow{% endblock %}
{% block card %}
{% if d.title %}<h1 class="title write" style="--d:.45s">{{ d.title }}</h1>{% endif %}
<div class="steps">
{% for step in d.steps %}
  {% if not loop.first %}
  <svg class="arrow" viewBox="0 0 80 40" aria-hidden="true" style="--d:{{ '%.2f' % (0.75 + loop.index0 * 0.4 - 0.18) }}s">
    <path class="draw" d="M4 20 H66 M50 6 L68 20 L50 34"/>
  </svg>
  {% endif %}
  <div class="step pop" style="--d:{{ '%.2f' % (0.75 + loop.index0 * 0.4) }}s">{{ step }}</div>
{% endfor %}
</div>
{% endblock %}
