# Plugin manifest - data-only. Declares the ComfyUI MCP server: a compose service `mcp-comfyui` on
# the internal MCP network, registered with LiteLLM's MCP gateway (its tools reach Hermes as
# `gateway__comfyui-<tool>`). The comfyui compose SERVICE itself is provided by the separate `comfyui`
# (kind=service) plugin; THIS plugin only exposes ComfyUI's media tools (workflows, images, video,
# model pull, system stats, queue, history, installed models/nodes/extensions) to Hermes.
#
# Plugin id is `comfyui-mcp` (the service plugin already owns `comfyui`), but mcp.server_id pins the
# SERVER id back to `comfyui`, so the compose service is `mcp-comfyui` and the tool prefix stays
# `comfyui-`.
id: comfyui-mcp
name: ComfyUI (MCP tools)
description: ComfyUI media tools (workflows, images, video, model pull, system stats, queue, history, installed models/nodes/extensions) exposed to the agent via MCP.
kind: mcp                  # an MCP server service (agent tools), not a plain stack service
requires:
  nvidia: false            # the MCP is a thin HTTP client of comfyui:8188; the GPU work is comfyui's
  ram_gb: 1
provides: [tools]
depends_on: [comfyui]      # queries the comfyui service (kind=service plugin) + ops-controller
# OPS_CONTROLLER_TOKEN is an operator secret. Declaring it here emits the key into
# secrets.env.example; the rendered MCP service reads secrets.env as a second env_file, so the
# ${OPS_CONTROLLER_TOKEN} ref below interpolates to the real value at compose time.
secrets:
  - OPS_CONTROLLER_TOKEN
mcp:
  # Server id + Hermes tool-namespace prefix (comfyui-*). Decoupled from the plugin id so it stays
  # `comfyui` even though the plugin is `comfyui-mcp` (the comfyui SERVICE plugin owns the id).
  server_id: comfyui
  # Project buildable image (build context services/comfyui-mcp): pinned by its build context
  # (upstream commit e0101b2312f3 + stack overrides), so preflight reports 'build first'.
  image: ordo/comfyui-mcp:latest
  transport: http
  port: 9000
  network: stack           # comfyui (via the admission gate) + ops-controller
  # Renders may run for many minutes: LiteLLM's per-server tool timeout must cover a queue+wait.
  timeout: 1800
  env:
    # Compose interpolation: render points COMFYUI_URL at the GPU admission gate when comfyui is
    # gate-enforced (render.GATED_SERVICE_URL_ENV), so agent-submitted prompts take residency by the
    # same path a human's Queue Prompt does instead of bypassing GPU arbitration.
    COMFYUI_URL: ${COMFYUI_URL:-http://comfyui:8188}
    OPS_CONTROLLER_URL: http://ops-controller:9000
    OPS_CONTROLLER_TOKEN: ${OPS_CONTROLLER_TOKEN}
    COMFY_MCP_DEFAULT_MODEL: ${COMFY_MCP_DEFAULT_MODEL:-flux1-schnell-fp8.safetensors}
  healthcheck:
    test: ["CMD", "python3", "-c", "import socket;socket.create_connection(('127.0.0.1',9000),5).close()"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s
  # Representative subset of the 34 tools the image registers (verified against the built image);
  # LiteLLM advertises the full set at runtime.
  tools: [get_comfyui_system_stats, get_comfyui_queue, get_comfyui_models, list_workflows, run_workflow]
