# Plugin manifest (data-only) — OFF-TAILNET public access for the Obsidian sync endpoint via
# Tailscale Funnel. A single Tailscale sidecar joins the tailnet as `notes.<CADDY_TAILNET_DOMAIN>`
# and Funnels its :443 to CouchDB (by service name) so Obsidian LiveSync works from devices with NO
# Tailscale at all. The public endpoint is protected by CouchDB's own auth (require_valid_user) and
# LiveSync end-to-end encryption (note content is encrypted at rest in CouchDB).
#
# DELIBERATELY a SEPARATE plugin + profile (`notes-funnel`, NOT `notes`): exposing notes to the
# public internet is an opt-in flip, never automatic with the sync feature. It stays dormant until
# BOTH the operator adds `notes-funnel` to COMPOSE_PROFILES AND the tailnet ACL grants this node the
# `funnel` attribute (one-time, operator-only — see docs/runbooks/notes-sync.md). Rendering +
# compose-config are validated here; live reachability requires those operator prerequisites.
id: obsidian-livesync-funnel
# Opt-in: `plugins: auto` leaves it out, so public exposure (and the Tailscale key it needs) only
# happens when the operator lists it by id.
default: false
name: Obsidian sync - public access (Tailscale Funnel)
description: Off-tailnet public HTTPS for the CouchDB LiveSync endpoint via Tailscale Funnel (notes.<tailnet>). Opt-in.
requires:
  nvidia: false
  ram_gb: 1
depends_on: [obsidian-livesync]   # meaningless without the CouchDB it fronts
provides: [notes-funnel]
compose_profile: notes-funnel
env:
  NOTES_FUNNEL_ENABLED: "1"
secrets:
  # Reusable tagged auth key (tag:ordo-edge) — same key the tailnet-names sidecars use.
  - TS_AUTHKEY
services:
  - name: notes-funnel
    # Tailscale sidecar with its own network namespace; `tailscale serve` proxies to CouchDB by
    # service name (http://couchdb:5984). It no longer shares CouchDB's netns: a shared netns loses
    # its member whenever the owner restarts first (tailnet-names, 2026-10-06). AllowFunnel in the
    # serve config makes it public.
    # Multi-arch INDEX digest (amd64 + arm64), never a per-platform child: a child digest runs
    # emulated or not at all on the other arch. Verify: docker buildx imagetools inspect <ref>
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    secret_files: [{key: TS_AUTHKEY, env: TS_AUTHKEY, prefix: "file:"}]
    depends_on: [couchdb]
    env:
      TS_HOSTNAME: notes
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    # Read at start: an edit recreates the service on the next `ordo apply` (ordo/render/bind_configs.py).
    config_mounts: [/config/serve.json]
    volumes:
      - ts-state-notes:/var/lib/tailscale
      - ${BASE_PATH:?BASE_PATH must be set (non-empty)}/assets/tailscale-serve/notes-funnel.json:/config/serve.json:ro
    healthcheck:
      test: ["CMD", "tailscale", "status", "--peers=false"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3

# How `ordo backup` saves this manifest's named volumes (ordo/render/backup_policy.py).
backup:
  ts-state-notes: live         # the Tailscale node key
