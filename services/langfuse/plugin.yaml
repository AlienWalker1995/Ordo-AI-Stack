# Plugin manifest (data-only) - LANGFUSE, self-hosted LLM observability. OPTIONAL, profile
# 'langfuse'. Six containers (web + worker + postgres + clickhouse + redis + minio) implement one
# product; that is upstream's supported topology, not accidental sprawl, so they ride one profile
# and one plugin id. Reached like every other UI: behind the Caddy SSO edge on :8450 and the
# `langfuse.<tailnet>` sidecar name (see services/edge + services/tailnet-names).
#
# WHAT SENDS TRACES: two writers, told apart by Langfuse `environment`.
#   * `gateway`: model-gateway's LiteLLM `langfuse_otel` callback, one generation per LLM call for
#     EVERY consumer (Hermes, Open WebUI, n8n, edge clients, health probes), tagged with the virtual
#     key alias. Wired by the renderer only while this plugin is enabled (ordo/render/compose.py
#     GATEWAY_LANGFUSE_ENV).
#   * `hermes`: the Hermes agent's bundled `observability/langfuse` plugin (turn, LLM-call and tool
#     spans; services/hermes/{Dockerfile,agent.yaml,entrypoint.sh}).
# Hermes's LLM calls therefore appear once in EACH environment: LiteLLM 1.100.1 has no open-source
# way to exclude one virtual key from a callback (the per-key `litellm_disabled_callbacks` switch is
# enforced only for premium users). Filter dashboards by environment. See README.md in this dir.
#
# RETENTION (self-hosted Langfuse retention is an Enterprise feature): `langfuse-retention` deletes
# traces older than LANGFUSE_RETENTION_DAYS through the public API, and `langfuse-minio-lifecycle`
# expires the blob store's objects after the same number of days.
#
# OPT-IN (`default: false`): the hardware gate says nothing useful here - six containers run fine on
# any box - so the gate is the operator's explicit request. `plugins: auto` will NOT enable it.
id: langfuse
name: Langfuse (self-hosted tracing)
description: Agent traces, datasets and evals. Self-hosted Langfuse v4 with unattended init; Hermes sends turns/LLM calls/tool calls.
default: false
requires:
  nvidia: false
  # Six JVM-free but memory-hungry services (ClickHouse alone wants ~2GB headroom). Not a hard
  # blocker on a small box, but low enough that a 4GB host does not silently thrash.
  ram_gb: 8
provides: [langfuse]
compose_profile: langfuse
env:
  LANGFUSE_ENABLED: "1"
# LANGFUSE_PUBLIC_URL and LANGFUSE_ADMIN_EMAIL are NOT declared here: they are emitted by
# ordo/render/engine.py AFTER the `site:` merge, so an operator can override either from `site:`. A plugin
# `env:` entry wins over site and would have made them unoverridable. See render.langfuse_public_url.
secrets:
  # Infra credentials for the four backing stores.
  - LANGFUSE_DB_PASSWORD
  - LANGFUSE_CLICKHOUSE_PASSWORD
  - LANGFUSE_REDIS_AUTH
  - LANGFUSE_MINIO_SECRET
  # Web session signing.
  - LANGFUSE_NEXTAUTH_SECRET
  # NEVER rotated (`ordo secrets rotate` refuses them): SALT hashes the API keys Langfuse
  # stores and ENCRYPTION_KEY encrypts its at-rest secrets. Changing either makes stored keys
  # unmatchable and stored data unreadable - the same rule as LITELLM_SALT_KEY.
  - LANGFUSE_SALT
  - LANGFUSE_ENCRYPTION_KEY
  # Seeded first-login password for the headless-init admin user.
  - LANGFUSE_ADMIN_PASSWORD
  # The project key pair the headless init creates; Hermes presents these to send traces.
  - LANGFUSE_PUBLIC_KEY
  - LANGFUSE_SECRET_KEY
#
# IMAGE PINS - every image is `tag@sha256:`, resolved from what this host actually pulled
# (`docker inspect -f '{{index .RepoDigests 0}}' <image>`, 2026-09-14). Resolved versions:
#   langfuse / langfuse-worker  4.36.0
#   clickhouse-server           25.12.11.4
#   redis                       7.4.11
#   minio                       RELEASE.2025-09-07T16-13-09Z
#   postgres                    16-alpine (the SAME pin as ordo.render.compose.POSTGRES_IMAGE, enforced
#                               by a substrate test - see the langfuse-db comment below)
#   python (langfuse-retention) 3.11.15-slim-trixie, the same index digest ops-controller and rag
#                               build FROM (one Python base to audit)
# MinIO is pulled from quay.io, NOT docker.io: `docker.io/minio/minio` now answers "pull access
# denied … repository does not exist" (MinIO moved off Docker Hub), and the tag is the dated
# RELEASE.* one rather than `latest`, per the stack's pin-don't-float rule.
#
# NO SECRET VALUES ANYWHERE BELOW - only `${VAR}` references. They resolve from secrets.env at
# compose time (`--env-file secrets.env`), and an unset/empty one makes the service fail loudly at
# start rather than come up with a guessable default. Same reasoning as litellm-db.
services:
  - name: langfuse-db
    # This MUST stay byte-identical to ordo.render.compose.POSTGRES_IMAGE (litellm-db's pin): one Postgres
    # version across the stack, one digest to audit and bump. The manifest schema has no image-alias
    # mechanism, so the copy is enforced rather than avoided -
    # tests/substrate/test_langfuse.py::test_langfuse_db_reuses_the_substrate_postgres_pin fails if
    # the two ever drift, which makes a one-sided bump impossible to merge.
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    env:
      POSTGRES_USER: langfuse
      POSTGRES_DB: langfuse
    # The entrypoint reads POSTGRES_PASSWORD_FILE (docker-entrypoint.sh `file_env`), only at initdb.
    secret_files:
      - {key: LANGFUSE_DB_PASSWORD, env: POSTGRES_PASSWORD_FILE}
    # named volume: DB state never rides the 9p bind (same rule as litellm-db / qdrant)
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    security_opt: ["no-new-privileges:true"]
    resources: {cpus: "2", memory: "2g"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  - name: langfuse-clickhouse
    image: clickhouse/clickhouse-server:25.12@sha256:8a790dd3468db22b1d4e7b18a176f378ff5ff6053b9c48dd4ea1fa71a24c5ba6
    env:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
    # The entrypoint reads CLICKHOUSE_PASSWORD_FILE when the file exists (entrypoint.sh), and writes
    # the user XML from it on every start. materialize always writes the file (a blank required key
    # refuses to materialize), so it is never silently absent.
    secret_files:
      - {key: LANGFUSE_CLICKHOUSE_PASSWORD, env: CLICKHOUSE_PASSWORD_FILE}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    # ClickHouse opens a file per data part; docker's default 1024-descriptor ceiling makes it log
    # "Too many open files" and fail merges once the traces table has any history.
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    resources: {cpus: "4", memory: "6g"}
    # no-new-privileges applies here too. An earlier revision of this manifest left it off, claiming
    # it would block the entrypoint's root-to-clickhouse drop - that was wrong twice over: the flag
    # blocks GAINING privileges through setuid/setcap, never DROPPING them, and the running
    # container shows PID 1 already at uid 101 with an empty capability set. Verified on a FRESH,
    # root-owned volume with the flag set: the entrypoint still chowns /var/lib/clickhouse to
    # 101:101, drops to 101, and answers /ping, with no permission errors in the boot log.
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  - name: langfuse-redis
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    # noeviction: this Redis is BullMQ's job queue, not a cache. Evicting a key under memory
    # pressure silently drops queued ingestion jobs (upstream sets the same policy).
    command: ["--requirepass", "${LANGFUSE_REDIS_AUTH}", "--maxmemory-policy", "noeviction"]
    env:
      # The healthcheck authenticates from the ENVIRONMENT, not the command line: `redis-cli -a
      # <password>` puts the secret in the container's process list (and redis-cli itself warns
      # about exactly that). REDISCLI_AUTH is redis-cli's supported env form.
      REDISCLI_AUTH: ${LANGFUSE_REDIS_AUTH}
    volumes:
      - langfuse-redis-data:/data
    security_opt: ["no-new-privileges:true"]
    resources: {cpus: "1", memory: "1g"}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  - name: langfuse-minio
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    env:
      MINIO_ROOT_USER: langfuse
    # MinIO reads MINIO_ROOT_PASSWORD_FILE itself (cmd/common-main.go readFromSecret, a full path or a
    # name under /run/secrets, trimmed). A missing file is ignored rather than refused, so this relies
    # on materialize always writing it (a blank required key refuses to materialize).
    secret_files:
      - {key: LANGFUSE_MINIO_SECRET, env: MINIO_ROOT_PASSWORD_FILE}
    # ENTRYPOINT, not command: the `langfuse` bucket must exist before the server accepts the first
    # event upload, and MinIO has no "create bucket on start" flag. Upstream's compose does the
    # same mkdir-then-serve one-liner; MinIO reads a top-level directory under the data root as a
    # bucket, so this IS the bucket creation.
    entrypoint:
      - sh
      - -c
      - mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data
    volumes:
      - langfuse-minio-data:/data
    security_opt: ["no-new-privileges:true"]
    resources: {cpus: "2", memory: "2g"}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  # The two application services share one env surface (upstream merges a YAML anchor); this
  # manifest is data, so the shared keys are written out on both. Keep them in step.
  - name: langfuse-worker
    image: docker.langfuse.com/langfuse/langfuse-worker:4@sha256:25212a931e27f5d8a87cb25c81b5ccdb9f239655c1d9efb54a4378ded32c2c9e
    depends_on:
      langfuse-db: service_healthy
      langfuse-clickhouse: service_healthy
      langfuse-redis: service_healthy
      langfuse-minio: service_healthy
    env:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      # Migrations run over the native protocol (:9000); queries over HTTP (:8123).
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH}
      # S3 = the in-stack MinIO. FORCE_PATH_STYLE because MinIO serves buckets as a path segment,
      # not a DNS subdomain; the access key is MinIO's root user (`langfuse`, set above).
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_SECRET}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_SECRET}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
    security_opt: ["no-new-privileges:true"]
    resources: {cpus: "4", memory: "4g"}
    # PROBE THE BOUND ADDRESS, NOT localhost. Both Langfuse app services listen ONLY on the
    # container's eth0 address (verified live: `172.25.0.39:3000 LISTEN`, and
    # `wget http://localhost:3000` -> connection refused inside the container) - Next.js binds
    # the HOSTNAME docker sets to the container id, and the worker does the same. A localhost
    # probe can therefore never pass, and the service would sit permanently unhealthy while
    # serving traffic perfectly to every peer on the project network. `$(hostname)` is the one
    # address that is correct whether the app binds that interface or 0.0.0.0.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://$(hostname):3030/api/health\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  - name: langfuse-web
    image: docker.langfuse.com/langfuse/langfuse:4@sha256:b0556ab389af97d861185323e6dbd410464bb2b1669bd819251cb3635c291c07
    # No host port: reached through the Caddy edge (:8450) like every other UI. `worker: started`
    # (not healthy) - the two share one ClickHouse and race the same migrations; making web wait on
    # worker START orders the migration runner first without turning a slow worker into a web outage.
    depends_on:
      langfuse-db: service_healthy
      langfuse-clickhouse: service_healthy
      langfuse-redis: service_healthy
      langfuse-minio: service_healthy
      langfuse-worker: service_started
    env:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      # Single-operator stack behind Google SSO: nobody should be able to self-register a second
      # Langfuse account even if they reach the port.
      AUTH_DISABLE_SIGNUP: "true"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_SECRET}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      # Both media endpoints are the INTERNAL MinIO. Upstream points the plain one at a
      # host-published MinIO because the BROWSER follows the presigned media URL; this stack
      # publishes no MinIO port, so a browser-facing endpoint would be an unreachable link.
      # Consequence: media attachments render in the UI only from inside the project network.
      # Hermes sends none (it redacts data: URIs), so nothing in this cut depends on it.
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_SECRET}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      # HEADLESS INIT (web only). Langfuse applies these on every boot and is idempotent: it
      # creates the org/project/user/API key on a fresh DB and logs "already exists" afterwards.
      # This is what makes the plugin unattended - no click-through setup, and the project key pair
      # is known to the render BEFORE the server exists, so Hermes can be wired in the same pass.
      LANGFUSE_INIT_ORG_ID: ordo
      LANGFUSE_INIT_ORG_NAME: Ordo
      LANGFUSE_INIT_PROJECT_ID: hermes
      LANGFUSE_INIT_PROJECT_NAME: Hermes
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL}
      LANGFUSE_INIT_USER_NAME: Ordo Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD}
    security_opt: ["no-new-privileges:true"]
    resources: {cpus: "4", memory: "4g"}
    # 120s start_period: the first boot runs the Postgres AND ClickHouse migrations before the
    # server listens. A shorter grace marks it unhealthy mid-migration and restarts it into the
    # same work.
    # PROBE THE BOUND ADDRESS, NOT localhost. Both Langfuse app services listen ONLY on the
    # container's eth0 address (verified live: `172.25.0.39:3000 LISTEN`, and
    # `wget http://localhost:3000` -> connection refused inside the container) - Next.js binds
    # the HOSTNAME docker sets to the container id, and the worker does the same. A localhost
    # probe can therefore never pass, and the service would sit permanently unhealthy while
    # serving traffic perfectly to every peer on the project network. `$(hostname)` is the one
    # address that is correct whether the app binds that interface or 0.0.0.0.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://$(hostname):3000/api/public/health\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
  # TRACE RETENTION. Deletes traces older than LANGFUSE_RETENTION_DAYS using ONLY the public API: v2/observations to enumerate, DELETE
  # /api/public/traces to delete. The logic is a tracked stdlib module (langfuse_retention.py in this
  # dir, unit-tested in tests/substrate/test_langfuse_retention.py) mounted into a digest-pinned
  # python image, so there is no image to build.
  #
  # WHY A SELF-SCHEDULING SERVICE: Ordo has no general-purpose job scheduler. ops-controller only
  # arbitrates GPU leases, the existing periodic jobs (stack_monitor, storage_purge) run from Hermes
  # cron (an LLM in the loop for an irreversible delete, rejected here), n8n cannot start a
  # container and would be a second implementation, and a host Task Scheduler entry is untracked
  # per-machine config. So the job schedules itself inside its own always-on container, the same
  # shape as LiteLLM's in-process spend-log cleanup: a run five minutes after start, then daily at
  # LANGFUSE_RETENTION_RUN_AT UTC. The unit of work is the idempotent one-shot `--once`, which an
  # operator can also run by hand:
  #   docker compose -p ordo --env-file .env --env-file secrets.env run --rm langfuse-retention   #     python /app/langfuse_retention.py --once
  # A failed run is retried at the next slot and turns the container unhealthy until one succeeds.
  - name: langfuse-retention
    image: python:3.11.15-slim-trixie@sha256:6d85378d88a19cd4d76079817532d62232be95757cb45945a99fec8e8084b9c2
    depends_on:
      langfuse-web: service_healthy
    command: ["python", "/app/langfuse_retention.py", "--daemon"]
    env:
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      # RETENTION POLICY: 90 days unless `site: {LANGFUSE_RETENTION_DAYS: <n>}` in ordo.yaml puts a
      # value in .env. The default lives HERE, as a compose default scoped to its two consumers, so a
      # change to it recreates nothing else. langfuse-minio-lifecycle below carries the SAME default;
      # a substrate test keeps the two equal.
      LANGFUSE_RETENTION_DAYS: ${LANGFUSE_RETENTION_DAYS:-90}
      # 15 minutes after LiteLLM's spend-log cleanup (04:30 UTC, litellm_config.yaml), off the hour.
      LANGFUSE_RETENTION_RUN_AT: "04:45"
      PYTHONUNBUFFERED: "1"
    volumes:
      # ${BASE_PATH} (not ./): a TRACKED repo file, same rule as the monitoring plugin's scrape config.
      - ${BASE_PATH:?BASE_PATH must be set (non-empty)}/services/langfuse/langfuse_retention.py:/app/langfuse_retention.py:ro
      - ${BASE_PATH:?BASE_PATH must be set (non-empty)}/services/langfuse/secret_env.py:/app/secret_env.py:ro
    # The project key pair, read by langfuse_retention.py with secret_env.read_secret.
    secret_files: [LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY]
    security_opt: ["no-new-privileges:true"]
    resources: {cpus: "0.5", memory: "256m"}
    healthcheck:
      test: ["CMD", "python", "/app/langfuse_retention.py", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 1
      start_period: 30s
  # BLOB RETENTION. Langfuse writes every raw ingestion event (events/) and every media attachment
  # (media/) to the `langfuse` bucket and never deletes them, so trace deletion alone would leave the
  # bucket growing forever. This one-shot installs a lifecycle rule expiring objects after the same
  # LANGFUSE_RETENTION_DAYS. `mc ilm import` REPLACES the bucket's whole lifecycle configuration with
  # one fixed-ID rule, which is what makes it idempotent (`mc ilm rule add` would append a duplicate
  # rule on every start); the bucket belongs to Langfuse alone, so there is no other rule to keep.
  # The minio image ships `mc`, so this reuses the langfuse-minio pin. `on-failure`: retried while
  # MinIO is not ready, left exited after it succeeds.
  - name: langfuse-minio-lifecycle
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: on-failure
    depends_on:
      langfuse-minio: service_healthy
    # Read from its file by the script below, so it is on neither a command line nor the env.
    secret_files: [LANGFUSE_MINIO_SECRET]
    env:
      # Same default as langfuse-retention (see the comment there).
      LANGFUSE_RETENTION_DAYS: ${LANGFUSE_RETENTION_DAYS:-90}
    # `$$` is a literal `$` for the shell (compose would otherwise interpolate it). The alias is
    # built inside the container from the secret's file, so the secret never appears on a command line.
    entrypoint:
      - sh
      - -c
      - >-
        set -eu;
        case "$$LANGFUSE_RETENTION_DAYS" in ''|*[!0-9]*|0*) echo "LANGFUSE_RETENTION_DAYS must be a positive whole number of days without leading zeros" >&2; exit 2;; esac;
        minio_secret="$$(cat "$$LANGFUSE_MINIO_SECRET_FILE")";
        export MC_HOST_langfuse="http://langfuse:$$minio_secret@langfuse-minio:9000";
        printf '{"Rules":[{"ID":"ordo-langfuse-retention","Status":"Enabled","Filter":{"Prefix":""},"Expiration":{"Days":%s}}]}' "$$LANGFUSE_RETENTION_DAYS" | mc ilm import langfuse/langfuse;
        mc ilm rule ls langfuse/langfuse
    security_opt: ["no-new-privileges:true"]
    resources: {cpus: "0.5", memory: "256m"}
