# Plugin manifest (data-only) — Open WebUI chat front-end. Routes all model requests through the
# model-gateway (unified provider) and uses Qdrant for RAG vector storage, so it depends on the
# rag plugin (qdrant + embed). Reached at open-webui:8080 on the project network.
id: open-webui
name: Open WebUI (chat UI)
description: Web chat UI over the model-gateway with Qdrant-backed document RAG.
requires:
  nvidia: false
  ram_gb: 2
provides: [chat-ui]
depends_on: [rag]         # VECTOR_DB=qdrant → needs the qdrant + embed services running
compose_profile: webui
env:
  OPEN_WEBUI_ENABLED: "1"
secrets:
  - LITELLM_KEY_OPEN_WEBUI    # its own virtual key (chat + embeddings, no MCP)
litellm_key:
  models: [local-chat, local-embed]
  mcp_servers: []
services:
  - name: open-webui
    # Pinned to the exact version V1 runs (V1 uses ${OPEN_WEBUI_IMAGE:-...v0.10.1}). Pin, don't float.
    image: ghcr.io/open-webui/open-webui:v0.11.3
    # Local access while the edge is off: http://127.0.0.1:8443 (the port Caddy serves chat on).
    # The renderer binds it to loopback only and drops it when the edge is enabled.
    local_port: {host: 8443, container: 8080}
    env:
      # Env is the only source of Open WebUI's settings. With persistence on (the image default) it
      # reads env on first launch only and webui.db wins after that, so a rotated or corrected key
      # never arrives (a first-launch placeholder key emptied the model list, 2026-09-25). v0.11.3
      # has no per-setting override (only oauth.* has its own switch), so persistence is off and a
      # setting changed in the admin UI lasts until the next restart: declare it here instead.
      ENABLE_PERSISTENT_CONFIG: "false"
      ENABLE_OLLAMA_API: "false"
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE:-http://model-gateway:11435/v1}
      OPENAI_API_KEY: ${LITELLM_KEY_OPEN_WEBUI}
      WEBUI_AUTH: ${WEBUI_AUTH:-False}
      DEFAULT_MODELS: ${OPEN_WEBUI_DEFAULT_MODEL:-local-chat}
      VECTOR_DB: qdrant
      QDRANT_URI: http://qdrant:6333
      QDRANT_URL: http://qdrant:6333
      RAG_EMBEDDING_ENGINE: openai
      RAG_OPENAI_API_BASE_URL: http://model-gateway:11435/v1
      RAG_OPENAI_API_KEY: ${LITELLM_KEY_OPEN_WEBUI}
      # The gateway alias, not a GGUF filename: the scoped key may only use local-chat and local-embed.
      RAG_EMBEDDING_MODEL: local-embed
      # Operator settings formerly held only in webui.db. Web search needs the searxng-web plugin.
      ENABLE_WEB_SEARCH: ${SEARXNG_ENABLED:+true}
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: http://searxng:8080/search
      WEB_SEARCH_RESULT_COUNT: "3000"
      WEB_SEARCH_CONCURRENT_REQUESTS: "5"
      AUDIO_TTS_ENGINE: transformers
      ENABLE_USER_WEBHOOKS: "true"
    volumes:
      # NAMED VOLUME (ext4) — open-webui keeps its SQLite DB + uploads here; DB state
      # never rides the wedge-prone 9p bridge (see services/rag/plugin.yaml note).
      - open-webui-data:/app/backend/data
    depends_on: [llamacpp, model-gateway, qdrant]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      start_period: 120s
      interval: 30s
      timeout: 10s
      retries: 3
