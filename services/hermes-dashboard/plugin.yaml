# Plugin manifest (data-only) - the Hermes dashboard: the web UI and the backend every Hermes desktop
# app connects to, served at its origin root on the edge port :8447. Hermes-specific, so opt-in;
# enable it only when the chosen agent is Hermes. Distinct from the V2-native core `dashboard`.
#
# It renders NO container of its own. The dashboard runs inside the agent container as upstream's s6
# `dashboard` service, next to the s6-supervised gateways: this plugin's `env:` puts
# HERMES_DASHBOARD_ENABLED=1 in the rendered .env and services/hermes/agent.yaml turns that into
# HERMES_DASHBOARD=1 plus its bind and Google login settings. One runtime: desktop sessions have the
# gateway's tools, and the dashboard's gateway controls act on the real gateways through s6.
# (Until 2026-10 it was a separate `hermes-dashboard` container in Caddy's network namespace with a
# copied subset of the agent's runtime; desktop sessions lost tools there and its gateway status
# and controls pointed at a gateway that was not in that container.)
id: hermes-dashboard
name: Hermes dashboard (web UI and desktop apps)
description: The Hermes agent's web UI and desktop-app backend, served at its origin root on :8447.
requires:
  nvidia: false
  ram_gb: 1
provides: [hermes-dashboard]
# The UI's own edge port, declared ONCE here: the render publishes it on the edge
# listener, the dashboard card's `sso_port` is derived from it, and the tests hold the
# Caddyfile `:<port>` site (proxying `upstream`) and the tailnet sidecar to it.
edge_site: {port: 8447, upstream: "agent:9119"}
# HARD dependency on the edge (Caddy + the tailnet name): the agent publishes no host port, so the
# edge is the only way to reach the dashboard, and its public URL
# (https://hermes.<CADDY_TAILNET_DOMAIN>) is the edge's tailnet name. Declaring it means the dep gate
# drops this plugin with a clear note when the edge is off, and the wizard's _deps_closure auto-adds
# `edge` when an operator enables this one.
depends_on: [edge]
env:
  HERMES_DASHBOARD_ENABLED: "1"
# AUTH: the one UI that authenticates itself instead of sitting behind oauth2-proxy, because the
# Hermes desktop app (a remote-gateway client) cannot pass a browser SSO gate. Hermes's bundled
# self-hosted OIDC provider against Google, the same identity oauth2-proxy uses; the desktop uses
# Hermes's native (RFC 8252) flow and holds Bearer tokens. Who may sign in is decided by the IDP:
# the Google project's audience. Setup: docs/runbooks/auth.md. The agent reads both: the client ID
# as an env secret, the client secret as a file secret bridged by its boot hook.
secrets:
  - HERMES_DASHBOARD_OIDC_CLIENT_ID
  - HERMES_DASHBOARD_OIDC_CLIENT_SECRET
