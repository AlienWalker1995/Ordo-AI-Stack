# Plugin manifest (data-only) — the Hermes web dashboard (the `hermes dashboard` SPA), served at
# its origin root on the edge port :8447. V1 runs it from the SAME image as the hermes-gateway agent. It's
# Hermes-specific (uses the agent-hermes image), so it's opt-in behind its own profile; enable it
# only when the chosen agent is Hermes. Distinct from the V2-native core `dashboard` (control plane).
id: hermes-dashboard
name: Hermes dashboard (agent SPA)
description: The Hermes agent's own web chat/skill dashboard, served at its origin root on :8447.
requires:
  nvidia: false
  ram_gb: 1
provides: [hermes-dashboard]
compose_profile: hermes-ui
# The UI's own edge port, declared ONCE here: the render publishes it on the edge
# listener, the dashboard card's `sso_port` is derived from it, and the tests hold the
# Caddyfile `:<port>` site (proxying `upstream`) and the tailnet sidecar to it.
# Loopback: the service lives in caddy's network namespace (network_mode: service:caddy).
edge_site: {port: 8447, upstream: "127.0.0.1:9119"}
# HARD dependency on the edge (Caddy + oauth2-proxy), same gate tailnet-names uses.
# Caddy/oauth2-proxy/Tailscale are all OPTIONAL layers a user may not enable, so this
# must be declared rather than assumed:
#   - this service publishes NO host port (the stack's UI model — reachable only through
#     the SSO'd edge), so without the edge there is no way to reach it at all;
#   - it runs in caddy's network namespace and binds 127.0.0.1 (see the service below).
#     Without a caddy container to attach to, `network_mode: service:caddy` is not a
#     degraded mode — compose cannot start the container at all;
#   - its public URL (https://hermes.<CADDY_TAILNET_DOMAIN>) is the edge's tailnet name.
# Declaring it means the dep gate DROPS this plugin with a clear note when edge is off
# (instead of rendering a container that cannot start), and the wizard's _deps_closure
# auto-adds `edge` when an operator enables this one.
depends_on: [edge]
env:
  HERMES_DASHBOARD_ENABLED: "1"
secrets:
  - OPS_CONTROLLER_TOKEN    # required for Hermes to reach ops-controller
  - HERMES_DASHBOARD_OIDC_CLIENT_ID      # the Google OAuth client the dashboard login uses
  - HERMES_DASHBOARD_OIDC_CLIENT_SECRET  # its secret (a file secret on the service)
services:
  - name: hermes-dashboard
    # Same image as the Hermes agent (V1 builds one hermes image, runs it as gateway + dashboard).
    image: ordo/agent-hermes
    # Its Chat tab runs full agent sessions, so the same env secrets as the agent.
    secrets: [LITELLM_KEY_HERMES, OPS_CONTROLLER_TOKEN, HERMES_DASHBOARD_OIDC_CLIENT_ID]
    secret_files: [HERMES_DASHBOARD_OIDC_CLIENT_SECRET]
    # AUTH: the one UI that authenticates itself instead of sitting behind oauth2-proxy,
    # because the Hermes desktop app (a remote-gateway client) cannot pass a browser SSO gate.
    # It runs Hermes's bundled self-hosted OIDC provider against Google, the same identity
    # oauth2-proxy uses, so browser and desktop both sign in with Google; the desktop uses
    # Hermes's native (RFC 8252) flow and holds Bearer tokens. Who may sign in is decided by
    # the IDP (Hermes has no allowlist of its own): the Google project's audience, Internal to a
    # Workspace organization or External in Testing with test users. Setup: docs/runbooks/auth.md.
    #   - HERMES_DASHBOARD_PUBLIC_URL is the host the dashboard trusts, the origin it allows and
    #     the base of its OAuth callback (<public_url>/auth/callback, the redirect URI registered
    #     on the Google client). A non-loopback public URL is also what engages Hermes's login
    #     gate on this loopback bind.
    #   - The client ID is an env secret (it names the operator's Google project); the client
    #     secret is a file secret, bridged to the env var Hermes reads by the image's boot hook.
    #
    # Binds LOOPBACK inside caddy's network namespace; Caddy reaches it at 127.0.0.1:9119
    # (auth/caddy/Caddyfile :8447), and nothing else on the network can.
    #
    # TRADE-OFF, know this before touching the edge: this service now shares caddy's
    # network namespace like the tailnet sidecars do. Recreating caddy DESTROYS that
    # namespace and orphans every member (they silently lose networking while still
    # reporting healthy). The renderer couples the lifecycle automatically: because this
    # service sets `network_mode: service:caddy`, compose.py emits
    # `depends_on.caddy.restart: true`, so `docker compose up -d` / `docker compose restart
    # caddy` restart this member with caddy. `--no-deps` bypasses depends_on, so a caddy
    # recreate must name the members: `ordo recreate caddy` and ops-controller's lifecycle
    # verbs (the dashboard's Restart button) do, via `bringup.lifecycle_group`. A BARE
    # `docker restart ordo-caddy-1` won't cascade.
    command: ["hermes", "dashboard", "--port", "9119", "--host", "127.0.0.1", "--no-open"]
    network_mode: service:caddy
    env:
      PYTHONIOENCODING: utf-8
      # Chat-tab sessions trace to Langfuse like the agent's (same pair, fail-open when unset).
      HERMES_LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      HERMES_LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      OPS_CONTROLLER_URL: http://ops-controller:9000
      # Upstream's boot remaps its hermes user to this UID/GID; must match the agent's (the brain
      # volume is shared and owned 1000:1000).
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      # Dashboard login (see AUTH above): Google as the OIDC issuer, and the public URL the
      # browser and the desktop app reach it at.
      HERMES_DASHBOARD_OIDC_ISSUER: https://accounts.google.com
      HERMES_DASHBOARD_PUBLIC_URL: https://hermes.${CADDY_TAILNET_DOMAIN}
    # Derived keys it reads from the rendered .env (rendered `KEY: ${KEY?...}`, each only while the
    # render produces it). COMFYUI_URL: the ComfyUI admission gate, as for the agent (chat-tab
    # sessions run the same skills). LLAMACPP_CTX_SIZE: the context window the image's boot hook seeds
    # into the shared config.yaml, as for the agent. HERMES_MAX_TOKENS / HERMES_COMPRESSION_THRESHOLD_PERCENT
    # (`site:` knobs): this service runs the image's boot hook, which seeds model.max_tokens and
    # compression.threshold into the config.yaml it SHARES with the agent. Without them it would
    # reseed the defaults over the agent's tuned values on every restart.
    derived_env: [COMFYUI_URL, LLAMACPP_CTX_SIZE, HERMES_MAX_TOKENS, HERMES_COMPRESSION_THRESHOLD_PERCENT]
    volumes:
      # Same named volume as the agent — the dashboard reads/writes the SAME brain (skills, chat
      # sessions, cron). Must stay identical to services/hermes/agent.yaml's mount or the two
      # services diverge onto separate stores. Named, not a ${DATA_PATH} bind, because Windows-side
      # writes flip the bind's POSIX metadata to root:0700 and lock out uid 1000 — see the long
      # note in services/hermes/agent.yaml (outage 2026-08-04, 22h of silent cron failure).
      - hermes-home:/opt/data
      - hermes-home:/home/hermes/.hermes
    # caddy is REQUIRED here, not optional: network_mode: service:caddy cannot attach if
    # the target container does not exist yet.
    depends_on: [caddy, model-gateway, dashboard, ops-controller]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9119/api/status"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
