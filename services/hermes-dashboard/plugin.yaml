# Plugin manifest (data-only) — the Hermes web dashboard (the `hermes dashboard` SPA), served at
# its origin root on the edge port :8447. V1 runs it from the SAME image as the hermes-gateway agent. It's
# Hermes-specific (uses the agent-hermes image), so it's opt-in behind its own profile; enable it
# only when the chosen agent is Hermes. Distinct from the V2-native core `dashboard` (control plane).
id: hermes-dashboard
name: Hermes dashboard (agent SPA)
description: The Hermes agent's own web chat/skill dashboard, served at its origin root on :8447.
requires:
  nvidia: false
  ram_gb: 1
provides: [hermes-dashboard]
compose_profile: hermes-ui
env:
  HERMES_DASHBOARD_ENABLED: "1"
secrets:
  - OPS_CONTROLLER_TOKEN    # required for Hermes to reach ops-controller
services:
  - name: hermes-dashboard
    # Same image as the Hermes agent (V1 builds one hermes image, runs it as gateway + dashboard).
    image: ordo/agent-hermes:latest
    wants_secrets: true
    command: ["hermes", "dashboard", "--port", "9119", "--host", "0.0.0.0", "--no-open", "--insecure"]
    env:
      PYTHONIOENCODING: utf-8
      OPS_CONTROLLER_URL: http://ops-controller:9000
      LLAMACPP_CTX_SIZE: ${LLAMACPP_CTX_SIZE:-262144}
      HERMES_WEB_DIST: /opt/hermes-agent/hermes_cli/web_dist
      # ── Dashboard SSO (OIDC) ──
      # Hermes >= v0.20.0 refuses a non-loopback bind unless it has an auth provider of
      # its own, and `--insecure` no longer bypasses that. Caddy CANNOT front it with an
      # injected Authorization header (the bundled `basic` provider is login-form +
      # session-cookie only and reads no inbound header), and no provider trusts
      # oauth2-proxy's X-Auth-Request-* identity. So the dashboard speaks OIDC directly.
      #
      # Reuses the SAME Google OAuth client as oauth2-proxy (--provider=google) so there
      # is one client to manage; the operator only adds a second redirect URI to it:
      #     https://hermes.<tailnet>/auth/callback
      # Until that URI is registered, Google returns redirect_uri_mismatch and the
      # dashboard falls back to the `basic` provider — the login still works, so this is
      # safe to deploy before the console change.
      #
      # SECURITY: this provider enforces NO email allowlist of its own ("the IDP's own
      # allowlist is authoritative"), and Google does not restrict which accounts may use
      # an OAuth client. The gate that actually limits access stays oauth2-proxy's
      # --authenticated-emails-file at the edge. Do not expose :9119 outside the Caddy gate.
      HERMES_DASHBOARD_OIDC_ISSUER: ${HERMES_DASHBOARD_OIDC_ISSUER:-https://accounts.google.com}
      HERMES_DASHBOARD_OIDC_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:-}
      HERMES_DASHBOARD_OIDC_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:-}
    volumes:
      # Same named volume as the agent — the dashboard reads/writes the SAME brain (skills, chat
      # sessions, cron). Must stay identical to services/hermes/agent.yaml's mount or the two
      # services diverge onto separate stores. Named, not a ${DATA_PATH} bind, because Windows-side
      # writes flip the bind's POSIX metadata to root:0700 and lock out uid 1000 — see the long
      # note in services/hermes/agent.yaml (outage 2026-08-04, 22h of silent cron failure).
      - hermes-home:/home/hermes/.hermes
    depends_on: [model-gateway, mcp-gateway, dashboard, ops-controller]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9119/"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
