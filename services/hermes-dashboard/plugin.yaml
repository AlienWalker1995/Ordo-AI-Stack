# Plugin manifest (data-only) — the Hermes web dashboard (the `hermes dashboard` SPA), served at
# its origin root on the edge port :8447. V1 runs it from the SAME image as the hermes-gateway agent. It's
# Hermes-specific (uses the agent-hermes image), so it's opt-in behind its own profile; enable it
# only when the chosen agent is Hermes. Distinct from the V2-native core `dashboard` (control plane).
id: hermes-dashboard
name: Hermes dashboard (agent SPA)
description: The Hermes agent's own web chat/skill dashboard, served at its origin root on :8447.
requires:
  nvidia: false
  ram_gb: 1
provides: [hermes-dashboard]
compose_profile: hermes-ui
# HARD dependency on the edge (Caddy + oauth2-proxy), same gate tailnet-names uses.
# Caddy/oauth2-proxy/Tailscale are all OPTIONAL layers a user may not enable, so this
# must be declared rather than assumed:
#   - this service publishes NO host port (the stack's UI model — reachable only through
#     the SSO'd edge), so without the edge there is no way to reach it at all;
#   - it runs in caddy's network namespace and binds 127.0.0.1 (see the service below).
#     Without a caddy container to attach to, `network_mode: service:caddy` is not a
#     degraded mode — compose cannot start the container at all;
#   - Hermes >= v0.20.0 refuses a non-loopback bind without an auth provider of its own,
#     so the "just bind 0.0.0.0 instead" fallback would require a second credential and a
#     second login, which is the complexity the loopback design exists to avoid.
# Declaring it means the dep gate DROPS this plugin with a clear note when edge is off
# (instead of rendering a container that cannot start), and the wizard's _deps_closure
# auto-adds `edge` when an operator enables this one.
depends_on: [edge]
env:
  HERMES_DASHBOARD_ENABLED: "1"
secrets:
  - OPS_CONTROLLER_TOKEN    # required for Hermes to reach ops-controller
services:
  - name: hermes-dashboard
    # Same image as the Hermes agent (V1 builds one hermes image, runs it as gateway + dashboard).
    image: ordo/agent-hermes
    # Its Chat tab runs full agent sessions, so the same env secrets as the agent.
    secrets: [LITELLM_KEY_HERMES, OPS_CONTROLLER_TOKEN]
    # Binds LOOPBACK, inside caddy's network namespace. This is what keeps the whole
    # stack on ONE auth model — oauth2-proxy at the edge, nothing per-service.
    #
    # Hermes >= v0.20.0 hard-refuses a NON-loopback bind unless the dashboard registers an
    # auth provider of its own, and `--insecure` no longer bypasses it. Every way of
    # satisfying that from outside was worse:
    #   - injecting `Authorization: Basic` from Caddy is a silent no-op (the bundled
    #     `basic` provider is login-form + session-cookie only, reads no inbound header);
    #   - no provider trusts oauth2-proxy's X-Auth-Request-* identity, so the edge session
    #     cannot be handed through;
    #   - a `basic` or OIDC provider means a SECOND credential and a second login behind
    #     the SSO gate we already have.
    # Joining caddy's netns sidesteps all of it: the bind IS loopback, so v0.20.0's gate
    # never engages, and Caddy reaches it at 127.0.0.1:9119 (see auth/caddy/Caddyfile
    # :8447). No dashboard credential exists to manage, rotate, or leak.
    #
    # TRADE-OFF, know this before touching the edge: this service now shares caddy's
    # network namespace like the tailnet sidecars do. Recreating caddy DESTROYS that
    # namespace and orphans every member (they silently lose networking while still
    # reporting healthy). The renderer couples the lifecycle automatically: because this
    # service sets `network_mode: service:caddy`, compose.py emits
    # `depends_on.caddy.restart: true`, so `docker compose up -d` / `docker compose restart
    # caddy` restart this member with caddy. `--no-deps` bypasses depends_on, so a caddy
    # recreate must name the members: `ordo recreate caddy` and ops-controller's lifecycle
    # verbs (the dashboard's Restart button) do, via `bringup.lifecycle_group`. A BARE
    # `docker restart ordo-caddy-1` won't cascade.
    command: ["hermes", "dashboard", "--port", "9119", "--host", "127.0.0.1", "--no-open", "--insecure"]
    network_mode: service:caddy
    env:
      PYTHONIOENCODING: utf-8
      # Chat-tab sessions trace to Langfuse like the agent's (same pair, fail-open when unset).
      HERMES_LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      HERMES_LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      OPS_CONTROLLER_URL: http://ops-controller:9000
      LLAMACPP_CTX_SIZE: ${LLAMACPP_CTX_SIZE:-262144}
      HERMES_WEB_DIST: /opt/hermes-agent/hermes_cli/web_dist
    volumes:
      # Same named volume as the agent — the dashboard reads/writes the SAME brain (skills, chat
      # sessions, cron). Must stay identical to services/hermes/agent.yaml's mount or the two
      # services diverge onto separate stores. Named, not a ${DATA_PATH} bind, because Windows-side
      # writes flip the bind's POSIX metadata to root:0700 and lock out uid 1000 — see the long
      # note in services/hermes/agent.yaml (outage 2026-08-04, 22h of silent cron failure).
      - hermes-home:/home/hermes/.hermes
    # caddy is REQUIRED here, not optional: network_mode: service:caddy cannot attach if
    # the target container does not exist yet.
    depends_on: [caddy, model-gateway, dashboard, ops-controller]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9119/"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
