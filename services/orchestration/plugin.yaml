# Plugin manifest - data-only. Declares the orchestration MCP server: a compose service
# `mcp-orchestration` on the internal MCP network, registered with LiteLLM's MCP gateway (its tools
# reach Hermes as `gateway__orchestration-<tool>`). A STABLE adapter: exposes fixed verb names
# (list_templates / create_from_template / save_workflow / promote_workflow / rollback_workflow /
# registry parity verbs / comfyui ops ...) that delegate over HTTP to the dashboard
# control plane, insulating Hermes from shifting upstream tool names. Backing verified in V2:
# ordo/dashboard-v1 serves /api/orchestration/*.
id: orchestration
name: Orchestration (MCP tools)
description: Stable orchestration adapter (fixed verbs; delegates to the dashboard /api/orchestration control plane, not shifting gateway tool names).
kind: mcp                  # an MCP server service (agent tools), not a plain stack service
requires:
  nvidia: false
  ram_gb: 1
provides: [tools]
# No plugin-level depends_on: the target is the CORE `dashboard` service (always present, not a
# plugin), so there's no plugin dependency to gate on. (A plugin `depends_on` must name an enabled
# PLUGIN or the plugin is dropped; `dashboard` is core, so listing it would wrongly drop this MCP.)
mcp:
  # Project buildable image (build context services/orchestration): pinned by its build context,
  # so preflight reports 'build first' rather than a digest warning.
  image: ordo/orchestration-mcp:latest
  transport: http
  port: 9000
  # Reaches dashboard:8080 on the stack network (plus the internal MCP network LiteLLM dials).
  network: stack
  env:
    ORCHESTRATION_DASHBOARD_URL: http://dashboard:8080
    # No DASHBOARD_AUTH_TOKEN: the dashboard has no per-service auth (edge SSO is the only gate),
    # so this internal caller reaches dashboard:8080 over ordo-net without a Bearer.
  tools: [orchestration_readiness, list_templates, comfyui_status, list_models, gpu_status]
