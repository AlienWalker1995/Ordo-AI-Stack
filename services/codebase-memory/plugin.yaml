# Plugin manifest - data-only. Declares the codebase-memory MCP server: a compose service
# `mcp-codebase-memory` on the internal MCP network, registered with LiteLLM's MCP gateway (its
# tools reach Hermes as `gateway__codebase_memory-<tool>`). Gives Hermes a code KNOWLEDGE GRAPH over the
# repos under the code root (mounted read-only at /c/dev): structural queries grep can't do cheaply
# - call graphs, trace paths between symbols, architecture overviews, symbol/snippet lookup.
# Companion to the codebase-memory-UI (3D graph) service, but a SEPARATE process: this server
# builds its own IN-MEMORY graph, so a fresh container starts empty until index_repository is
# called (see the codebase-memory Hermes skill).
id: codebase-memory
name: Codebase Memory (MCP tools)
description: Code knowledge-graph navigation (call graphs, trace paths, architecture, snippets) over the repos under the code root, via MCP.
kind: mcp                  # an MCP server service (agent tools), not a plain stack service
requires:
  nvidia: false            # bundled offline embeddings run on CPU — no GPU
  ram_gb: 2
provides: [tools]
mcp:
  # Project buildable image (build context services/codebase-memory) from a self-contained Dockerfile
  # that downloads + sha256-verifies the pinned DeusData/codebase-memory-mcp portable binary, bundles
  # the offline nomic-embed-code embeddings, and bridges its stdio server to streamable HTTP with a
  # pinned mcp-proxy. Pinned by its build context (CBM_VERSION + CBM_SHA256), so preflight reports
  # 'build first', not a digest warning.
  image: ordo/codebase-memory-mcp:latest
  transport: http
  port: 9000
  network: internal        # 100% local indexer: only LiteLLM can reach it, it reaches nothing
  volumes:
    # Code root mounted READ-ONLY. ${CODE_ROOT} comes from the rendered .env (site.CODE_ROOT).
    - ${CODE_ROOT:-/c/dev}:/c/dev:ro
    # Persistent SQLite index on a NAMED volume, so it survives container restarts.
    - codebase-memory-cache:/cache
  env:
    CBM_CACHE_DIR: /cache
    # Keep logs off stdout so they can't corrupt the bridged stdio JSON-RPC channel.
    CBM_LOG_LEVEL: error
  tools: [index_repository, list_projects, index_status, search_graph, trace_path, query_graph, get_graph_schema, get_code_snippet, get_architecture, search_code, detect_changes, manage_adr, ingest_traces, delete_project]
