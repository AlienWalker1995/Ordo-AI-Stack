model_list:
  # local-chat: the stable auto-routing alias every consumer (Hermes, reels, dashboard) uses.
  # Backed by the GPU model; falls over to the CPU A3B via router_settings below when the GPU
  # llamacpp is evicted for a media render. DO NOT rename — lots depends on this id.
  #
  # model_info blocks are the gateway's model documentation: everything /model/info and
  # /v1/models consumers see. All deployment-variable values (__CTX_SIZE__, __N_PREDICT__,
  # __CPU_CTX_SIZE__, __*_WEIGHTS__, __GPU_IMAGE__, __*_MODEL_NAME__,
  # __GPU_SUPPORTS_VISION__, __LOCAL_INPUT_COST_PER_TOKEN__, __LOCAL_OUTPUT_COST_PER_TOKEN__)
  # are entrypoint-substituted from the SAME .env the backend llama-server containers read, so
  # this metadata: including the pickable pin-alias NAMES, the vision flag and the
  # electricity-derived per-token cost (ordo.yaml `cost:`, $0 when unset): cannot drift from
  # what's running. The cost placeholders are set in BOTH litellm_params (what LiteLLM actually
  # bills against) and model_info (what /model/info and the UI display) so the two can't
  # disagree. The remaining static supports_* flags describe the llama-server invocation itself
  # (--jinja tool templates, --reasoning-format), not any particular model family.
  - model_name: "local-chat"
    litellm_params:
      model: "openai/local-chat"
      api_base: "http://llamacpp:8080/v1"
      api_key: "local"
      timeout: 1800
      stream_timeout: 1800
      input_cost_per_token: __LOCAL_INPUT_COST_PER_TOKEN__
      output_cost_per_token: __LOCAL_OUTPUT_COST_PER_TOKEN__
    model_info:
      # Health probes are not traffic: keep them out of the logging callbacks (Langfuse). Only the
      # health-check path merges health_check_params into the probe request
      # (proxy/health_check.py::_update_litellm_params_for_health_check, on a deepcopy of the model
      # list), and `no-log` makes Logging.should_run_callback skip every non-_PROXY_ callback
      # (litellm_logging.py), so spend tracking still runs. Set on every local deployment.
      health_check_params: {"no-log": true}
      mode: chat
      max_input_tokens: __CTX_SIZE__
      # llama-server --n-predict: hard per-request generation ceiling on the GPU backend.
      max_output_tokens: __N_PREDICT__
      input_cost_per_token: __LOCAL_INPUT_COST_PER_TOKEN__
      output_cost_per_token: __LOCAL_OUTPUT_COST_PER_TOKEN__
      supports_system_messages: true
      supports_function_calling: true
      supports_tool_choice: true
      supports_response_schema: true
      supports_vision: __GPU_SUPPORTS_VISION__
      supports_reasoning: true
      description: >-
        Stable auto-routing alias — the id every Ordo consumer should use. Backed by the
        active GPU chat model on the RTX 5090 (see weights_file for the exact GGUF); fails
        over to the CPU deployment (__CPU_MODEL_NAME__) when the scheduler leases the GPU
        to a media render, and recovers automatically once the GPU model is healthy again.
      weights_file: __GPU_WEIGHTS__
      served_by: llamacpp (__GPU_IMAGE__, RTX 5090)

  # Explicit, pickable REAL models so callers/UI see WHICH model they're using, not just the
  # opaque `local-chat`. Their NAMES are derived from the deployed GGUFs by the entrypoint
  # (never hardcode a model generation here — it goes stale on the next swap):
  # __GPU_MODEL_NAME__ = the GPU chat model; __CPU_MODEL_NAME__ = the always-on CPU
  # fallback (also local-chat's failover target). The CPU one is only reachable when the
  # opt-in `llamacpp-cpu` service is running; otherwise it just sits unavailable (harmless).
  - model_name: "__GPU_MODEL_NAME__"
    litellm_params:
      model: "openai/local-chat"
      api_base: "http://llamacpp:8080/v1"
      api_key: "local"
      timeout: 1800
      stream_timeout: 1800
      input_cost_per_token: __LOCAL_INPUT_COST_PER_TOKEN__
      output_cost_per_token: __LOCAL_OUTPUT_COST_PER_TOKEN__
    model_info:
      # Probes skip the logging callbacks; see the local-chat entry.
      health_check_params: {"no-log": true}
      mode: chat
      max_input_tokens: __CTX_SIZE__
      max_output_tokens: __N_PREDICT__
      input_cost_per_token: __LOCAL_INPUT_COST_PER_TOKEN__
      output_cost_per_token: __LOCAL_OUTPUT_COST_PER_TOKEN__
      supports_system_messages: true
      supports_function_calling: true
      supports_tool_choice: true
      supports_response_schema: true
      supports_vision: __GPU_SUPPORTS_VISION__
      supports_reasoning: true
      description: >-
        Explicit pin of the GPU chat deployment (same backend as local-chat but with NO CPU
        failover routing — errors when the GPU model is evicted for a render). See
        weights_file for the exact GGUF; supports_vision reflects whether an mmproj is
        loaded on the GPU server.
      weights_file: __GPU_WEIGHTS__
      served_by: llamacpp (__GPU_IMAGE__, RTX 5090)

  - model_name: "__CPU_MODEL_NAME__"
    litellm_params:
      model: "openai/local-chat"
      api_base: "http://llamacpp-cpu:8080/v1"
      api_key: "local"
      timeout: 1800
      stream_timeout: 1800
      input_cost_per_token: __LOCAL_INPUT_COST_PER_TOKEN__
      output_cost_per_token: __LOCAL_OUTPUT_COST_PER_TOKEN__
    model_info:
      # Probes skip the logging callbacks; see the local-chat entry.
      health_check_params: {"no-log": true}
      mode: chat
      max_input_tokens: __CPU_CTX_SIZE__
      input_cost_per_token: __LOCAL_INPUT_COST_PER_TOKEN__
      output_cost_per_token: __LOCAL_OUTPUT_COST_PER_TOKEN__
      health_check_timeout: 120
      supports_system_messages: true
      supports_function_calling: true
      supports_tool_choice: true
      supports_response_schema: true
      # CPU server loads no mmproj — text-only.
      supports_vision: false
      supports_reasoning: true
      description: >-
        Always-on CPU fallback and local-chat's failover target (see weights_file for the
        exact GGUF), running CPU-only on stock llama.cpp. Context matches the GPU window
        so failover never truncates a conversation. Only reachable while the opt-in
        cpu-fallback profile (llamacpp-cpu) is running. Slow but survives GPU eviction.
      weights_file: __CPU_WEIGHTS__
      served_by: llamacpp-cpu (stock llama.cpp, CPU-only)

  # A STABLE alias for the same CPU deployment. `__CPU_MODEL_NAME__` above is substituted from the
  # deployed GGUF filename at container start, so it changes on every model swap and the renderer
  # deliberately refuses to grant a key access to it (ordo/render/engine.py, litellm_model_names).
  # That left the CPU server reachable only by an involuntary failover from local-chat.
  #
  # This alias makes it addressable ON PURPOSE. It matters because the CPU server holds no VRAM:
  # a request pinned here and a request on local-chat run genuinely in parallel against different
  # containers, instead of queueing on the one llama.cpp slot. That is the difference between a
  # fallback and a second worker.
  #
  # Same upstream, same settings as the block above; only the name is stable.
  - model_name: "local-chat-cpu"
    litellm_params:
      model: "openai/local-chat"
      api_base: "http://llamacpp-cpu:8080/v1"
      api_key: "local"
      timeout: 1800
      stream_timeout: 1800
      input_cost_per_token: __LOCAL_INPUT_COST_PER_TOKEN__
      output_cost_per_token: __LOCAL_OUTPUT_COST_PER_TOKEN__
    model_info:
      health_check_params: {"no-log": true}
      mode: chat
      max_input_tokens: __CPU_CTX_SIZE__
      input_cost_per_token: __LOCAL_INPUT_COST_PER_TOKEN__
      output_cost_per_token: __LOCAL_OUTPUT_COST_PER_TOKEN__
      health_check_timeout: 120
      supports_system_messages: true
      supports_function_calling: true
      supports_tool_choice: true
      supports_response_schema: true
      supports_vision: false
      supports_reasoning: true
      description: >-
        Stable alias for the CPU deployment, for work deliberately routed off the GPU: batch
        summarisation, classification, overnight crons. Holds no VRAM, so it runs alongside GPU
        work rather than competing with it. Slow by design, about 17 tok/s.
      weights_file: __CPU_WEIGHTS__
      served_by: llamacpp-cpu (stock llama.cpp, CPU-only)

  - model_name: "local-embed"
    litellm_params:
      model: "openai/local-embed"
      api_base: "http://llamacpp-embed:8080/v1"
      api_key: "local"
      # LiteLLM v1.82.3 serializes encoding_format as JSON null when the caller omits it,
      # and llama.cpp's strict parser 500s on that ("type must be string, but is null").
      # Pinning the OpenAI default here makes LiteLLM always send a real value.
      encoding_format: "float"
      input_cost_per_token: __LOCAL_INPUT_COST_PER_TOKEN__
      output_cost_per_token: 0
    model_info:
      # Probes skip the logging callbacks; see the local-chat entry.
      health_check_params: {"no-log": true}
      mode: embedding
      # llamacpp-embed runs --ctx-size 8192 (fixed in compose, not env-tunable).
      max_input_tokens: 8192
      input_cost_per_token: __LOCAL_INPUT_COST_PER_TOKEN__
      output_cost_per_token: 0
      output_vector_size: 768
      description: >-
        Stack-wide embedding alias: nomic-embed-text-v1.5 (768-dim, matryoshka-capable)
        served by llamacpp-embed on the RTX 5090. Used by Open WebUI RAG and rag-ingestion
        (Qdrant `documents` collection) — swapping this model invalidates existing vectors.
      weights_file: __EMBED_WEIGHTS__
      served_by: llamacpp-embed (stock llama.cpp, RTX 5090)

general_settings:
  # Read from the environment, never templated into this file (it lands in /tmp/config.yaml).
  master_key: os.environ/LITELLM_MASTER_KEY
  # config.yaml is the single source of truth for models AND MCP servers (the DB holds keys/spend).
  store_model_in_db: false
  # Proactive health routing: an evicted llamacpp (GPU lease for a render) is pulled from the pool
  # on the next probe instead of failing the first user request into the CPU fallback.
  background_health_checks: true
  health_check_interval: 60
  enable_health_check_routing: true
  health_check_ignore_transient_errors: true
  background_health_check_model_groups: ["local-chat", "local-embed"]
  # Postgres-backed keys/spend. Chat must not depend on the DB being up (private network).
  disable_error_logs: true
  proxy_batch_write_at: 60
  allow_requests_on_db_unavailable: true
  # A virtual key sees ONLY the MCP servers it is explicitly granted (bootstrap_keys.py grants them).
  require_key_mcp_access_defined: true
  # Spend-log retention (open source): the scheduler inside the proxy deletes LiteLLM_SpendLogs rows
  # older than 90 days (and the tool-index rows derived from them) every day at 04:30 UTC, in
  # bounded batches. The daily aggregate tables (LiteLLM_DailyUserSpend and friends) are NOT
  # touched, so long-term per-key cost history survives the purge.
  maximum_spend_logs_retention_period: "90d"
  maximum_spend_logs_cleanup_cron: "30 4 * * *"

router_settings:
  fallbacks: [{"local-chat": ["__CPU_MODEL_NAME__"]}]
  # Must exceed health_check_interval (the failure counter's TTL) so failures accumulate.
  cooldown_time: 120
  num_retries: 1
  # Without this, model_info.max_input_tokens is documentation only.
  enable_pre_call_checks: true

litellm_settings:
  request_timeout: 1800
  stream_timeout: 1800
  drop_params: true
  json_logs: true
  # throughput_callback posts tok/s + TTFT to the dashboard; prometheus serves /metrics for the
  # monitoring plugin. The endpoint runs unauthenticated (require_auth_for_metrics_endpoint
  # defaults to false) and is internal-network-only ONLY because the edge's SSO-bypassing
  # /llm/* route answers 404 for /metrics and /metrics/* (auth/caddy/Caddyfile). Its labels
  # carry key aliases, user emails and client IPs: keep that 404 or this endpoint is public.
  #
  # Plugin-dependent callbacks are NOT listed here: the renderer appends them at container start
  # through LITELLM_EXTRA_CALLBACKS (add_callbacks.py), e.g. `langfuse_otel` only when the langfuse
  # plugin is enabled, so this template never requires an optional plugin.
  callbacks: ["throughput_callback.throughput_recorder_instance", "prometheus"]
  require_auth_for_metrics_endpoint: false
  # Strip user_api_key_* fields from the metadata the integrations that honour this flag forward
  # (langfuse SDK, langsmith, logfire). In LiteLLM 1.100.1 the langfuse_otel callback does not
  # consult it: the key alias still reaches Langfuse as `litellm.key_alias`, which is what lets a
  # trace be filtered by consumer. Kept on so a future switch of integration does not widen what
  # leaves the gateway.
  redact_user_api_key_info: true
