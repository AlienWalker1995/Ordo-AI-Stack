# Chatterbox-TTS-Server settings for the Ordo voice service (replaces the server's own config.yaml).
server:
  host: 0.0.0.0
  port: 8004
  use_ngrok: false
  use_auth: false
  log_file_path: logs/tts_server.log
  log_file_max_size_mb: 10
  log_file_backup_count: 5
model:
  repo_id: chatterbox-turbo
tts_engine:
  device: cuda
  # Bundled voices ship in voices/; the operator's clips (data/voice/references) are mounted at
  # reference_audio/. A request's `voice` is looked up in that order.
  predefined_voices_path: voices
  reference_audio_path: reference_audio
  default_voice_id: Emily.wav
paths:
  model_cache: model_cache
  output: outputs
generation_defaults:
  temperature: 0.8
  exaggeration: 0.5
  cfg_weight: 0.5
  seed: 0
  speed_factor: 1.0
  language: en
audio_output:
  format: wav
  sample_rate: 24000
  max_reference_duration_sec: 30
  save_to_disk: false
