id: voice
name: Voice (STT + TTS)
description: Speech-to-text (faster-whisper) + text-to-speech (Kokoro), OpenAI-compatible.
requires:
  nvidia: true
  vram_gb: 4
  ram_gb: 4
provides: [voice]
compose_profile: voice
env:
  VOICE_ENABLED: "1"
# TWO compose services. CRITICAL: neither image has Blackwell kernels — they CRASH on the
# RTX 5090 and MUST run on the Pascal 1070. Under Docker Desktop/WSL2 device_ids/
# NVIDIA_VISIBLE_DEVICES are no-ops for isolation; ONLY CUDA_VISIBLE_DEVICES=GPU-<uuid> pins.
# `gpu_pin: secondary` makes render resolve the non-primary GPU's uuid and emit it. If there is
# no secondary GPU, the whole plugin is gated OFF with a warning (never fall back to the 5090 —
# that would ship a guaranteed crash).
services:
  - name: stt
    # Speech-to-text (faster-whisper, OpenAI-compatible /v1/audio/transcriptions on :8000).
    # sha-pinned for reproducibility. CTranslate2 int8 has no Blackwell kernels → Pascal 1070.
    image: fedirz/faster-whisper-server@sha256:0b64050ad0b9244745746b652473ee42a8d5454d501877a252c3e65f631ffc99
    gpu_pin: secondary
    # Resident on the SECONDARY device (the Pascal 1070) — the whole point of the pin. Declaring
    # `device: secondary` keeps it out of the primary card's VRAM budget, so Whisper/Kokoro never
    # contend with a render and a render is never told the 5090 is fuller than it is. Nothing
    # arbitrates the 1070 today: it hosts only these two, they fit together, and the arbiter
    # models one card. `preemptible: false` states that as a decision — voice is not something
    # the scheduler may reclaim — rather than leaving it to be inferred from silence.
    gpu_arbitration:
      mode: resident
      enforcement: broker
      device: secondary
      vram_gb: 1.0
      preemptible: false
      yield:
        strategy: stop
    env:
      # base.en: on the 1070 (2026-10-16) it transcribed the stack's vocabulary as well as `small`
      # (only formatting differences: "comfy UI", "14th"), in 0.35 s per clip against 0.59 s (1.07
      # worst), at about half the VRAM. tiny.en was no faster and misheard numbers ("3.87").
      # Hermes names the same model in its `stt.openai.model`; a request for another loads it too.
      WHISPER__MODEL: Systran/faster-whisper-base.en
      WHISPER__INFERENCE_DEVICE: cuda
      WHISPER__COMPUTE_TYPE: int8
      # Keep the model loaded. The server's default unloads it after 300 s idle, so the first voice
      # message after a quiet spell paid a ~19 s reload (measured 2026-10-15); resident it answers a
      # 4 s clip in ~0.5 s. Costs ~1 GB on the 1070, which has room.
      WHISPER__TTL: "-1"
    volumes:
      - ${DATA_PATH:?DATA_PATH must be set (non-empty)}/voice/hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/v1/models',timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
  - name: tts
    # Text-to-speech: Kokoro-82M behind kokoro-fastapi (OpenAI-compatible /v1/audio/speech on
    # :8880, raw `pcm` included, which Hermes streams sentence by sentence). The lightest and
    # fastest engine benchmarked on the 1070 (2026-10-16): ~0.8 GB of VRAM, first audio of a
    # sentence in 0.15-0.3 s warm, against ~7 GB and 0.9-1.9 s for Chatterbox Turbo, which it
    # replaces (per-profile cloned voices are not needed). Its weights ship in the image. Its
    # PyTorch build has no Blackwell kernels, so it must run on the secondary GPU. sha-pinned.
    image: ghcr.io/remsky/kokoro-fastapi-gpu@sha256:63176e12e476470f020e29dfb3203bac249fa66c8fdf95e44b7482546eb4e974
    gpu_pin: secondary
    gpu_arbitration:
      mode: resident
      enforcement: broker
      device: secondary
      vram_gb: 1.0
      preemptible: false
      yield:
        strategy: stop
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8880/v1/audio/voices',timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
