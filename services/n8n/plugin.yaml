# Plugin manifest - data-only. Declares the n8n MCP server: a compose service `mcp-n8n` on the
# internal MCP network, registered with LiteLLM's MCP gateway (its tools reach Hermes as
# `gateway__n8n-<tool>`). The n8n compose SERVICE itself is provided by the separate `automation`
# (kind=service) plugin; THIS plugin only bridges the local n8n instance plus the
# czlonkowski/n8n-mcp node & template catalog to Hermes.
id: n8n
name: n8n workflow automation (MCP tools)
description: n8n workflow automation exposed to the agent via MCP — bridges the local n8n instance plus the full czlonkowski/n8n-mcp node and template catalog.
kind: mcp                  # an MCP server service (agent tools), not a plain stack service
requires:
  nvidia: false
  ram_gb: 1
provides: [tools]
depends_on: [automation]   # queries the n8n service (automation kind=service plugin)
# N8N_API_KEY is the operator secret (the n8n personal API token). Declaring it here emits the key
# into secrets.env.example; the rendered MCP service reads secrets.env as a second env_file, so the
# ${...} ref below interpolates to the real value at compose time. No bearer between LiteLLM and
# this server: the bridge listens on the internal MCP network only.
secrets:
  - N8N_API_KEY
mcp:
  # Project-built bridge over the pinned upstream czlonkowski/n8n-mcp image (build context
  # services/n8n; see services/n8n/Dockerfile). The image's own MCP_MODE=http transport is
  # session-ful and LiteLLM cannot hold a session across operations, so we serve the upstream's
  # stdio server through a stateless mcp-proxy instead.
  image: ordo/n8n-mcp:latest
  transport: http
  port: 9000
  network: stack           # reaches n8n:5678
  env:
    N8N_API_URL: http://n8n:5678
    N8N_API_KEY: ${N8N_API_KEY}
    # Load-bearing again under the stdio bridge: the upstream server speaks JSON-RPC on stdout, so
    # a stray banner or INFO byte corrupts the channel mcp-proxy is reading. These also keep the
    # tool set at the full 28 rather than the docs-only subset.
    # See project memory [project_ordo_n8n_mcp_image_docs_only].
    LOG_LEVEL: error
    N8N_DIAGNOSTICS_ENABLED: "false"
    DISABLE_TELEMETRY: "true"
    # Without this every n8n_* instance verb fails with "SSRF protection: Private IP addresses not
    # allowed": n8n:5678 resolves to the docker-network address 172.25.0.6, and
    # /app/dist/utils/ssrf-protection.js defaults WEBHOOK_SECURITY_MODE to 'strict' (line 166/354).
    # `moderate` is NOT enough - validateResolvedAddress only exempts loopback under moderate and
    # still rejects PRIVATE_IP_RANGES (which include 172.16/12); `permissive` is the sole mode that
    # returns valid for a private address. The cloud-metadata and IPv6-tunnel gates run before the
    # mode branch, so they stay in force, and this server reaches the internal stack network only.
    WEBHOOK_SECURITY_MODE: permissive
  # Representative tools (the image registers the full czlonkowski catalog + n8n_* instance verbs
  # when the API key is present); LiteLLM advertises the full set at runtime.
  tools: [search_nodes, get_node, search_templates, n8n_list_workflows, n8n_create_workflow]
