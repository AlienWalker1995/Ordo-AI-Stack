# Serves the codebase-memory 3D graph UI at its ORIGIN ROOT.
#
# The upstream UI is an absolute-asset SPA (it requests /assets, /api, /rpc at the
# ORIGIN ROOT) and has no base-path option. It gets its own dedicated SSO-gated
# port at the edge (:8448), so it is served at the root it was built for — nginx
# proxies everything straight through with no path rewriting.
#
# NOTE (fonts): the 3D node labels are rendered by troika-three-text, whose glyph
# fonts are fetched from the EXTERNAL unicode-font-resolver CDN, NOT this origin
# (`${base}/font-files/${id}/...` with base = the jsdelivr lojjic path). Because
# everything is served at root now, no origin path rewriting happens at all, so
# there is nothing that could corrupt that CDN URL.
worker_processes 1;
pid /run/nginx.pid;
events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json;

    server {
        listen 9750;
        server_name _;

        location / {
            proxy_pass http://127.0.0.1:9749/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
