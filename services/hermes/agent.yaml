id: hermes
name: Hermes
description: >
  The default Ordo agent — a persistent, skill-driven orchestrator. Chats and uses tools via the
  model-gateway (LiteLLM chat + MCP gateway), and requests GPU work through the ops-controller
  scheduler.
default: true
# image omitted -> resolves to <project>/agent-hermes (tagged by `ordo build`), built from this co-located build
# context (services/hermes/ + its Dockerfile — the default, so no explicit `build:` is needed);
# pin an explicit image here to ship a prebuilt one instead.
# The agent-hermes image's default CMD is `hermes --help` (prints usage and exits); the gateway is
# started explicitly so the container runs the persistent messaging gateway (mirrors V1 compose).
command: [hermes, gateway]
# The image's entrypoint (/entrypoint.sh) runs as root to chmod the bind-mounted brain, then drops
# to the unprivileged hermes user via gosu. V1's hermes-gateway runs User=root for exactly this;
# mirror it (empty -> compose omits `user:` and the image default applies).
user: root
consumes:
  - model-gateway
  - model-gateway-keys
  - ops-controller

# Hermes' own LiteLLM virtual key (LITELLM_KEY_HERMES in secrets.env; provisioned by
# model-gateway-keys from the rendered keys.json). Chat + embeddings + EVERY enabled MCP server.
litellm_key:
  # The CPU deployment is listed so Hermes can be PINNED to it per invocation
  # (`hermes -z ... -m local-chat-cpu`), not just fall onto it when the GPU is
  # leased. That makes it addressable as a second worker: it holds no VRAM, so a CPU-pinned run
  # and a GPU-pinned run execute genuinely in parallel against different containers instead of
  # queueing on one llama.cpp slot. Without it the key returns 403 and the only way onto that
  # model is an involuntary failover.
  models: [local-chat, local-embed, local-chat-cpu]
  mcp_servers: all

# ── Runtime wiring (data, mirroring V1's hermes-gateway — see the phase-5.5 parity audit) ──
# Peers Hermes needs HEALTHY before it starts, else it spams 5xx while they warm (V1 uses
# service_healthy on the model-gateway/dashboard; ops-controller only needs to be started). The
# compose renderer emits `condition:` when a peer maps `name: <cond>` instead of a bare string.
depends_on:
  model-gateway: service_healthy
  # the one-shot that provisions LITELLM_KEY_HERMES; Hermes must never start keyless
  model-gateway-keys: service_completed_successfully
  dashboard: service_healthy
  ops-controller: service_started

# Env the container reads (non-secret; secret VALUES come from secrets.env / secret_files below).
# ${VAR:-default} refs resolve against the rendered .env at compose time (single source of truth).
# Env secrets it reads (rendered KEY: ${KEY}): its LiteLLM key (the entrypoint refuses to start
# without it) and the control-plane token (ops-router tools, reel scripts). Nothing else from
# secrets.env reaches the agent.
secrets: [LITELLM_KEY_HERMES, OPS_CONTROLLER_TOKEN]

# Derived keys it reads from the rendered .env (rendered `KEY: ${KEY?...}`; the agent never loads the
# whole file). COMFYUI_URL is the ComfyUI admission gate: the dialogue/reel/image publishers, the
# idle-reclaim cron script and the baked comfyui skill submit to it. Without it they fall back to a
# direct ComfyUI address, which bypasses the GPU lease. Rendered only while comfyui is enabled.
# LLAMACPP_CTX_SIZE: the context window (llamacpp KV / gateway max_input_tokens / the dashboard
# progress bar); the entrypoint seeds it into $HERMES_HOME/config.yaml and refuses to start without it.
# HERMES_MAX_TOKENS / HERMES_COMPRESSION_THRESHOLD_PERCENT (`site:` knobs, present only when set): the
# entrypoint seeds them into config.yaml; unset, it keeps its own defaults. Compaction triggers at that
# fraction (0-1) of the effective input budget (context_length - max_tokens), see
# agent/context_compressor.py::_compute_threshold_tokens; raising it compacts LATER.
derived_env: [COMFYUI_URL, LLAMACPP_CTX_SIZE, HERMES_MAX_TOKENS, HERMES_COMPRESSION_THRESHOLD_PERCENT]

environment:
  PYTHONIOENCODING: utf-8
  # The control plane: GPU leases, /status, /model-config, and the container/compose verbs the
  # ops-router tools call (services/hermes/ops_client.py). One service, one URL.
  OPS_CONTROLLER_URL: http://ops-controller:9000
  # STT provider base URL — the local faster-whisper service (voice profile). Harmless if voice off.
  STT_OPENAI_BASE_URL: ${STT_OPENAI_BASE_URL:-http://stt:8000/v1}
  HERMES_MAX_TURNS: ${HERMES_MAX_TURNS:-90}
  HERMES_GATEWAY_TIMEOUT: ${HERMES_GATEWAY_TIMEOUT:-3600}
  # Cron idle watchdog (seconds). scheduler.py reads THIS env var (os.getenv HERMES_CRON_TIMEOUT,
  # else a hardcoded 600). config.yaml's `cron.idle_timeout_seconds` is NOT wired to the cron
  # watchdog — do not rely on it. Raised to 3000 so long single-slot local-chat turns (reel,
  # reel-metrics, job-monitor) aren't killed mid-generation. Real fix for the single-slot
  # bottleneck is llamacpp parallelism / streaming; this stops the false-hang kills meanwhile.
  HERMES_CRON_TIMEOUT: ${HERMES_CRON_TIMEOUT:-3000}
  HERMES_API_MAX_RETRIES: ${HERMES_API_MAX_RETRIES:-10}
  # 24h — keeps the streaming stale-detector from killing slow local-model turns mid-flight.
  HERMES_STREAM_STALE_TIMEOUT: ${HERMES_STREAM_STALE_TIMEOUT:-86400}
  # ── Langfuse tracing (the bundled `observability/langfuse` plugin) ──
  # FAIL-OPEN BY DESIGN, and that is why there is no `depends_on: langfuse-web` below: with the
  # langfuse plugin disabled both keys interpolate to "", the plugin's _get_langfuse() returns
  # None once, and every hook short-circuits. Hermes must never depend on its own telemetry
  # being up - a trace store outage would otherwise take the agent down with it.
  # The keys are interpolated from secrets.env under their LANGFUSE_*
  # names, because they are the SAME project key pair the langfuse plugin's headless init
  # creates; this maps them onto the HERMES_LANGFUSE_* names the plugin reads. One pair, one
  # source of truth, no second place to update after a rotation.
  HERMES_LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  HERMES_LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  # Traces go DIRECTLY to the web service over the project network, never through the edge:
  # the SSO gate would 302 a non-browser client, and the ingest path needs no front door.
  HERMES_LANGFUSE_BASE_URL: ${HERMES_LANGFUSE_BASE_URL:-http://langfuse-web:3000}
  # Environment tag on every trace. The gateway ALSO traces every LLM call it serves, Hermes's
  # included, under `gateway` (LiteLLM 1.100.1 has no OSS way to exclude one key from a callback),
  # so this tag is what separates Hermes's richer turn/tool traces from the gateway's copy of the
  # same generations. Filter dashboards by environment. See services/langfuse/README.md.
  HERMES_LANGFUSE_ENV: hermes
  # ── Hermes API server (the OpenAI-compatible endpoint the `evals` runner drives) ──
  # OFF unless HERMES_API_SERVER_KEY is set. The key is declared by the evals plugin's `secrets:`,
  # so it exists in secrets.env only when that plugin is enabled; everywhere else the ref
  # interpolates to "" and entrypoint.sh unsets all three vars before the gateway starts. Hermes
  # itself reads these three env vars (gateway/config.py::_apply_env_overrides) and refuses a key
  # shorter than 16 characters. Mapped straight onto API_SERVER_KEY (not passed under its own name)
  # because Hermes strips API_SERVER_KEY from every terminal-tool subprocess environment; a second
  # copy under another name would be readable by any command the agent runs.
  # Bound on 0.0.0.0 INSIDE the container so peers on the project network can reach
  # http://agent:8642/v1; the agent service publishes no host port and no Caddy route points at it.
  # Anyone holding the key can run Hermes with its full toolset: the key is internal-only.
  API_SERVER_KEY: ${HERMES_API_SERVER_KEY:-}
  API_SERVER_HOST: 0.0.0.0
  API_SERVER_PORT: "8642"
  DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
  # Discord VOICE is on the SUPPORTED surface only (an auto-join adapter patch was tried
  # and removed 2026-08-05 — see the lessons block in this dir's Dockerfile): the operator
  # runs /voice join once, and config.yaml sets
  # `discord.voice_channel_inactivity_timeout_seconds: 0` so the bot stays resident in the
  # channel. STT = local faster-whisper (STT_OPENAI_BASE_URL above); TTS = local Kokoro
  # (tts.openai.base_url in config.yaml).
  DISCORD_ALLOWED_CHANNELS: ${DISCORD_ALLOWED_CHANNELS:-}
  DISCORD_ALLOWED_ROLES: ${DISCORD_ALLOWED_ROLES:-}
  DISCORD_REQUIRE_MENTION: ${DISCORD_REQUIRE_MENTION:-true}
  DISCORD_FREE_RESPONSE_CHANNELS: ${DISCORD_FREE_RESPONSE_CHANNELS:-}
  DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL:-}
  DISCORD_AUTO_THREAD: ${DISCORD_AUTO_THREAD:-true}
  DISCORD_REACTIONS: ${DISCORD_REACTIONS:-true}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}

# Mounts. THE BRAIN is a NAMED VOLUME, deliberately not a host bind — see below. /workspace/data
# holds the mutable data the skills reference by absolute path (/workspace/data/drafts,
# /workspace/data/social-relay, /workspace/data/comfyui-output, …); ${DATA_PATH} IS that data
# subtree, so it mounts at /workspace/data. /c/dev is the load-bearing mirror mount (sibling
# repos + the Ordo runtime dir) — keep the path name exactly.
#
# WHY THE BRAIN IS A NAMED VOLUME (was `${DATA_PATH}/hermes:/home/hermes/.hermes`):
# The gateway runs as uid 1000 (hermes) — the entrypoint drops from root via gosu, and that user
# is the security boundary for the agent's execute_code sandbox. On Docker Desktop/Windows the
# host bind is DrvFs/9p, where POSIX ownership is synthesized from Windows ACLs. Any Windows-side
# write into the tree can discard that metadata and flip directories back to `root:root 0700`.
# uid 1000 then loses the TRAVERSE bit on its own home and every path under it becomes
# unreadable. That happened 2026-08-04 15:00 UTC: cron read no jobs.json for 22h (~29 missed
# runs), Discord could not create pairing/discord-approved.json, and kanban.db failed to open.
# The entrypoint's `chmod -R a+rwX` repairs this, but only ONCE at container start — a mid-run
# flip is never rechecked, and nothing crashes, so `restart: unless-stopped` never fires.
# A named volume lives on ext4 inside the WSL2 VM, where the container owns the metadata outright
# and Windows has no path to it. That removes the failure mode instead of repairing it on a timer.
# Root group so the unprivileged `hermes` user can reach the root:root docker.sock (mode 660)
# mounted below — without it the mount is present but every docker call gets EACCES (the bug
# that made Hermes report "no docker access" despite the socket being mounted).
group_add: ["0"]

volumes:
  - hermes-home:/home/hermes/.hermes                           # THE BRAIN (named volume — see above)
  - ${DATA_PATH:?DATA_PATH must be set (non-empty)}:/workspace/data                       # staged mutable data (skills' /workspace/data/*)
  # The SAME volume, mounted a second time at the path skills hardcode. Cron jobs invoke scripts as
  # /workspace/data/hermes/skills/... (absolute), so both paths MUST resolve to one object; binding
  # only /home/hermes/.hermes would leave this path pointing at the retired host copy and silently
  # run stale scripts. Compose orders mounts parent-before-child, so this lands on top of the line
  # above. Keep these two entries in sync — they are one store with two names.
  - hermes-home:/workspace/data/hermes                         # same volume, skills' absolute path
  - ${CODE_ROOT:-/c/dev}:/c/dev                                # mirror mount (load-bearing path name)
  # Full Docker control of this host (operator-granted 2026-08-09). The docker CLI is already in the
  # image; this mount is the only enabler. Guardrails are PROMPTING, not enforcement: SOUL.md mandates
  # lease-before-GPU (a leaseless GPU job BSOD'd the box 2026-08-08) and no self/persistent-volume
  # destruction. See docs/design/hermes-owns-docker.md.
  - /var/run/docker.sock:/var/run/docker.sock

# File-delivered secrets (ordo/render/secret_files.py): each is mounted read-only at
# /run/secrets/<key lowercased>, kept out of `docker inspect`, and the render sets <KEY>_FILE to that
# path; the entrypoint bridges each *_FILE to the plain var the app reads.
secret_files: [DISCORD_BOT_TOKEN, GITHUB_BACKUP_PAT]

# gateway_state.json is written by `hermes gateway` on startup (Docker mode writes no pid file).
#
# Probe AS uid 1000 (gosu hermes), never as root. The previous check was
# `test -f .../gateway_state.json`, which could not detect the 2026-08-04 outage for three reasons:
#   1. it ran as ROOT, so mode-0700 root-owned dirs — the exact fault — looked fine;
#   2. it tested EXISTENCE, and the file is written once at startup, so it stays true forever;
#   3. it never touched anything the agent actually depends on at runtime.
# Result: `healthy`, FailingStreak=0, for 22h of total cron/Discord failure. These probes assert
# what the gateway genuinely needs — that the unprivileged user can still READ its state and WRITE
# its home — so a permission flip trips the healthcheck within ~90s (3 × 30s) instead of never.
# The cron leg is guarded on the directory existing so a fresh install (no jobs yet, scheduler has
# not created cron/) does not report unhealthy. timeout is 10s: three gosu spawns under 9p load.
healthcheck:
  test: ["CMD-SHELL", "gosu hermes test -r /home/hermes/.hermes/gateway_state.json && gosu hermes test -w /home/hermes/.hermes && { [ ! -d /home/hermes/.hermes/cron ] || gosu hermes test -w /home/hermes/.hermes/cron; }"]
  start_period: 60s
  interval: 30s
  timeout: 10s
  retries: 3
