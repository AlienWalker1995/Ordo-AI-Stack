  - name: tailnet-comfy
    image: tailscale/tailscale:v1.98.4@sha256:2eeac25816c4e0ff5a28ed914d413477c2cbf2ac9b73c1bf6d6e116fe9dda7f0
    network_mode: service:caddy
    wants_secrets: true
    depends_on: [caddy]
    env:
      TS_HOSTNAME: comfy
      TS_STATE_DIR: /var/lib/tailscale
