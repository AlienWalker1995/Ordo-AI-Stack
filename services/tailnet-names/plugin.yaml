      retries: 3
  - name: tailnet-hermes
    image: tailscale/tailscale:v1.98.4@sha256:25cde9ad76020b0e29229136d0c38b5962e9a0e1774ffac9b0df68e4a37d6cf0
    network_mode: service:caddy
    secrets: [TS_AUTHKEY]
    depends_on: [caddy]
    env:
      TS_HOSTNAME: hermes
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ts-state-hermes:/var/lib/tailscale
      - ${BASE_PATH:?BASE_PATH must be set (non-empty)}/assets/tailscale-serve/hermes.json:/config/serve.json:ro
    healthcheck:
      test: ["CMD", "tailscale", "status", "--peers=false"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
  - name: tailnet-graph
    image: tailscale/tailscale:v1.98.4@sha256:25cde9ad76020b0e29229136d0c38b5962e9a0e1774ffac9b0df68e4a37d6cf0
    network_mode: service:caddy
    secrets: [TS_AUTHKEY]
    depends_on: [caddy]
    env:
      TS_HOSTNAME: graph
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ts-state-graph:/var/lib/tailscale
      - ${BASE_PATH:?BASE_PATH must be set (non-empty)}/assets/tailscale-serve/graph.json:/config/serve.json:ro
    healthcheck:
      test: ["CMD", "tailscale", "status", "--peers=false"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
  # llm.<tailnet> - the LiteLLM admin UI at /ui/ (model-gateway's browsable face; swagger at /).
  # Added so model-gateway stops being the one user-facing service without a subdomain.
  # It fronts caddy :8449 (an ORIGIN ROOT), NOT the :443 `/llm/*` route: that route strips
  # its prefix and the admin UI / swagger then emit root-absolute `/ui/_next/*` /
  # `/swagger/*` asset paths, which escape the handler and 404 - the HTML loads and the page
  # renders blank. `/llm/*` stays as the SSO-BYPASSING programmatic API base for
  # Cline/Cursor (LITELLM_MASTER_KEY bearer); this subdomain is the human entry and is
  # SSO-gated like every other one.
  - name: tailnet-llm
    image: tailscale/tailscale:v1.98.4@sha256:25cde9ad76020b0e29229136d0c38b5962e9a0e1774ffac9b0df68e4a37d6cf0
    network_mode: service:caddy
    secrets: [TS_AUTHKEY]
    depends_on: [caddy]
    env:
      TS_HOSTNAME: llm
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ts-state-llm:/var/lib/tailscale
      - ${BASE_PATH:?BASE_PATH must be set (non-empty)}/assets/tailscale-serve/llm.json:/config/serve.json:ro
    healthcheck:
      test: ["CMD", "tailscale", "status", "--peers=false"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
  # langfuse.<tailnet> - the self-hosted Langfuse web app (agent traces/datasets/evals),
  # fronting caddy :8450. This sidecar is what makes LANGFUSE_PUBLIC_URL the clean subdomain
  # rather than the :8450 port root (ordo/render.py::langfuse_public_url reads the same
  # TAILNET_NAMES_ENABLED signal), and Langfuse's own post-login redirect is built from that
  # value - so the name here and the derived URL must stay the same word: `langfuse`.
  # Harmless when the langfuse plugin is disabled: the sidecar rides the edge profile and
  # proxies a Caddy port that simply has no upstream, exactly like any other sidecar whose
  # service is off.
  - name: tailnet-langfuse
    image: tailscale/tailscale:v1.98.4@sha256:25cde9ad76020b0e29229136d0c38b5962e9a0e1774ffac9b0df68e4a37d6cf0
    network_mode: service:caddy
    secrets: [TS_AUTHKEY]
    depends_on: [caddy]
    env:
      TS_HOSTNAME: langfuse
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ts-state-langfuse:/var/lib/tailscale
      - ${BASE_PATH:?BASE_PATH must be set (non-empty)}/assets/tailscale-serve/langfuse.json:/config/serve.json:ro
    healthcheck:
      test: ["CMD", "tailscale", "status", "--peers=false"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
