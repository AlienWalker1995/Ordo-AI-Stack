    volumes:
      - ts-state-comfy:/var/lib/tailscale
      - ${BASE_PATH:?BASE_PATH must be set (non-empty)}/assets/tailscale-serve/comfy.json:/config/serve.json:ro
    healthcheck:
      test: ["CMD", "tailscale", "status", "--peers=false"]
      start_period: 30s
      interval: 30s
