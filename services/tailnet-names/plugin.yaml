  - name: tailnet-graph
    image: tailscale/tailscale:v1.98.4@sha256:2eeac25816c4e0ff5a28ed914d413477c2cbf2ac9b73c1bf6d6e116fe9dda7f0
    network_mode: service:caddy
    wants_secrets: true
    depends_on: [caddy]
    env:
      TS_HOSTNAME: graph
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ts-state-graph:/var/lib/tailscale
      - ${BASE_PATH:-.}/assets/tailscale-serve/graph.json:/config/serve.json:ro
    healthcheck:
      test: ["CMD", "tailscale", "status", "--peers=false"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
  # llm.<tailnet> — the LiteLLM Swagger UI (model-gateway's browsable face).
  # Added so model-gateway stops being the one user-facing service without a subdomain.
  # It fronts caddy :8449 (an ORIGIN ROOT), NOT the :443 `/llm/*` route: that route strips
  # its prefix and LiteLLM then emits root-absolute `/swagger/*` asset paths, which escape
  # the handler and 404 — the HTML loads and the page renders blank. `/llm/*` stays as the
  # SSO-BYPASSING programmatic API base for Cline/Cursor (LITELLM_MASTER_KEY bearer);
  # this subdomain is the human entry and is SSO-gated like every other one.
  - name: tailnet-llm
    image: tailscale/tailscale:v1.98.4@sha256:2eeac25816c4e0ff5a28ed914d413477c2cbf2ac9b73c1bf6d6e116fe9dda7f0
    network_mode: service:caddy
    wants_secrets: true
    depends_on: [caddy]
    env:
      TS_HOSTNAME: llm
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ts-state-llm:/var/lib/tailscale
      - ${BASE_PATH:-.}/assets/tailscale-serve/llm.json:/config/serve.json:ro
    healthcheck:
      test: ["CMD", "tailscale", "status", "--peers=false"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
