# Ordo — packaging so the render substrate installs as a real one-command tool:
#   pip install -e .          ->   ordo init | render | up | recreate | preflight | doctor | parity
#   pip install -e ".[serve]" ->   also `ordo serve` (the control plane; ops-controller's image)
# Editable (-e): the CLI works on a repo checkout (services/, catalog/, auth/ beside ordo/), so a
# plain `pip install .` would point every repo path into site-packages.
# The core runtime dependency is only PyYAML (the render engine is otherwise stdlib: this is the
# "core runs anywhere, offline-capable after an online install" requirement).
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ordo"
version = "1.0.0"
description = "Ordo — a portable, self-configuring, hardware-right-sizing AI stack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# Kept in step with services/ops-controller/requirements.txt, which pins the exact versions.
serve = ["fastapi>=0.141,<1", "uvicorn>=0.53,<1", "pydantic>=2.13,<3", "httpx>=0.28,<1"]

[project.scripts]
ordo = "ordo.cli:main"

[tool.setuptools]
packages = ["ordo", "ordo.render", "ordo.control", "ordo.host"]

# Ship the curated catalog + service manifests with the package (data the CLI reads by default).
[tool.setuptools.package-data]
ordo = ["../catalog/*.yaml", "../services/**/*.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["ordo", "services", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Imports intentionally ordered after _state_lock / app for readability
"services/dashboard/dashboard/app.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["dashboard", "ordo"]

[tool.pytest.ini_options]
tmp_path_retention_policy = "none"
asyncio_mode = "auto"
# Collect ONLY the real suite. A bare `pytest` used to recurse into vendored trees under
# data/comfyui-storage/** (custom-node test files that error on import) and into rendered/tmp
# output dirs, producing ~134 collection errors. Scoping collection to tests/ + excluding the
# non-source dirs makes `pytest` and `pytest tests/` behave identically.
testpaths = ["tests"]
norecursedirs = ["data", "models", "out", "secrets", "tmp*", ".git", "*.egg-info"]
# services/ reorg import root: tests import the dashboard package as
# `from dashboard.X import Y` without editing any import statement. (A second entry for the
# retired media worker was removed with it, 2026-07-31 #133.)
# services/evals is the eval harness package root (tests/evals imports `ordo_evals`); in the
# container the same directory is bind-mounted at /app with PYTHONPATH=/app.
# services/rag lets tests/rag import `ingest` directly (services/rag/ingest.py), so the hidden-path
# exclusion rule the E6 fix relies on (see tests/rag/test_ingest.py) is exercised against the real
# module, not a copy.
pythonpath = ["services/dashboard", "services/evals", "services/rag"]
