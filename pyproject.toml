# Ordo — packaging so the render substrate installs as a real one-command tool:
#   pip install .   ->   ordo detect | render | preflight | serve | setup | doctor | parity
# Runtime dependency is only PyYAML (the render engine is otherwise stdlib — this is the
# "core runs anywhere, offline-capable after an online install" requirement).
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ordo"
version = "1.0.0"
description = "Ordo — a portable, self-configuring, hardware-right-sizing AI stack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
ordo = "ordo.cli:main"

[tool.setuptools]
packages = ["ordo"]

# Ship the curated catalog + plugin manifests with the package (data the CLI reads by default).
[tool.setuptools.package-data]
ordo = ["../catalog/*.yaml", "../plugins/**/*.yaml"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["ordo", "services/v1-parity/dashboard", "tests", "services/rag", "scripts", "services/worker", "docker", "hermes", "services/qdrant-rag"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Imports intentionally ordered after _state_lock / app for readability
"services/v1-parity/dashboard/app.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["dashboard", "ordo"]

[tool.pytest.ini_options]
tmp_path_retention_policy = "none"
asyncio_mode = "auto"
# Collect ONLY the real suite. A bare `pytest` used to recurse into vendored trees under
# data/comfyui-storage/** (custom-node test files that error on import) and into rendered/tmp
# output dirs, producing ~134 collection errors. Scoping collection to tests/ + excluding the
# non-source dirs makes `pytest` and `pytest tests/` behave identically.
testpaths = ["tests"]
norecursedirs = ["data", "models", "out", "secrets", "tmp*", ".git", "*.egg-info"]
# services/ reorg import roots (keeps every `import` resolving without editing any import stmt):
#   - services/v1-parity -> `import dashboard` (the v1-parity dashboard package, 22 test files
#     + services/worker/worker.py do `from dashboard.X import Y`)
#   - services            -> `import worker.worker` (worker is now services/worker/; the
#     orchestration e2e tests run the worker inline via `from worker.worker import ...`)
pythonpath = ["services/v1-parity", "services"]
